<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian — Time, Zones & Dates</title>
<meta name="description" content="World clock, interactive time-zone map, historical time-zone converter, elapsed-time and date calculators, calendar, This Day in History, Easter, Friday the 13th, astronomy and time-unit reference.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%232c4bd6'/%3E%3Cpath d='M32 4v56M4 32h56' stroke='%23fff' stroke-opacity='.35' stroke-width='3'/%3E%3Cellipse cx='32' cy='32' rx='12' ry='28' fill='none' stroke='%23fff' stroke-opacity='.5' stroke-width='3'/%3E%3Cpath d='M32 32l10-8' stroke='%23ffc65c' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try { const s = JSON.parse(localStorage.getItem('meridian.settings') || '{}'); if (s.theme && s.theme !== 'system') document.documentElement.dataset.theme = s.theme; } catch (e) {}
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="currentColor"/><path d="M32 4v56M4 32h56" stroke="#fff" stroke-opacity=".35" stroke-width="3"/><ellipse cx="32" cy="32" rx="12" ry="28" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3"/><path d="M32 32l10-8" stroke="#ffc65c" stroke-width="5" stroke-linecap="round"/></svg>
      <div><div class="brand-name">Meridian</div><div class="brand-sub">Time · Zones · Dates</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">All calculations run in your browser.</div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn nav-toggle" id="navToggle" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <button class="search-trigger" id="searchTrigger" aria-label="Search tools, cities and time zones (Ctrl+K)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span>Search tools, cities, dates…</span>
        <kbd>Ctrl K</kbd>
      </button>
      <div class="topbar-right">
        <div class="top-clock" id="topClock" aria-live="off" title="Your local time"></div>
        <button class="chip-btn" id="fmtToggle" aria-label="Toggle 12/24-hour time" title="12/24-hour time">24h</button>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        </button>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <section class="view" id="view-home" data-view="home"></section>
      <section class="view" id="view-clock" data-view="clock" hidden></section>
      <section class="view" id="view-map" data-view="map" hidden></section>
      <section class="view" id="view-convert" data-view="convert" hidden></section>
      <section class="view" id="view-calc" data-view="calc" hidden></section>
      <section class="view" id="view-calendar" data-view="calendar" hidden></section>
      <section class="view" id="view-history" data-view="history" hidden></section>
      <section class="view" id="view-explorer" data-view="explorer" hidden></section>
      <section class="view" id="view-holidays" data-view="holidays" hidden></section>
      <section class="view" id="view-utils" data-view="utils" hidden></section>
      <section class="view" id="view-units" data-view="units" hidden></section>
      <section class="view" id="view-weather" data-view="weather" hidden></section>
      <section class="view" id="view-settings" data-view="settings" hidden></section>
    </main>
  </div>
</div>

<div class="palette-backdrop" id="palette" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Search">
    <div class="palette-input-row">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="paletteInput" type="text" autocomplete="off" spellcheck="false" placeholder="Try “Tokyo”, “Easter”, “2011-08-04”, “1312518600” or “9:30 PM PST in Berlin”" role="combobox" aria-expanded="true" aria-controls="paletteList" aria-autocomplete="list">
      <kbd>Esc</kbd>
    </div>
    <ul id="paletteList" class="palette-list" role="listbox"></ul>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>

<script src="js/vendor/d3.min.js"></script>
<script src="js/vendor/topojson-client.min.js"></script>
<script src="js/engine.js"></script>
<script src="js/data.js"></script>
<script src="js/app/core.js"></script>
<script src="js/app/home.js"></script>
<script src="js/app/clock.js"></script>
<script src="js/app/map.js"></script>
<script src="js/app/convert.js"></script>
<script src="js/app/calc.js"></script>
<script src="js/app/calendar.js"></script>
<script src="js/app/history.js"></script>
<script src="js/app/explorer.js"></script>
<script src="js/app/holidays.js"></script>
<script src="js/app/utils.js"></script>
<script src="js/app/units.js"></script>
<script src="js/app/weather.js"></script>
<script src="js/app/settings.js"></script>
<script src="js/app/main.js"></script>
</body>
</html>
