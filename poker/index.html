      name: str(t.name, 40), sb: num(t.sb), bb: num(t.bb, 1), ante: num(t.ante), baseSb: num(t.baseSb), baseBb: num(t.baseBb),
      maxSeats: int(t.maxSeats, 2, 9, 9), timer: int(t.timer, 0, 600, 0), rebuys: bool(t.rebuys), maxRebuys: int(t.maxRebuys, 0, 99, 0),
      recordHole: oneOf(t.recordHole, ['All', 'Showdown'], 'Showdown'), startingStack: num(t.startingStack),
      variant: oneOf(t.variant, Object.keys(VARIANTS), 'NLHE'), holeCount: int(t.holeCount, 2, 5, 2), limit: oneOf(t.limit, ['nl', 'pl', 'fl'], 'nl'),
      levelHands: int(t.levelHands, 0, 1000, 0), level: int(t.level, 0, 1000, 1), hostPlays: bool(t.hostPlays),
      nextLevelIn: int(t.nextLevelIn, 0, 1000, 0), botTakeover: bool(t.botTakeover), vsBots: bool(t.vsBots), sra: bool(t.sra),
      spectators: bool(t.spectators), viewerChat: bool(t.viewerChat), botChat: bool(t.botChat), listed: bool(t.listed),
      hostAdjust: bool(t.hostAdjust), hostKick: bool(t.hostKick),
    };
    table.variantName = VARIANTS[table.variant].name;
    const seat = (s, i) => (s && typeof s === 'object' ? {
      seat: i, pid: str(s.pid, 24), name: str(s.name, 24), stack: num(s.stack), bet: num(s.bet), cards: cards(s.cards, 5),
      inHand: bool(s.inHand), folded: bool(s.folded), allIn: bool(s.allIn), sittingOut: bool(s.sittingOut), busted: bool(s.busted),
      disconnected: bool(s.disconnected), isHost: bool(s.isHost), isYou: bool(s.isYou), button: bool(s.button), sb: bool(s.sb), bb: bool(s.bb),
      toAct: bool(s.toAct), won: num(s.won), handName: str(s.handName, 60) || null, shown: bool(s.shown), mucked: bool(s.mucked),
      lastAction: oneOf(s.lastAction, ACTS, null), lastTo: num(s.lastTo), isBot: bool(s.isBot), botPlaying: bool(s.botPlaying), botLabel: str(s.botLabel, 20) || null,
    } : null);

      t: 'state', table, shuffling: bool(v.shuffling), fair: v.fair, // fair proofs are validated by the Checker itself
      sraWait: Array.isArray(v.sraWait) ? v.sraWait.slice(0, 9).map((x) => str(x, 24)) : [], voided: bool(v.voided),
      status: oneOf(v.status, ['lobby', 'playing', 'ended'], 'lobby'), paused: bool(v.paused), waiting: bool(v.waiting),
      handNo: int(v.handNo, 0, 1e9, 0), phase: oneOf(v.phase, ['betting', 'deal', 'showdown', 'settle', 'done'], null),
      street: str(v.street, 20), board: (cards(v.board, 5) || []).filter(Boolean),
      pots: Array.isArray(v.pots) ? v.pots.slice(0, 10).map((p) => ({ label: str(p && p.label, 20), amount: num(p && p.amount) })) : [],
      potTotal: num(v.potTotal),
      seats: Array.isArray(v.seats) ? v.seats.slice(0, table.maxSeats).map(seat) : [],
      legal: L && {
        player: int(L.player, 0, 9, 0), canCheck: bool(L.canCheck), toCall: num(L.toCall), callTo: num(L.callTo), canRaise: bool(L.canRaise),
        minTo: num(L.minTo), maxTo: num(L.maxTo), isBet: bool(L.isBet), currentBet: num(L.currentBet), myBet: num(L.myBet), stack: num(L.stack),
        pot: num(L.pot), reopenBlocked: bool(L.reopenBlocked), capped: bool(L.capped), limit: oneOf(L.limit, ['nl', 'pl', 'fl'], 'nl'), betSize: num(L.betSize), capReached: bool(L.capReached),
      },

      results: v.results && typeof v.results === 'object' ? {
        showdown: bool(v.results.showdown), winCards: (cards(v.results.winCards, 10) || []).filter(Boolean),
        lines: Array.isArray(v.results.lines) ? v.results.lines.slice(0, 12).map((l) => str(l, 160)) : [],
      } : null,
      you: y && {
        pid: str(y.pid, 24), name: str(y.name, 24), seat: int(y.seat, 0, 8, null), isHost: bool(y.isHost), inHand: bool(y.inHand), dealt: bool(y.dealt),
        sittingOut: bool(y.sittingOut), busted: bool(y.busted), stack: num(y.stack), autoMuck: bool(y.autoMuck), canShow: bool(y.canShow),
        canRebuy: bool(y.canRebuy), toCallPreview: num(y.toCallPreview),

        pid: str(p && p.pid, 24).replace(/[^\w-]/g, ''), name: str(p && p.name, 24), seat: int(p && p.seat, 0, 8, null), stack: num(p && p.stack),
        connected: bool(p && p.connected), sittingOut: bool(p && p.sittingOut), busted: bool(p && p.busted), isHost: bool(p && p.isHost),
        isBot: bool(p && p.isBot), rebuys: int(p && p.rebuys, 0, 1e6, 0), net: num(p && p.net),
      })) : [],
      log: Array.isArray(v.log) ? v.log.slice(-150).map((l) => ({ id: num(l && l.id), text: str(l && l.text, 300), kind: oneOf(l && l.kind, ['hand', 'win', ''], '') })) : [],
      chat: Array.isArray(v.chat) ? v.chat.slice(-80).map((c) => ({ id: num(c && c.id), from: str(c && c.from, 30), text: str(c && c.text, 300), ts: num(c && c.ts), viewer: bool(c && c.viewer), bot: bool(c && c.bot) })) : [],

    };

  function settings(x) {
    if (!x || typeof x !== 'object') return null;
    const sb = int(x.sb, 1, 1e9, null), bb = int(x.bb, 1, 1e9, null), st = int(x.startingStack, 2, 1e12, null);
    if (sb == null || bb == null || bb < sb || st == null || st < bb * 2) return null;
    return {
      tableName: str(x.tableName, 40).replace(/["\[\]\\]/g, '').trim() || 'Rematch', sb, bb, ante: int(x.ante, 0, bb, 0), startingStack: st,
      maxSeats: int(x.maxSeats, 2, 9, 9), timer: int(x.timer, 0, 600, 0), rebuys: bool(x.rebuys), maxRebuys: int(x.maxRebuys, 0, 99, 0),
      recordHole: oneOf(x.recordHole, ['All', 'Showdown'], 'Showdown'), game: oneOf(x.game, ['holdem', 'omaha4', 'omaha5'], 'holdem'),
      limit: oneOf(x.limit, ['nl', 'pl', 'fl'], 'nl'), levelHands: int(x.levelHands, 0, 1000, 0), hostPlays: true,
      botTakeover: bool(x.botTakeover) && !bool(x.sra), sra: bool(x.sra), spectators: bool(x.spectators), viewerChat: bool(x.spectators) && bool(x.viewerChat),
      listed: false, hostAdjust: bool(x.hostAdjust), hostKick: bool(x.hostKick),
    };
  }
  return { view, settings };
})();

/** Peer IDs that a rematch invitation may point to. */
const REMATCH_ID = /^nlhe-[a-z2-9]{4}-[a-z2-9]{4}$/;
/** A rematch can be offered once at least one hand is done and the game is over or someone is out of chips. */
const Rematch = {
  allowed(t) {
    if (!t.finished.length) return false;
    return t.status === 'ended' || [...t.players.values()].some((p) => p.busted);
  },
  allowedView(v) {
    if (!v || !v.handNo || v.status === 'lobby') return false;
    return v.status === 'ended' || v.players.some((p) => p.busted) || !!(v.you && v.you.busted);
  },
};


class ClientSession {
  constructor(hostId, name, opts = {}) {
    this.role = opts.watch ? 'watcher' : 'client';
    this.watch = !!opts.watch;
    this.fresh = !!opts.fresh;
    this.id = hostId;
    this.name = name;
    this.record = Prefs.get('record.' + hostId, '');
    this.recordFull = Prefs.get('recordFull.' + hostId, this.record);
    this.handlers = { view: () => {}, event: () => {}, error: () => {}, ended: () => {}, status: () => {}, fair: () => {}, rematch: () => {} };
    this.ended = false;
    this.fair = new Fair.Checker((f, msg) => this.handlers.fair(f, msg));
  }
  on(ev, fn) { this.handlers[ev] = fn; return this; }
  get inviteUrl() { return `${location.origin}${location.pathname.replace(/index\.html$/, '')}${Net.local ? '?local' : ''}#join=${this.id}`; }
  /** Players get the viewer link's ID in their view; a viewer re-shares the link they came in on. */
  get watchUrl() { return this.watch ? Net.watchUrl(this.id) : (this.lastView && this.lastView.watchId ? Net.watchUrl(this.lastView.watchId) : ''); }

  async connect() {
    if (!this.peer || this.peer.destroyed) this.peer = await Net.createPeer();
    this.peer.on('disconnected', () => { setTimeout(() => { try { if (!this.peer.destroyed) this.peer.reconnect(); } catch { /* ignore */ } }, 1000); });
    await this._open();
    // Closing or refreshing the tab tells the host straight away (instead of after the heartbeat timeout).
    this.unload = () => { try { if (this.conn) this.conn.close(); } catch { /* ignore */ } };
    addEventListener('pagehide', this.unload);
    this.dog = setInterval(() => {
      if (this.ended || !this.conn) return;
      if (Date.now() - this.lastMsg > 15000) { try { this.conn.close(); } catch { /* ignore */ } this._lost(); }
      else this.send({ t: 'ping' });
    }, 4000);
    return this;
  }

  _open() {
    return new Promise((resolve, reject) => {
      let done = false;
      const fin = (err) => { if (done) return; done = true; clearTimeout(to); this.peer.off && this.peer.off('error', onErr); err ? reject(err) : resolve(); };
      const onErr = (e) => { if (e && (e.type === 'peer-unavailable' || e.type === 'network' || e.type === 'webrtc' || e.type === 'server-error' || e.type === 'socket-error')) fin(e); };
      this.peer.on('error', onErr);
      const c = this.peer.connect(this.id, { reliable: true, serialization: 'json' });
      const to = setTimeout(() => { try { c.close(); } catch { /* ignore */ } fin({ type: 'connect-timeout' }); }, 15000);
      c.on('open', () => {
        this.lastMsg = Date.now();
        c.send(this.watch ? { t: 'hello', watch: true, name: this.name } : { t: 'hello', name: this.name, token: this.fresh ? null : this._token() });
      });
      c.on('data', (m) => {
        this.lastMsg = Date.now();
        if (!m || typeof m !== 'object') return;
        if (m.t === 'part') { m = Wire.unpack(this.parts || (this.parts = new Map()), m); if (!m || typeof m !== 'object' || m.t === 'part') return; }
        if (m.t === 'welcome' && this.watch) {
          if (m.watch !== true) { fin({ type: 'rejected', message: 'That link is not a viewer link.' }); return; }
          this.conn = c; this.name = String(m.name || 'Viewer').slice(0, 18);
          this.handlers.status('connected');
          fin();
          return;
        }
        if (m.t === 'welcome') {
          this.conn = c; this.pid = m.pid; this.name = m.name;
          this.fresh = false;
          Prefs.set('token.' + this.id, m.token); Prefs.set('tokenName.' + this.id, m.name);
          try { sessionStorage.setItem('feltroom.active', this.id); sessionStorage.setItem('feltroom.token.' + this.id, m.token); } catch { /* ignore */ }
          this.handlers.status('connected');
          fin();
          return;
        }
        if (m.t === 'reject') { this.ended = true; fin({ type: 'rejected', message: m.text }); return; }
        this._msg(m);
      });
      c.on('close', () => { if (this.conn === c) this._lost(); else fin({ type: 'connect-timeout' }); });
      c.on('error', () => { if (this.conn === c) this._lost(); });
    });
  }

  _msg(m) {
    switch (m.t) {
      case 'state':
        m = Safe.view(m);
        if (!m) break;
        if (m.table.sra && !this.sraLink && !this.watch) this._sra();
        if (this.sraLink) { this.sraLink.onView(m); this.sraLink.patchView(m); }
        this.lastView = m;
        try { this.fair.view(m, this.name); } catch (e) { console.warn(e); }
        // The record for a hand can arrive just before the view that proves its last board card.
        if (this.pendingAudit) { const t = this.pendingAudit; this.pendingAudit = null; this._audit(t); }
        this.handlers.view(m);
        break;
      case 'event': this.handlers.event(m.kind, m.text); break;
      case 'record':
        if (this.watch) break;
        this.record = m.text; this.recordFull = m.full || m.text;
        if (this.sraLink) { this.record = this.sraLink.patchRecord(this.record); this.recordFull = this.sraLink.patchRecord(this.recordFull); }
        Prefs.set('record.' + this.id, this.record); Prefs.set('recordFull.' + this.id, this.recordFull);
        this.pendingAudit = this.recordFull;
        break;
      // Shuffle proofs: answer with our own committed randomness, then verify every card we see.
      case 'fair1': { const r = this.fair.fair1(m); if (r) this.send(r); break; }
      case 'fair2': { const r = this.fair.fair2(m); if (r) this.send(r); break; }
      case 'fair3': this.fair.fair3(m); break;
      case 'fairown': this.fair.own(m, this.name); break;
      case 'error': this._rematchDone(null); this.handlers.error(m.text); break;
      case 'ping': this.send({ t: 'pong' }); break;
      case 'kicked': this._end('You were removed from the table by the host.'); break;
      // The connection stays open after the game ends, so a rematch invitation can still arrive.
      case 'ended': this._end(m.reason || 'Host left, game ended.', true); break;
      case 'rematch':
        if (this.watch || typeof m.id !== 'string' || !REMATCH_ID.test(m.id) || m.id === this.id) break;
        this._rematchDone(null);
        this.rematch = { from: String(m.from || 'A player').slice(0, 24), id: m.id };
        this.handlers.rematch(this.rematch.from, m.id);
        break;
      case 'rematch-go': if (!this.watch) this._rematchDone(Safe.settings(m.settings)); break;
      // Encrypted deal steps go to our own SraPlayer.
      default: if (SraLink.is(m) && !this.watch) { if (!this.sraLink) this._sra(); this.sraLink.msg(m); } break;
    }
  }

  /** This tab's own seat first (two tabs of one browser can be two different players), else the browser's. */
  _token() {
    try { const t = sessionStorage.getItem('feltroom.token.' + this.id); if (t) return t; } catch { /* ignore */ }
    return Prefs.get('token.' + this.id, null);
  }
  _sra() {
    this.sraLink = new SraLink(this.name, this.id, (r) => this.send(r), (no, why) => {
      const f = this.fair._h(no);
      this.fair._fail(f, why);
    });
  }

  /** Re-simulate the newest hand of the host's record and check it against what we saw ourselves. */
  _audit(text) {
    try {
      const g = Notation.parse(text);
      const r = g.hands[g.hands.length - 1];
      if (!r || this.audited === r.no) return;
      this.audited = r.no;
      const rp = Replay.game({ tags: g.tags, hands: [r] });
      const issues = rp.issues.slice();
      const f = this.fair.hands[r.no];
      if (f && f.own && r.hole[this.name] && r.hole[this.name].join() !== f.own.join()) issues.push('the record shows different hole cards from the ones you were dealt');
      if (f && f.layout) r.streets.slice(1).flatMap((st) => st.board).forEach((c, i) => {
        if (!f.checked.has(f.layout.board[i] + ':' + c)) issues.push(`board card ${Cards.pretty(c)} in the record was never proven`);
      });
      this.fair.audit(r.no, issues);
    } catch (e) { this.fair.audit(-1, [`the host sent a record that does not parse (${e.message})`]); }
  }

  async _lost() {
    if (this.ended || this.reconnecting) return;
    this.reconnecting = true;
    this.conn = null;
    this.handlers.status('reconnecting');
    for (let i = 0; i < 6 && !this.ended; i++) {
      await new Promise((r) => setTimeout(r, 2500));
      try { await this._open(); this.reconnecting = false; return; } catch (e) { if (e && e.type === 'rejected') break; }
    }
    this.reconnecting = false;
    this._end('Host left, game ended.');
  }

  _end(reason, keepOpen) {
    if (this.ended) return;
    this.ended = true;
    clearInterval(this.dog);
    this.handlers.ended(reason);
    if (!keepOpen) setTimeout(() => { try { this.peer.destroy(); } catch { /* ignore */ } }, 500);
  }

  /** Ask the host for this table's settings so this player can host the rematch. Resolves null if the host doesn't answer. */
  askRematch() {
    return new Promise((resolve) => {
      const to = setTimeout(() => { if (this.rematchWait) { this.rematchWait = null; resolve(null); } }, 8000);
      this.rematchWait = (s) => { clearTimeout(to); resolve(s); };
      this.send({ t: 'rematch-ask' });
    });
  }
  _rematchDone(s) { const w = this.rematchWait; this.rematchWait = null; if (w) w(s); }

  send(m) {
    if (m.t === 'show' && this.sraLink && this.lastView) m = { ...m, keys: this.sraLink.showKeys(this.lastView.handNo) };
    try { if (this.conn && this.conn.open) for (const x of Wire.pack(m)) this.conn.send(x); } catch { /* ignore */ }
  }
  leave() {
    try { sessionStorage.removeItem('feltroom.active'); } catch { /* ignore */ }
    this.ended = true; this.closed = true; clearInterval(this.dog); if (this.unload) removeEventListener('pagehide', this.unload); try { this.conn && this.conn.close(); this.peer.destroy(); } catch { /* ignore */ } }
}

/* ---------- Play vs Bots: the same HostTable, fully offline ---------- */
class BotSession {
  constructor(settings, name, bots) {
    this.role = 'host';
    this.offline = true;
    this.id = 'offline';
    this.settings = settings; this.name = name; this.bots = bots;
    this.record = ''; this.recordFull = '';
    this.handlers = { view: () => {}, event: () => {}, error: () => {}, ended: () => {} };
  }
  on(ev, fn) { this.handlers[ev] = fn; return this; }
  get inviteUrl() { return ''; }
  /** Viewer link for a bot game: only once the table has opened its connection to the broker. */
  get watchUrl() { return this.watchers ? this.watchers.url : ''; }
  start() {
    const t = this.table = new HostTable({ ...this.settings, vsBots: true, hostPlays: true }, this.name, U.randHex(16));
    this.watchers = new WatchHub(this);
    if (t.s.spectators) this.watchers.open(); // the game stays on this device; the broker is only for viewers
    this.pid = t.hostPid;
    for (const b of this.bots) t.addBot(b);
    t.onChange = () => {
      if (this.bq) return;
      this.bq = true;
      queueMicrotask(() => {
        this.bq = false;
        this.handlers.view(t.viewFor(this.pid));
        this.watchers.broadcast();
        if (t.status === 'ended' && !this.endedSent) { this.endedSent = true; this.watchers.end('The game is over.'); this.handlers.ended('Game over.'); }
      });
    };
    t.onEvent = (kind, text) => { this.handlers.event(kind, text); this.watchers.event(kind, text); };
    t.onRecord = (pid, text, full) => { if (pid === this.pid) { this.record = full; this.recordFull = full; Prefs.set('record.offline', full); } };
    t.onDirect = (pid, m) => { if (pid === this.pid && m.t === 'error') this.handlers.error(m.text); };
    t.handle(this.pid, { t: 'start' });
    return this;
  }
  send(m) { this.table.handle(this.pid, m); }
  _send(c, m) { try { if (c.open) for (const x of Wire.pack(m)) c.send(x); } catch { /* connection already gone */ } }
  leave() {
    if (this.closed) return;
    this.closed = true;
    if (this.watchers) this.watchers.close('The game is over.');
    const t = this.table;
    if (t && t.status !== 'ended') { t.status = 'ended'; t._clearTurn(); clearTimeout(t.nextTimer); clearTimeout(t.dealTimer); clearTimeout(t.botTimer); }
  }
}

/** "Mobile or computer?" — chosen on the first visit and remembered. Mobile gets the phone oval (rows as a fallback). */
const Device = {
  get() { try { const v = localStorage.getItem('feltroom.device'); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(kind) { try { localStorage.setItem('feltroom.device', JSON.stringify(kind)); } catch { /* private mode */ } Device.apply(); },
  get mobile() { return document.body.classList.contains('mobile'); },
  apply() { document.body.classList.toggle('mobile', Device.get() === 'mobile'); },
  /** What this device probably is, to suggest the right button. */
  guess() { return matchMedia('(pointer: coarse)').matches || Math.min(screen.width, screen.height) < 600 ? 'mobile' : 'computer'; },
};

/* ---------- Web Audio sound effects (generated, no files) ---------- */
const Sound = {
  ctx: null,
  get muted() { return Prefs.get('muted', false); },
  toggle() { Prefs.set('muted', !this.muted); if (!this.muted) this.play('chip'); },
  unlock() { this._ctx(); },
  _ctx() {
    if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; this.ctx = new C(); }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return this.ctx;
  },
  _tone(c, { f = 440, f2, type = 'sine', t = 0, dur = 0.15, vol = 0.1 }) {
    const o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + t;
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  },
  _noise(c, { t = 0, dur = 0.06, vol = 0.12, freq = 3000, q = 1, type = 'bandpass' }) {
    const len = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t0 = c.currentTime + t;
    s.buffer = b; f.type = type; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
    s.connect(f).connect(g).connect(c.destination); s.start(t0);
  },
  play(name, delay = 0) {
    if (this.muted) return;
    const c = this._ctx();
    if (!c || c.state !== 'running') return;
    const t = delay;
    switch (name) {
      case 'deal': this._noise(c, { t, dur: 0.07, vol: 0.22, freq: 2600, q: 0.8 }); break;
      case 'chip': this._tone(c, { f: 2300, type: 'triangle', t, dur: 0.05, vol: 0.06 }); this._tone(c, { f: 3100, type: 'triangle', t: t + 0.045, dur: 0.05, vol: 0.05 }); break;
      case 'knock': this._tone(c, { f: 150, f2: 80, t, dur: 0.12, vol: 0.4 }); this._noise(c, { t, dur: 0.04, vol: 0.12, freq: 900, type: 'lowpass' }); break;
      case 'chime': this._tone(c, { f: 660, t, dur: 0.28, vol: 0.09 }); this._tone(c, { f: 990, t: t + 0.14, dur: 0.38, vol: 0.08 }); break;
      case 'chat': this._tone(c, { f: 1175, t, dur: 0.12, vol: 0.05 }); this._tone(c, { f: 1568, t: t + 0.08, dur: 0.16, vol: 0.04 }); break;
      case 'win': [523, 659, 784].forEach((f, i) => this._tone(c, { f, type: 'triangle', t: t + i * 0.09, dur: 0.3, vol: 0.07 })); break;
      case 'fold': this._noise(c, { t, dur: 0.09, vol: 0.06, freq: 1200, q: 0.5 }); break;
    }
  },
};
addEventListener('pointerdown', () => Sound.unlock(), { once: false, passive: true });
addEventListener('keydown', () => Sound.unlock(), { passive: true });

/* ---------- Toasts, screen-reader announcements, title flash ---------- */
function toast(text, kind = 'info', ms = 3600) {
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = text;
  box.appendChild(el);
  while (box.children.length > (matchMedia('(max-width: 720px)').matches ? 2 : 3)) box.firstChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, ms);
}

function openModal(html, { onClose, label = 'Dialog', dismissable = true } = {}) {
  const back = document.createElement('div');

  back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${U.esc(label)}">${html}</div>`;
  document.body.appendChild(back);
  const prevFocus = document.activeElement;
  const close = () => { back.remove(); removeEventListener('keydown', onKey, true); if (prevFocus && prevFocus.focus) prevFocus.focus(); onClose && onClose(); };
  const onKey = (e) => {
    if (e.key === 'Escape' && dismissable) { e.stopPropagation(); close(); }
    if (e.key === 'Tab') { // keep focus inside
      const f = $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', back).filter((x) => !x.disabled);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }

  if (dismissable) back.addEventListener('mousedown', (e) => { if (e.target === back) close(); });

  setTimeout(() => { const f = $('[autofocus], .modal-foot .btn.primary, .modal-foot .btn', back); if (f) f.focus(); }, 30);
  return { el: back, close };
}

}
const DENOMS = [5000, 1000, 500, 100, 25, 5, 1];

const ACTION_WORD = { f: 'Fold', x: 'Check', c: 'Call', b: 'Bet', r: 'Raise' };

/* ---------- Table renderer (shared by the live game and the replay viewer) ----------
   view = { maxSeats, mySeat, handKey, seats:[seat|null], board, pots:[{label,amount}], street,

  constructor(stage, opts = {}) {
    this.stage = stage; this.opts = opts;
    this.el = document.createElement('div');
    this.el.className = 'table';
    this.el.innerHTML = '<div class="layer"></div><div class="fx"></div>';

   * Mobile: players sit around a phone-shaped oval table. After every redraw the table measures
   * itself; if any two pieces would touch (or spill off the screen) everything shrinks a little, and

   * size switches to the stacked rows, which can never overlap. A computer always keeps the big oval.

  }

  layout() {

    this.el.classList.remove('mtable', 'moval');
    const W = this.stage.clientWidth - 12, H = this.stage.clientHeight - 12;
    if (W < 50 || H < 50) return;
    const portrait = W / H < 0.95;
    const cl = (v, a, b) => Math.max(a, Math.min(b, v));

      for (let i = 0; i < 4; i++) { tw = Math.min(W - 170 * s, (H - 200 * s) * 2.05); s = cl(tw / 640, 0.55, 1.2); }

      const cls = ['seat', isMe ? 'me' : '', st.toAct ? 'active' : '', st.folded ? 'folded' : '', (st.sittingOut || st.busted) ? 'out' : '', st.won ? 'winner' : ''].join(' ');
      let hole = '';

          const dealt = newHand && !(prev && prev.seats[seat] && prev.seats[seat].cards && prev.handKey === view.handKey);
          const flipNow = animate && same && ps && ps.cards && !ps.cards[j] && c;

  /** A speech bubble over a seat for a chat message (below the seat for players at the top of the table). */
  bubble(seat, from, text) {
    if (!this.view || seat == null || seat < 0 || Device.mobile) return; // mobile shows chat in its own strip instead
    const [x, y] = this.pos(seat);
    const below = y < 30;
    const el = document.createElement('div');
    el.className = `chat-bubble${below ? ' below' : ''}`;
    el.style.left = x + '%';
    el.style.top = `calc(${y}% ${below ? '+' : '-'} ${below ? 46 : 58} * var(--s) * 1px)`;
    el.setAttribute('role', 'note');
    el.setAttribute('aria-label', `${from} says: ${text}`);
    el.textContent = text.length > 120 ? text.slice(0, 117) + '…' : text;
    // One bubble per seat at a time: a new message replaces the old one.
    $$(`.chat-bubble[data-seat="${seat}"]`, this.fx).forEach((b) => b.remove());
    el.dataset.seat = seat;
    this.fx.appendChild(el);
    const ms = Math.min(9000, 3500 + text.length * 60);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 350); }, ms);
  }

  fly(from, to, amount) {
    if (reducedMotion() || Device.mobile) return;
    const el = document.createElement('div');
    el.className = 'fly';
    el.innerHTML = chipsHtml(amount, 4);
    el.style.left = `calc(${from[0]}% - 9px)`; el.style.top = `calc(${from[1]}% - 9px)`;
    this.fx.appendChild(el);
    const dx = ((to[0] - from[0]) * this.w) / 100, dy = ((to[1] - from[1]) * this.h) / 100;
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transform = `translate(${dx}px, ${dy}px)`; el.style.opacity = '0.15'; }));
    setTimeout(() => el.remove(), 480);
  }

  tick() {
    const t = this.timer, c = this.layer.querySelector('[data-ring]');
    if (!t || !c) return;
    const rem = t.paused ? t.rem : Math.max(0, t.end - performance.now());
    const frac = Math.max(0, Math.min(1, rem / t.total));
    c.setAttribute('stroke-dashoffset', String(100 * (1 - frac)));
    c.style.stroke = frac > 0.5 ? 'var(--accent)' : frac > 0.25 ? 'var(--warn)' : 'var(--danger)';
    if (!t.paused && rem > 0) this.raf = requestAnimationFrame(this.tick);
  }
}

/* =====================================================================
   9. SELF TESTS  (pure; rendered by the #/selftest route)
   ===================================================================== */
const SelfTest = (() => {
  const T = [];
  const test = (group, name, fn) => T.push({ group, name, fn });
  const eq = (a, b, msg) => {
    const ja = JSON.stringify(a), jb = JSON.stringify(b);
    if (ja !== jb) throw new Error(`${msg ? msg + ': ' : ''}expected ${jb}, got ${ja}`);
  };
  const ok = (v, msg) => { if (!v) throw new Error(msg || 'assertion failed'); };
  const throws = (fn, re, msg) => {
    try { fn(); } catch (e) { if (re && !re.test(e.message)) throw new Error(`${msg || 'wrong error'}: ${e.message}`); return; }
    throw new Error(msg || 'expected an error');
  };
  const ev = (s) => Eval.evaluate(s.split(' '));
  const cmp = (a, b) => Math.sign(ev(a).score - ev(b).score);
  const desc = (s) => Eval.describe(ev(s));

  /** Plays a whole hand to completion. script: list of actions or a function choosing actions. */
  function play(o) {
    const deck = o.deck ? o.deck.slice() : Cards.shuffle(Cards.newDeck());
    const n = o.stacks.length;
    const hc = o.holeCount || (o.game === 'omaha' ? 4 : 2);
    const hole = o.hole || Array.from({ length: n }, () => Array.from({ length: hc }, () => deck.pop()));
    for (const hc of hole) for (const c of hc || []) { const k = deck.indexOf(c); if (k >= 0) deck.splice(k, 1); }
    const board = o.board ? o.board.slice() : null;
    if (board) for (const c of board) { const k = deck.indexOf(c); if (k >= 0) deck.splice(k, 1); }
    const h = Engine.createHand({
      no: o.no || 1, players: o.stacks.map((s, i) => ({ name: (o.names || 'ABCDEFGHI')[i], stack: s })),
      button: o.button || 0, sb: o.sb || 1, bb: o.bb || 2, ante: o.ante || 0, hole,
      game: o.game, limit: o.limit, holeCount: hc,
    });
    let k = 0;
    for (let guard = 0; guard < 500 && h.phase !== 'done'; guard++) {
      if (h.phase === 'betting') {
        const a = typeof o.actions === 'function' ? o.actions(h, Engine.legal(h)) : o.actions[k++];
        if (!a) return h;
        Engine.applyAction(h, a);
      } else if (h.phase === 'deal') {
        const cs = [];
        for (let i = 0; i < h.pendingDeal; i++) cs.push(board && board.length ? board.shift() : deck.pop());
        Engine.dealBoard(h, cs);
      } else if (h.phase === 'showdown') Engine.settle(h, Engine.planShowdown(h, () => o.autoMuck !== false));
      else if (h.phase === 'settle') Engine.settle(h);
    }
    return h;
  }
  const randomAction = (h, L) => {
    const r = U.randInt(100);
    if (L.canRaise && r < 22) {
      const span = L.maxTo - L.minTo;
      const to = r < 4 ? L.maxTo : L.minTo + (span > 0 ? U.randInt(Math.min(span, 40) + 1) : 0);
      return { type: L.isBet ? 'bet' : 'raise', to };
    }
    if (L.canCheck) return { type: 'check' };
    if (r < 70) return { type: 'call' };
    return { type: 'fold' };
  };
  const wins = (h) => { const o = {}; h.log.filter((e) => e.t === 'win').forEach((e) => { const n = h.players[e.p].name; o[n] = (o[n] || 0) + e.amt; }); return o; };

  /* ---------- Evaluator ---------- */
  test('Evaluator', 'Recognises every category', () => {
    eq(desc('Ah Kh Qh Jh Th 2c 3d'), 'Royal Flush');
    eq(desc('9s 8s 7s 6s 5s Ad Ac'), 'Straight Flush, Nine high');
    eq(desc('Ks Kh Kd Kc 2s 3d 4h'), 'Four of a Kind, Kings');
    eq(desc('Ks Kh Kd 7c 7s 2d 3h'), 'Full House, Kings over Sevens');
    eq(desc('Ah 9h 7h 4h 2h Kc Kd'), 'Flush, Ace high');
    eq(desc('Ts 9h 8d 7c 6s 2d 2h'), 'Straight, Ten high');
    eq(desc('Qs Qh Qd 9c 4s 2d 3h'), 'Three of a Kind, Queens');
    eq(desc('Js Jh 4d 4c As 2d 8h'), 'Two Pair, Jacks and Fours');
    eq(desc('Js Jh 4d 6c As 2d 8h'), 'Pair of Jacks');
    eq(desc('As Qh 4d 6c 9s 2d 8h'), 'High Card, Ace');
    eq(desc('6s 6h 6d 2c 2s'), 'Full House, Sixes over Twos');
  });
  test('Evaluator', 'Wheel straight (A-2-3-4-5) is Five high and loses to 6-high', () => {
    eq(desc('Ah 2c 3d 4s 5h Kd Qc'), 'Straight, Five high');
    eq(cmp('Ah 2c 3d 4s 5h', '2c 3d 4s 5h 6d'), -1);
    eq(cmp('Ah 2c 3d 4s 5h', 'Kh Kc Kd 2s 3s'), 1, 'wheel beats trips');
    eq(desc('Ah 2h 3h 4h 5h 9c 9d'), 'Straight Flush, Five high');
    eq(cmp('Ah Kc Qd Js Th', 'Ah 2c 3d 4s 5h'), 1, 'broadway beats wheel');
    eq(desc('Ah Kc Qd 2s 3h 4c 9d'), 'High Card, Ace', 'no wrap-around straight');
  });
  test('Evaluator', 'Kicker ties and exact ties', () => {
    eq(cmp('Ah Kd 9c 7s 4h 3d 2c', 'Ah Qd 9c 7s 4h 3d 2c'), 1, 'king kicker wins');
    eq(cmp('As Ks Qh Jd 9c 3h 2c', 'Ad Kh Qs Jc 9h 4d 2s'), 0, 'same five cards tie');
    eq(cmp('Kh Kd 8c 8s 5h', 'Kc Ks 8d 8h 4c'), 1, 'two pair kicker');
    eq(cmp('Kh Kd 8c 8s 5h', 'Kc Ks 8d 8h 5c'), 0, 'two pair exact tie');
    eq(cmp('9h 9d 9c Ks Qh', '9h 9d 9c Ks Jh'), 1, 'trips second kicker');
    eq(cmp('Ah Jh 9h 6h 3h', 'Ah Jh 9h 6h 2h'), 1, 'flush fifth card');
    eq(cmp('Qh Qd Qc 2s 2h', 'Jh Jd Jc As Ah'), 1, 'full house: trips first');
    eq(cmp('7h 7d 7c 7s 2h', '7h 7d 7c 7s Ah'), -1, 'quads kicker');
    // Board plays: both players hold lower cards, everyone ties.
    const board = 'Ah Kh Qh Jh Ts';
    eq(cmp(board + ' 2c 3c', board + ' 4d 5d'), 0, 'board straight split');
  });
  test('Evaluator', 'Picks the best five of seven', () => {
    const e = ev('2h 3h 9h Th 4h Ah 4c');
    eq(e.cat, 5);
    eq(e.best.slice().sort(), ['3h', '4h', '9h', 'Ah', 'Th'].sort(), 'best five');
    eq(desc('Ah Ad'), 'Pair of Aces', 'preflop pair');
    eq(desc('Ah Kd'), 'High Card, Ace', 'preflop high card');
  });

  /* ---------- Rules: blinds, raises, pots ---------- */
  test('Rules', 'Heads-up: button posts small blind, acts first preflop and last after', () => {

  /* ---------- Notation ---------- */
  const sampleGame = (nHands, mode, variant = 'NLHE') => {

      h.players.forEach((p) => { stacks[names.indexOf(p.name)] = p.stack; });

    }
    return { tags: Notation.gameTags({ event: 'Test Night', date: '2026.10.14', sb: 1, bb: 2, ante: 0, startingStack: 200, players: names, holeCards: mode, variant }), hands };

  test('Notation', 'serialize → parse → serialize round-trips (60 random hands, both modes)', () => {

  test('Notation', 'Parser tolerates extra whitespace and line breaks', () => {
    const messy = `  [Event   "Friday"]\n[Blinds "1/2"] [Ante "0"]\r\n\r\n\n#1   [Button "Alice"]\n[Stacks "Alice:200,   Bob:200, Carol:200"]\nBob sb 1;\nCarol bb\n 2 Alice [Ah Kd]\n r 6; Bob [7c2s] f; Carol [QsQh] r 18;\n Alice c 18\nF:  Js 8h\n3c; Carol b 20; Alice c\n20\nT: 2d; Carol x; Alice x\nR: 9s; Carol b 60; Alice f\n=> Carol\nwins 77\n`;
    const g = Notation.parse(messy);

  /** A full simulated deal between an honest (or dishonest) dealer and a checking player. */
  function fairRound(tamper) {
    const deck = Cards.shuffle(Cards.newDeck()), salts = deck.map(() => U.randHex(16));
    const commits = deck.map((c, i) => Fair.commit(c, salts[i]));
    const ck = new Fair.Checker();
    const reply1 = ck.fair1({ no: 7, commits });
    const hostSeed = U.randHex(32);
    const seedCommits = [reply1.c, Fair.sha256(hostSeed)];
    const reply2 = ck.fair2({ no: 7, seedCommits });
    const seeds = tamper === 'dropseed' ? [hostSeed] : [reply2.seed, hostSeed];
    ck.fair3({ no: 7, seeds, order: ['Me', 'Host'], holeCount: 2 });
    const perm = Fair.permutation(Fair.combine(7, commits, seeds));
    const L = Fair.layout(2, 2);
    const at = (pos) => ({ pos, card: deck[perm[pos]], salt: salts[perm[pos]] });
    const mine = [at(L.hole(0, 0)), at(L.hole(0, 1))];
    if (tamper === 'swap') mine[1] = { ...at(L.hole(1, 1)), pos: L.hole(0, 1) };
    ck.own({ no: 7, cards: mine }, 'Me');
    const board = L.board.slice(0, 3).map(at);
    if (tamper === 'board') board[2] = at(L.board[3]);
    ck.view({ fair: { no: 7, reveals: board }, phase: 'betting', board: board.map((r) => r.card).concat(tamper === 'board' ? [] : []), seats: [{ name: 'Me', cards: mine.map((r) => r.card) }, { name: 'Host', cards: [null, null] }] }, 'Me');
    return ck.hands[7];
  }
  test('Fairness', 'An honest deal verifies; tampering is caught', () => {
    const okRound = fairRound();
    eq(okRound.problems, []); eq(okRound.status, 'verified'); eq(okRound.verified, 5);
    ok(fairRound('swap').status === 'failed', 'swapped hole card detected');
    ok(fairRound('board').status === 'failed', 'board card from the wrong position detected');
    ok(fairRound('dropseed').problems.some((p) => /left your shuffle seed out/.test(p)), 'excluded seed detected');
  });

/* =====================================================================
   7f. PLAY AGAINST CEPHEUS
   A dedicated decision path for one heads-up fixed-limit opponent. The engine
   (cepheus/cepheus.js) and its strategy (cepheus/cepheus-strategy.bin) are separate
   static files, downloaded only when this mode is opened and checked against the
   hashes this page was built with.
   ===================================================================== */
const CepheusBot = {
  JS: 'cepheus/cepheus.js', DATA: 'cepheus/cepheus-strategy.bin',
  JS_SRI: 'sha384-DQKJJRXaM74wMLEgdZBPm4B/FV50/mKzH9tHWYvBvDB9V8MTAHhTZ/qMaeNWj03d', DATA_SHA256: 'ef6d5b3138e7318a6ca47bb72c002fd6cfc7bc91feb91ac27333197684a3adea', DATA_BYTES: '578683',
  // The table Cepheus was computed for (holdem.limit.2p.reverse_blinds.game): blinds 5/10, bets 10/10/20/20.
  SB: 5, BB: 10, STACK: 1000,
  model: null, loading: null, rng: null,
  get sizeLabel() { const n = Number(this.DATA_BYTES); return n > 0 ? `${Math.round(n / 1024)} KB` : 'about 1 MB'; },

  /** Download and check the engine and strategy once; later calls reuse them. */
  load() {
    if (this.model) return Promise.resolve(this.model);
    if (!this.loading) this.loading = this._load().catch((e) => { this.loading = null; throw e; });
    return this.loading;
  },
  async _load() {
    if (this.JS_SRI.startsWith('__')) throw new Error('This build of Feltroom does not include the Cepheus files.');
    const v = this.DATA_SHA256.slice(0, 12);
    if (!window.CepheusEngine) {
      await new Promise((ok, fail) => {
        const s = document.createElement('script');
        s.src = `${this.JS}?v=${v}`; s.integrity = this.JS_SRI; s.async = true;
        s.onload = ok;
        s.onerror = () => { s.remove(); fail(new Error('Could not load the Cepheus engine (cepheus/cepheus.js). Check your connection and try again.')); };
        document.head.appendChild(s);
      });
      if (!window.CepheusEngine) throw new Error('The Cepheus engine did not start.');
    }
    let res;
    try { res = await fetch(`${this.DATA}?v=${v}`); }
    catch { throw new Error('Could not download the Cepheus strategy file. Check your connection and try again.'); }
    if (!res.ok) throw new Error(`The Cepheus strategy file is missing from this site (HTTP ${res.status}).`);
    const buf = await res.arrayBuffer();
    if (crypto.subtle) {
      const d = new Uint8Array(await crypto.subtle.digest('SHA-256', buf));
      const hex = [...d].map((b) => b.toString(16).padStart(2, '0')).join('');
      if (hex !== this.DATA_SHA256) throw new Error('The Cepheus strategy file does not match this version of Feltroom. Reload the page to get matching files.');
    }
    try { this.model = window.CepheusEngine.fromBuffer(buf); }
    catch (e) { throw new Error(`The Cepheus strategy file could not be used: ${e.message}`); }
    return this.model;
  },

  /** Exactly what a player in Cepheus's seat can observe: its own cards, the board, the betting and its seat. */
  observe(h, i) {
    const code = { f: 'f', x: 'c', c: 'c', b: 'r', r: 'r' };
    const history = Array.from({ length: h.street + 1 }, () => '');
    for (const e of h.log) if (e.t === 'act') history[e.street] += code[e.type] || '?';
    return { seat: i === h.button ? 1 : 0, hole: h.players[i].hole.slice(), board: h.board.slice(), history };
  },

  /** An action the engine accepts. Returns { action, fallback } (fallback = why the strategy could not be used). */
  decide(h, i) {
    const L = Engine.legal(h);
    const passive = () => ({ type: L.canCheck ? 'x' : 'c' });
    if (!this.model) return { action: passive(), fallback: 'the strategy is not loaded' };
    let d;
    try {
      if (h.limit !== 'fl' || h.game !== 'holdem' || h.players.length !== 2) throw new Error('this is not heads-up limit Hold\'em');
      if (!this.rng) this.rng = Bots.makeRng(); // secure-seeded; used only to sample the strategy's mixed actions
      d = this.model.decide(this.observe(h, i), this.rng.next);
    } catch (e) { return { action: passive(), fallback: e.message }; }
    if (d.action === 'raise' && L.canRaise) return { action: { type: L.isBet ? 'b' : 'r', to: L.minTo }, d };
    if (d.action === 'fold' && !L.canCheck) return { action: { type: 'f' }, d };
    if (d.action === 'raise') return { action: passive(), fallback: 'the strategy chose a raise the table does not allow', d };
    return { action: passive(), d };
  },
};

      const i = h.players.findIndex((p) => nameIs(p.name)); if (i < 0) continue;
      st.hands++;

      if (acts.some((e) => e.street === 0 && ['c', 'r', 'b'].includes(e.type))) st.vpip++;
      if (acts.some((e) => e.street === 0 && ['r', 'b'].includes(e.type))) st.pfr++;
      let cur = 0; const bets = h.players.map(() => 0);
      for (const e of h.log) {
        if (e.t === 'post' && e.kind !== 'a') { bets[e.p] += e.amt; cur = Math.max(cur, bets[e.p]); }

        if (e.t !== 'act') continue;

        if (e.amt) { bets[e.p] += e.amt; cur = Math.max(cur, bets[e.p]); }
      }
      const preFold = acts.some((e) => e.street === 0 && e.type === 'f');
      if (h.board.length >= 3 && !preFold) { st.sawFlop++; if (h.results && h.results.showdown && !h.players[i].folded) { st.wtsd++; if (h.players[i].stack > h.players[i].startStack) st.wsd++; } }
      const d = h.players[i].stack - h.players[i].startStack; st.net += d; if (d > 0) st.won++;

  }

  /* ---------- the tab ---------- */
  function sessionHtml(session) {

    let verdict;
    if (n < 5) verdict = 'Play a few hands and your results will show up here.';
    else if (rate - half > 0) verdict = `You are beating Cepheus by more than luck explains so far. Impressive! Keep going to be sure.`;
    else if (rate + half < 0) verdict = `Cepheus is ahead by more than luck explains. Its edge is showing.`;
    else verdict = `Too early to tell who is better: after ${n} hand${n === 1 ? '' : 's'}, luck could still explain anything between ${sgn(rate - half, 0)} and ${sgn(rate + half, 0)} big blinds per 100 hands.`;

  /** Render (or refresh) the tab into `el`. Static results load once; the session part updates every hand. */
  function render(el, session, retry) {

    el.innerHTML = `<div class="cs">${html}</div>`;
    el.querySelectorAll('details').forEach((x, i) => { if (open[i] != null) x.open = open[i]; });
    el.scrollTop = top;
    const t = session.table, me = t.players.get(session.pid), bb = t.s.bb;

      bindLine(el, 'conv', conv.map((x) => x.vsCall / 10), conv.length > 1 ? conv[1].minutes - conv[0].minutes : 1, (m, v) => `<b>After ${m} minutes of training</b><div>${sgn(v)} bb/100 vs always-call</div>`);
      const ext = data.matchups.find((m) => m.opponent === 'extreme');
      bindLine(el, 'run', [0, ...runOf(ext).pts], runOf(ext).step, (i, v) => `<b>After ${i.toLocaleString()} hands</b><div>Cepheus: <b class="num">${sgn(v)} bb</b></div>`);
      bindBars(el);
    } else if (!failed) {
      load().then(() => render(el, session), () => { const l = el.querySelector('#cs-loading'); if (l) l.textContent = 'The test results could not be loaded. Your session numbers above still work.'; });
    }
  }
  return { render, load, profile };
})();
/* =====================================================================
   7g. HAND REVIEW
   Every decision you made is replayed from your game record and compared with what
   Feltroom's strongest bot (Extreme, GTO-inspired style) would do in the same spot, or,
   in a Play Against Cepheus game, with the CFR+ strategy. Only what you could see is
   used: your own cards, the board and the betting. Everyone else's cards are removed
   before anything is analysed, even when the record has them.
   ===================================================================== */
const HandReview = (() => {
  const SAMPLES = 48;      // how many times the reference player decides each spot (it mixes its play)
  const MAX_SPOTS = 400;   // very long games: the most recent decisions
  const WORD = { fold: 'fold', check: 'check', call: 'call', raise: 'bet or raise' };
  const group = (t) => ({ f: 'fold', fold: 'fold', x: 'check', check: 'check', c: 'call', call: 'call', b: 'raise', r: 'raise', bet: 'raise', raise: 'raise' }[t] || 'check');
  const pct = (x) => `${Math.round(100 * x)}%`;
  const STREET = ['Preflop', 'Flop', 'Turn', 'River'];

  /** Every decision `name` made in a readable record, with the table exactly as it was just before it. */
  function spots(text, name) {
    const g = Notation.parse(text);
    const rp = Replay.game(g);
    const out = [], finished = [];
    for (const rh of rp.hands) {
      const r = rh.rec, me = r.stacks.findIndex(([n]) => n === name);
      if (me >= 0 && r.hole[name] && rh.hand) {
        for (let k = 1; k < rh.steps.length; k++) {
          const st = rh.steps[k];
          if (st.kind !== 'act' || st.actor !== me) continue;
          const before = U.clone(rh.steps[k - 1].hand);
          before.players.forEach((p, j) => { if (j !== me) { p.hole = null; p.shown = false; } });
          const e = st.hand.log[st.hand.log.length - 1];
          out.push({ no: r.no, hand: before, i: me, act: { type: e.type, to: e.to }, prior: finished.slice(-80) });
        }
      }
      if (rh.hand && rh.hand.phase === 'done') finished.push(rh.hand);
    }
    return { spots: out.slice(-MAX_SPOTS), cut: Math.max(0, out.length - MAX_SPOTS), hands: rp.hands.length, cfg: rp.cfg };
  }

  /** The reference player's mix of actions in one spot, plus the numbers behind it. */
  async function analyse(spot, opts = {}) {
    const h = spot.hand, i = spot.i, L = Engine.legal(h);
    const pot = L.pot, toCall = L.toCall, facing = toCall > 0;
    const potOdds = facing ? toCall / (pot + toCall) : 0;
    if (!spot.models) spot.models = Bots.buildModels(spot.prior);
    const ctx = Bots.contextFor(h, i, { models: spot.models, difficulty: 'extreme', personality: 'gto', work: opts.work || 0.6 });
    const freq = { fold: 0, check: 0, call: 0, raise: 0 }, sizes = [];
    const tally = (a) => { const k = group(a.type); freq[k] += 1 / SAMPLES; if (k === 'raise' && a.to) sizes.push(a.to); };
    const first = await Bots.decideAsync(ctx);
    tally(first);
    for (let k = 1; k < SAMPLES; k++) tally(Bots.decide(ctx));
    let eq = ctx._p && ctx._p.eq !== undefined ? ctx._p.eq : first.meta && first.meta.eq;
    if (typeof eq !== 'number') eq = null;
    let source = 'bot';
    // Against Cepheus, the CFR+ strategy itself is the reference (heads-up limit Hold'em only).
    if (opts.cepheus && typeof CepheusBot !== 'undefined' && CepheusBot.model && h.limit === 'fl' && h.game === 'holdem' && h.players.length === 2) {
      try {
        const d = CepheusBot.model.decide(CepheusBot.observe(h, i), Math.random);
        const p = d.probs;
        freq.fold = L.canCheck ? 0 : p.fold; freq.check = L.canCheck ? p.call + p.fold : 0; freq.call = L.canCheck ? 0 : p.call; freq.raise = L.canRaise ? p.raise : 0;
        if (!L.canRaise) { if (L.canCheck) freq.check += p.raise; else freq.call += p.raise; }
        source = 'cepheus';
      } catch { /* keep the bot's answer */ }
    }
    return grade(spot, { L, pot, toCall, facing, potOdds, eq, freq, size: sizes.length ? sizes.sort((a, b) => a - b)[sizes.length >> 1] : null, source });
  }

  /** good / close / mistake, with a plain-language reason. */
  function grade(spot, a) {
    const mine = group(spot.act.type), f = a.freq[mine] || 0;
    const best = Object.keys(a.freq).reduce((x, y) => (a.freq[y] > a.freq[x] ? y : x), mine);
    let g = f >= 0.25 ? 'good' : f >= 0.06 ? 'close' : 'mistake';
    if (mine === 'fold' && a.L.canCheck) g = 'mistake';
    const h = spot.hand, bb = h.bb || 1;
    const eqT = a.eq != null ? pct(a.eq) : null;
    const facts = [];
    if (a.facing) facts.push(`You had to call ${U.fmt(a.toCall)} to win a pot of ${U.fmt(a.pot)}, so a call needed to win at least ${pct(a.potOdds)} of the time.`);
    else facts.push(a.pot ? `Nobody had bet yet; the pot was ${U.fmt(a.pot)}.` : 'Nobody had bet yet.');
    if (eqT) facts.push(`Against the hands your opponents were likely to hold, yours would win about ${eqT} of the time.`);
    let why = '', kind = null;
    const say = (x) => x.charAt(0).toUpperCase() + x.slice(1);
    if (g === 'good') why = best === mine || a.freq[mine] >= 0.6 ? `${say(WORD[mine])} is what a strong player does here.` : `${say(WORD[mine])} is a fine choice. A strong player would also ${WORD[best]} here ${pct(a.freq[best])} of the time.`;
    else {
      if (mine === 'fold' && a.L.canCheck) { why = 'You folded when checking was free. Checking keeps your hand alive at no cost.'; kind = 'loose-fold'; }
      else if (mine === 'fold' && a.eq != null && a.eq > a.potOdds + 0.06) { why = 'Folding gave up a profitable call: your chance of winning was better than the price you were offered.'; kind = 'overfold'; }
      else if (mine === 'call' && a.eq != null && a.eq < a.potOdds - 0.06) { why = 'Calling costs chips over time here: the price was higher than your chance of winning.'; kind = 'overcall'; }
      else if (mine === 'raise' && (best === 'fold' || best === 'check' || best === 'call') && a.eq != null && a.eq < 0.5) { why = 'This bet was likely to be called by better hands and rarely made better hands fold.'; kind = 'risky'; }
      else if ((mine === 'check' || mine === 'call') && best === 'raise' && a.eq != null && a.eq >= 0.6) { why = 'With a hand this strong, betting or raising wins more chips from worse hands.'; kind = 'passive'; }
      else why = `A strong player would usually ${WORD[best]} here (${pct(a.freq[best])} of the time) and only rarely ${WORD[mine]}.`;
      if (g === 'close') why = `Close. ${why}`;
    }
    if (mine === 'raise' && a.size && spot.act.to && g !== 'mistake') {
      const r = spot.act.to / a.size;
      if (r > 2 || r < 0.5) facts.push(`Size: you made it ${U.fmt(spot.act.to)}; a typical size here is about ${U.fmt(a.size)}.`);
    }
    // How much the decision mattered: bigger pots and clearer mistakes first.
    const weight = (1 - f) * (a.pot + a.toCall) / bb;
    return { no: spot.no, street: h.street, hole: h.players[spot.i].hole, board: h.board.slice(), mine, did: spot.act, best, freq: a.freq, grade: g, why, facts, kind, weight, pot: a.pot, source: a.source, eq: a.eq, potOdds: a.potOdds };
  }

  /** Analyse a whole record, yielding to the page as it goes. onProgress(done, total). */
  async function run(text, name, opts = {}) {
    const S = spots(text, name);
    const items = [];
    for (let k = 0; k < S.spots.length; k++) {
      if (opts.cancelled && opts.cancelled()) return null;
      items.push(await analyse(S.spots[k], opts));
      if (opts.onProgress) opts.onProgress(k + 1, S.spots.length);
      if (k % 4 === 3) await new Promise((r) => setTimeout(r, 0));
    }
    return summarise(items, S);
  }

  function summarise(items, S) {
    const n = items.length, by = (g) => items.filter((x) => x.grade === g).length;
    const good = by('good'), close = by('close'), mistakes = by('mistake');
    const streets = STREET.map((label, s) => {
      const xs = items.filter((x) => x.street === s);
      return { label, n: xs.length, score: xs.length ? (xs.filter((x) => x.grade === 'good').length + 0.5 * xs.filter((x) => x.grade === 'close').length) / xs.length : null };
    });
    const kinds = {};
    for (const x of items) if (x.kind && x.grade !== 'good') kinds[x.kind] = (kinds[x.kind] || 0) + 1;
    const worst = items.filter((x) => x.grade !== 'good').sort((a, b) => b.weight - a.weight).slice(0, 6);
    const bestPlays = items.filter((x) => x.grade === 'good' && x.freq[x.mine] >= 0.5 && (x.mine === 'raise' || x.mine === 'call' || (x.mine === 'fold' && x.pot > 0)))
      .sort((a, b) => b.pot - a.pot).slice(0, 3);
    return { items, n, good, close, mistakes, score: n ? (good + 0.5 * close) / n : null, streets, kinds, worst, bestPlays, hands: S.hands, cut: S.cut, source: items.some((x) => x.source === 'cepheus') ? 'cepheus' : 'bot' };
  }

  return { spots, analyse, grade, run, summarise, group };
})();

/* ----- The review window ----- */
function reviewModal(text, name, opts = {}) {
  if (!text || !/#\d+/.test(text)) return toast('No finished hands to review yet.', 'info');
  let stop = false;
  const m = openModal(`<h2>${icon('calc')} Hand review</h2><div id="rv-body">
    <p class="muted" style="margin-top:0">Checking each of your decisions against ${opts.cepheus ? 'the CFR+ strategy' : 'Feltroom\'s strongest bot'}, using only what you could see at the time…</p>
    <div class="rv-bar"><span id="rv-fill"></span></div><p class="hint" id="rv-count">Starting…</p></div>
    <div class="modal-foot"><button class="btn" data-close>Close</button></div>`, { label: 'Hand review', onClose: () => { stop = true; } });
  $('.modal', m.el).classList.add('wide');
  const body = $('#rv-body', m.el);
  const cards = (cs) => (cs || []).map((c) => cardHtml(c)).join('');
  const GRADE = { good: ['Good', 'rv-good'], close: ['Close', 'rv-close'], mistake: ['Mistake', 'rv-bad'] };
  const KINDS = { overfold: 'Folded when calling was profitable', overcall: 'Called when the price was too high', passive: 'Checked or called with a strong hand', risky: 'Bet or raised with a weak hand', 'loose-fold': 'Folded when you could check for free' };
  const did = (x) => `${{ fold: 'Fold', check: 'Check', call: 'Call', raise: x.did.type === 'b' ? 'Bet' : 'Raise' }[x.mine]}${x.mine === 'raise' && x.did.to ? ' to ' + U.fmt(x.did.to) : ''}`;
  const mix = (x) => ['fold', 'check', 'call', 'raise'].filter((k) => x.freq[k] > 0.005).map((k) => `${{ fold: 'fold', check: 'check', call: 'call', raise: 'bet/raise' }[k]} ${Math.round(100 * x.freq[k])}%`).join(' · ');
  const spotHtml = (x) => `<div class="rv-spot">
      <div class="rv-head"><span class="rv-tag ${GRADE[x.grade][1]}">${GRADE[x.grade][0]}</span><b>Hand #${x.no} · ${['Preflop', 'Flop', 'Turn', 'River'][x.street]}</b><span class="grow"></span><span class="hint">You: <b>${did(x)}</b></span></div>
      <div class="rv-cards"><span class="rv-hole">${cards(x.hole)}</span>${x.board.length ? `<span class="rv-board">${cards(x.board)}</span>` : ''}</div>
      <p>${U.esc(x.why)}</p><p class="hint">${x.facts.map(U.esc).join(' ')}</p>
      <p class="hint">${x.source === 'cepheus' ? 'CFR+ strategy' : 'Strong player'}: ${mix(x)}</p></div>`;
  HandReview.run(text, name, {
    cepheus: opts.cepheus,
    cancelled: () => stop,
    onProgress: (k, n) => { const f = $('#rv-fill', m.el), c = $('#rv-count', m.el); if (f) f.style.width = `${(100 * k) / n}%`; if (c) c.textContent = `${k} of ${n} decisions checked`; },
  }).then((R) => {
    if (!R || stop) return;
    if (!R.n) { body.innerHTML = '<p>You have not made any decisions in the finished hands yet. Play a few hands, then review again.</p>'; return; }
    const score = Math.round(100 * R.score);
    const verdict = score >= 85 ? 'Excellent: very close to how a strong player plays.' : score >= 70 ? 'Solid, with a few leaks to work on.' : score >= 55 ? 'Some good decisions, and some costly habits to fix.' : 'Plenty to work on. The biggest mistakes below are the place to start.';
    const kinds = Object.entries(R.kinds).sort((a, b) => b[1] - a[1]);
    body.innerHTML = `
      <div class="rv-score"><div class="rv-big">${score}<small>/100</small></div><div><b>${verdict}</b>
        <div class="hint">${R.n} decision${R.n === 1 ? '' : 's'} over ${R.hands} hand${R.hands === 1 ? '' : 's'}: <span class="rv-good-t">${R.good} good</span> · <span class="rv-close-t">${R.close} close</span> · <span class="rv-bad-t">${R.mistakes} mistake${R.mistakes === 1 ? '' : 's'}</span>${R.cut ? ` (the most recent ${R.n} decisions)` : ''}</div></div></div>
      <div class="rv-streets">${R.streets.filter((s) => s.n).map((s) => `<div class="sum-tile"><b>${Math.round(100 * s.score)}</b><span>${s.label} · ${s.n}</span></div>`).join('')}</div>
      ${kinds.length ? `<div class="section-title">Your habits to watch</div><ul class="rv-kinds">${kinds.map(([k, c]) => `<li>${U.esc(KINDS[k])}: <b>${c}</b> time${c === 1 ? '' : 's'}</li>`).join('')}</ul>` : ''}
      ${R.worst.length ? `<div class="section-title">Decisions to look at again</div>${R.worst.map(spotHtml).join('')}` : '<p><b>No mistakes found.</b> Nicely played.</p>'}
      ${R.bestPlays.length ? `<div class="section-title">Best plays</div>${R.bestPlays.map(spotHtml).join('')}` : ''}
      <details class="rv-all"><summary>Every decision (${R.n})</summary>${R.items.map(spotHtml).join('')}</details>
      <p class="hint">How this works: each spot is replayed with only your cards, the board and the betting, then ${R.source === 'cepheus' ? 'the CFR+ strategy\'s own action mix for that spot is used' : 'Feltroom\'s Extreme bot decides it ' + 48 + ' times (it mixes its play)'}. "Good" means a strong player makes that choice at least a quarter of the time. These are estimates from a strong player, not a perfect solver, and a single hand never proves a play right or wrong.</p>`;
  }).catch((e) => { if (!stop) body.innerHTML = `<div class="err-box">${icon('alert')}<div>The review could not be completed: ${U.esc(e.message)}</div></div>`; });
}

    'Your last table settings',

  ];

    if (App.session) { try { App.session.leave(); } catch { /* ignore */ } App.session = null; }

    toast('Your data on this device has been cleared.', 'success');

  });
}

/** "Viewers can chat" only makes sense when viewers are allowed. */

  sync();
}

  App.root.innerHTML = `<div class="page"><div class="page-inner">

      <section class="card-ui setup-section" style="grid-column:1/-1"><h3>What you are playing</h3>

        <p style="margin:0">This opponent uses the same CFR+ algorithm, from the code the Cepheus team released, solved on <b>exactly the same game</b>. To fit in a ${U.esc(C.sizeLabel)} file it groups similar hands together (169 starting hands, then 50 strength groups on each later street). It is a strong, randomised equilibrium-style player, but it is <b>an approximation of Cepheus, not Cepheus's own strategy</b>.</p>
        <p class="hint" style="margin:0">It decides using only what a real player sees: its own two cards, the board and the betting. It never sees your cards or the cards still to come.</p>
        <p class="hint" style="margin:0">Feltroom is not affiliated with or endorsed by the University of Alberta or the Cepheus team. The CFR+ code and hand-ranking tables are used under their open licence (see <a href="cepheus/LICENCE-CFR_plus.txt" target="_blank" rel="noopener">licence</a>).</p>
      </section>
      <section class="card-ui setup-section"><h3>You</h3>

      <section class="card-ui setup-section"><h3>The game (Cepheus's rules)</h3>
        <ul class="hint" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px">
          <li>Heads-up fixed-limit Texas Hold'em, blinds ${C.SB}/${C.BB}. The button posts the small blind and acts first before the flop.</li>
          <li>Bets and raises are ${C.BB} before the flop and on the flop, ${C.BB * 2} on the turn and river.</li>
          <li>At most 4 bets per round (before the flop the big blind counts as the first).</li>
          <li>Both stacks reset to ${U.fmt(C.STACK)} at the start of every hand, so nobody is ever all-in; your running result is kept in the player list.</li>
        </ul>
      </section>
    </div>
    <div id="csetup-err" class="err-box hidden" role="alert" style="margin-top:16px"></div>
    <div class="setup-foot"><span class="hint" id="csetup-status">Downloads the engine and strategy (${U.esc(C.sizeLabel)}) the first time</span><button class="btn primary lg" id="c-start">${icon('play')}Play Cepheus</button></div>
    </form></div></div>`;
  bindThemeToggles(App.root);
  $$('[data-seg]', App.root).forEach((g) => g.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    $$('button', g).forEach((x) => { x.setAttribute('aria-pressed', String(x === b)); x.setAttribute('aria-checked', String(x === b)); });
  }));
  const segv = (n) => $(`[data-seg="${n}"] [aria-pressed="true"]`).dataset.v;
  let gone = false;
  $('#csetup').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target, btn = $('#c-start'), box = $('#csetup-err'), st = $('#csetup-status');
    const name = U.sanitizeName(f.name.value) || 'You';
    Prefs.set('name', name); Prefs.set('cepheusSettings', { botSpeed: segv('botSpeed') });
    box.classList.add('hidden'); btn.disabled = true;
    st.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;display:inline-block;vertical-align:-2px"></span> Loading Cepheus…';
    try { await C.load(); }
    catch (err) {
      if (gone) return;
      btn.disabled = false; st.textContent = 'Nothing was started.';
      box.innerHTML = `${icon('alert')}<div><b>Cepheus could not be loaded.</b><br>${U.esc(err.message)}<br>Your other game modes are not affected.</div>`;
      box.classList.remove('hidden');
      return;
    }
    if (gone) return;
    const s = {
      tableName: 'Cepheus · CFR+ approximation', sb: C.SB, bb: C.BB, ante: 0, startingStack: C.STACK, game: 'holdem', limit: 'fl', levelHands: 0,
      rebuys: false, maxRebuys: 0, timer: 0, recordHole: 'All', botSpeed: segv('botSpeed'), maxSeats: 2,
      botChat: false, spectators: false, viewerChat: false, hostAdjust: false, hostKick: false, cepheus: true, resetStacks: true,
    };
    const sess = new BotSession(s, name, [{ name: 'Cepheus', difficulty: 'cepheus', personality: 'cfr', kind: 'cepheus' }]);
    sess.cepheus = true;
    App.session = sess.start();
    App.screen = GameScreen(sess);
  });
  return { destroy() { gone = true; } };
}

function showError(err, retry, backHash = '#/') {

/* ---------- Join ---------- */
function JoinScreen(hostId) {
  document.title = TitleFlash.base = "Join a game · Feltroom";
  const s = App.session;
  if (s && s.role === 'client' && s.id === hostId && !s.ended) { App.screen = GameScreen(s); return App.screen; }
  const token = Prefs.get('token.' + hostId, null), saved = Prefs.get('name', '');
  // A refresh in the same tab reconnects straight away; a new tab offers "Rejoin" (or a fresh seat,
  // so two tabs in one browser can be two different players).
  let sameTab = false;
  try { sameTab = sessionStorage.getItem('feltroom.active') === hostId; } catch { /* ignore */ }
  const rejoinName = token ? Prefs.get('tokenName.' + hostId, saved) : '';
  const form = () => {
    App.root.innerHTML = `<div class="page"><div class="page-inner">
      <header class="row"><a class="brand" href="#/" style="text-decoration:none;color:inherit"><div class="logo" aria-hidden="true">♠</div><strong>Feltroom</strong></a><span class="grow"></span>${topIconButtons()}</header>
      <form class="center-card card-ui" id="join" style="margin:auto">
        <div class="state-ic">${icon('table')}</div>
        <h2>You're invited to a poker game</h2>
        <p class="muted" style="margin:0">No account needed. Pick a name and you're at the table.</p>
        ${rejoinName ? `<button type="button" class="btn primary lg" id="j-rejoin">Rejoin as ${U.esc(rejoinName)}</button><div class="hint">or join as a new player:</div>` : ''}
        <label class="field" style="text-align:left"><span>Your name</span><input class="input" name="name" maxlength="18" value="${rejoinName ? '' : U.esc(saved)}" placeholder="e.g. Bob" autocomplete="off" required></label>
        <div id="join-err" class="err-box hidden" role="alert"></div>
        <button class="btn ${rejoinName ? '' : 'primary'} lg">${rejoinName ? 'Join as new player' : 'Join game'}</button>
        <p class="hint" style="margin:0">Game <code>${U.esc(hostId)}</code> · Peer-to-peer via the free PeerJS broker</p>
      </form></div></div>`;
    bindThemeToggles(App.root);
    const f = $('#join');
    setTimeout(() => (rejoinName ? $('#j-rejoin') : saved ? f.querySelector('button.primary') : f.name).focus(), 50);
    if (rejoinName) $('#j-rejoin').addEventListener('click', () => connect(rejoinName, false));
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = U.sanitizeName(f.name.value);
      if (!name) { const b = $('#join-err'); b.innerHTML = `${icon('alert')}<div>Please enter a name (letters, numbers and spaces).</div>`; b.classList.remove('hidden'); return; }
      Prefs.set('name', name);
      connect(name, !!rejoinName);
    });
  };
  const connect = async (name, fresh, autoSit) => {
    App.root.innerHTML = `<div class="page"><div class="center-card card-ui" style="margin:auto"><div class="spinner" aria-hidden="true"></div><h2>Connecting to the host…</h2><p class="muted">Finding the game through the free PeerJS broker, then connecting directly.</p></div></div>`;
    const sess = new ClientSession(hostId, name, { fresh });
    try {
      await sess.connect();
      sess.autoSit = !!autoSit;
      App.session = sess;
      App.screen = GameScreen(sess);
    } catch (e) {
      try { sess.leave(); } catch { /* ignore */ }
      if (e && e.type === 'rejected') Prefs.del('token.' + hostId);
      const fr = Net.friendly(e);
      const rec = Prefs.get('record.' + hostId, '');
      showError(fr, () => connect(name, fresh), '#/');
      if (rec) {
        const b = document.createElement('button');
        b.className = 'btn'; b.textContent = 'Copy saved game record';
        b.addEventListener('click', () => copyText(rec, 'Game record copied'));
        $('.center-card .row').prepend(b);
      }
    }
  };
  // Accepted a rematch invitation: join straight away under the same name and take a seat.
  const auto = App.autoJoin; App.autoJoin = null;
  if (auto && auto.id === hostId) connect(auto.name, true, true);
  else if (token && sameTab) connect(rejoinName || saved, false); else form();
  return {};
}

/* ---------- Waiting Room: public tables ---------- */
function RoomsScreen() {
  document.title = TitleFlash.base = 'Waiting Room · Feltroom';
  document.body.classList.add('scroll');
  let alive = true, timer = null, scanning = false;
  App.root.innerHTML = `<div class="page"><div class="page-inner">
    <div class="page-head"><a class="btn ghost icon-btn" href="#/" aria-label="Back to home">${icon('back')}</a><h2>Waiting Room</h2><span class="grow"></span><button class="btn sm" id="r-refresh">${icon('history')}Refresh</button>${topIconButtons()}</div>
    <p class="muted" style="margin-top:0">Public tables that their hosts chose to list. Click <b>Join</b> to take a seat, or <b>Watch</b> where the host allows viewers. Want your own table here? Host a game and tick <b>List this table in the public Waiting Room</b>.</p>
    <div class="r-status" id="r-status"></div>
    <div class="r-list" id="r-list"></div>
  </div></div>`;
  bindThemeToggles(App.root);
  const list = $('#r-list'), status = $('#r-status');
  const card = (r) => {
    const free = r.max - r.seated, full = free <= 0;
    return `<article class="card-ui r-card">
      <div class="r-top">${avatarHtml(r.host)}<div class="r-id"><h3>${U.esc(r.name)}</h3><span class="muted">Hosted by ${U.esc(r.host)}</span></div>
        <span class="pill ${r.status === 'lobby' ? 'r-open' : ''}">${r.status === 'lobby' ? 'Waiting to start' : `Playing · hand ${r.hand}`}</span></div>
      <div class="r-facts"><span><b>${U.esc(r.variant || 'Poker')}</b></span><span>Blinds <b>${r.sb != null ? U.fmt(r.sb) : '?'}/${r.bb != null ? U.fmt(r.bb) : '?'}</b>${r.ante ? ` · ante ${U.fmt(r.ante)}` : ''}</span>
        ${r.stack != null ? `<span>Stack <b>${U.fmt(r.stack)}</b></span>` : ''}<span><b>${r.seated}/${r.max}</b> seated</span>${r.sra ? `<span>${icon('lock')}Encrypted deal</span>` : ''}</div>
      <div class="r-actions">${r.watchId ? `<a class="btn" href="#watch=${r.watchId}">${icon('eye')}Watch</a>` : ''}
        <a class="btn primary ${full ? 'disabled' : ''}" ${full ? 'aria-disabled="true"' : `href="#join=${r.joinId}"`}>${icon('play')}${full ? 'Table full' : 'Join'}</a></div>
    </article>`;
  };
  async function scan() {
    if (scanning || !alive) return;
    scanning = true;
    const found = [];
    status.innerHTML = `<div class="spinner" style="width:18px;height:18px;border-width:2px"></div><span>Looking for tables…</span>`;
    const draw = () => {
      found.sort((a, b) => (a.status === 'lobby' ? 0 : 1) - (b.status === 'lobby' ? 0 : 1) || (b.max - b.seated) - (a.max - a.seated));
      list.innerHTML = found.map(card).join('');
    };
    try {
      await Rooms.scan((r) => { if (!alive) return; found.push(r); draw(); }, (n, total) => { if (alive) status.querySelector('span').textContent = `Looking for tables… (${n} of ${total} room slots checked)`; });
      if (!alive) return;
      draw();
      status.innerHTML = found.length
        ? `<span>${found.length} table${found.length === 1 ? '' : 's'} found · refreshes every 30 seconds</span>`
        : '';
      if (!found.length) list.innerHTML = `<div class="empty card-ui" style="padding:30px"><span class="e-ic">🪑</span><b>No public tables right now.</b><br>Be the first: <a href="#/host">host a game</a> and tick <i>List this table in the public Waiting Room</i>.</div>`;
    } catch (e) {
      if (!alive) return;
      const f = Net.friendly(e);
      status.innerHTML = '';
      list.innerHTML = `<div class="err-box">${icon('alert')}<div><b>${U.esc(f.title)}</b><br>${U.esc(f.message)}</div></div>`;
    } finally { scanning = false; }
    if (alive) { clearTimeout(timer); timer = setTimeout(scan, 30000); }
  }
  $('#r-refresh').addEventListener('click', () => { clearTimeout(timer); scan(); });
  scan();
  return { destroy() { alive = false; clearTimeout(timer); document.body.classList.remove('scroll'); } };
}

  const isHost = session.role === 'host';
  const isWatcher = session.role === 'watcher';
  const mobile = () => Device.mobile || matchMedia('(max-width: 900px)').matches;
  App.root.innerHTML = `<div class="game">

        <div class="table-stage" id="g-stage"><div class="banner hidden" id="g-banner" role="status"></div><div class="chat-feed" id="g-feed" aria-live="polite" aria-label="Recent chat"></div></div>

        </div>

        <div class="tab-panel hidden" id="tp-chat" role="tabpanel"><div class="chat-wrap"><div class="chat-list" id="g-chat"><div class="empty"><span class="e-ic">💬</span>No messages yet. Say hi!</div></div>
          <form class="chat-form" id="g-chatform"><input class="input" id="g-chatin" maxlength="280" placeholder="Message the table" aria-label="Chat message" autocomplete="off"><button class="btn primary">Send</button></form></div></div>

    <footer class="action-bar" id="g-bar" aria-label="Your actions"><div class="ab-msg"><div class="spinner" style="width:22px;height:22px;border-width:2px"></div>Loading table…</div></footer>
  </div>`;
  bindThemeToggles(App.root);

  const G = {
    session, view: null, pre: null, raiseAmt: null, barKey: null, logId: 0, chatId: 0, tab: 'log', sending: false,
    status: 'connected', ended: null, qrCache: {}, lastLegalKey: null,
  };
  const stage = $('#g-stage');
  const table = new TableView(stage, { onSit: (seat) => session.send({ t: 'sit', seat }) });
  const side = $('#g-side');
  const setPanel = (open) => {
    side.classList.toggle('collapsed', !open);
    $('#g-panel').setAttribute('aria-expanded', String(open));
    if (open) { $('#g-badge').classList.add('hidden'); if (G.tab === 'chat') $('#g-chatbadge').classList.add('hidden'); }
    setTimeout(() => table.layout(), 300);
  };
  setPanel(!mobile() && Prefs.get('panelOpen', true));
  $('#g-panel').addEventListener('click', () => { const open = side.classList.contains('collapsed'); if (!mobile()) Prefs.set('panelOpen', open); setPanel(open); });
  $('#g-chatbtn').addEventListener('click', () => { const open = side.classList.contains('collapsed') || G.tab !== 'chat'; selectTab('chat'); setPanel(open); if (open) $('#g-chatbadge').classList.add('hidden'); });

  // Tabs
  $$('.tab', side).forEach((t) => t.addEventListener('click', () => selectTab(t.dataset.tab)));
  function selectTab(name) {

  /* ----- fair play ----- */
  function fairState() {
    const sra = G.view && G.view.table.sra;
    const ck = session.fair, f = ck && ck.latest;
    const failed = ck && Object.values(ck.hands).find((x) => x.status === 'failed');
    if (failed && !isHost) return { cls: 'bad', label: 'Check failed', icon: 'shieldBad', f: failed };
    if (sra) return { cls: 'ok', label: 'Encrypted', icon: 'lock', sra: true };
    if (isHost) return { cls: 'host', label: 'You deal', icon: 'shieldOk' };
    if (f && f.status === 'verified') return { cls: 'ok', label: 'Verified', icon: 'shieldOk', f };
    return { cls: '', label: 'Fair play', icon: 'shield', f };
  }
  function renderFairBadge() {
    const st = fairState(), b = $('#g-fair');

    b.style.color = st.cls === 'bad' ? 'var(--danger)' : st.cls === 'ok' || st.cls === 'host' ? 'var(--accent)' : '';

  }
  function fairModal() {
    const st = fairState(), f = st.f, t = G.view ? G.view.table : {};
    let head;
    if (st.sra) {
      openModal(`<h2>${icon('lock')} Encrypted deal</h2>
        <div class="issue ok">${icon('shieldOk')} <b>Nobody can see your cards but you, and that includes the host.</b></div>
        <div class="section-title">How it works</div>
        <ul class="hint" style="padding-left:18px;margin:0;line-height:1.6">
          <li><b>Everyone shuffles:</b> each player's browser locks all 52 cards with its own secret key and shuffles them, so nobody knows the order.</li>
          <li><b>Only you hold the last key:</b> every other player gives your browser their key for your cards, but nobody ever gets yours. The host's device only ever relays locked cards.</li>
          <li><b>Board cards</b> are unlocked street by street. Every key comes with a check, so each browser verifies every card itself.</li>
          <li><b>At showdown</b> your browser shows your hand by giving out your key, or mucks it, following your auto-muck setting. Folded and mucked hands are never revealed${t.recordHole === 'All' ? ', except that this table records every hand once it is over ("All cards")' : ''}.</li>
          <li><b>Tampering is caught:</b> a wrong key, a doctored card or an altered shuffle step stops the deal and names the player whose browser did it.</li>
          <li><b>The limits:</b> nothing can stop two players from sharing their cards in a chat app. If a player leaves in the middle of a hand, the hand is cancelled and the chips go back.</li>
        </ul>
        <div class="modal-foot"><button class="btn primary" data-close>Close</button></div>`, { label: 'Encrypted deal' });
      return;
    }
    if (isHost) {
      head = `<p>Your device is the dealer. Each hand it commits to a secret deck <b>before</b> the players' browsers add their own randomness, so it can't arrange the cards. Every player's browser checks every card it sees against that commitment and re-checks each hand's result against the rules.</p>
        <p class="muted">${t.hostPlays ? 'This table uses the standard deal, so your device can technically see every hole card. For games where that matters, start the next table with <b>Encrypted deal</b> turned on: then nobody, including you, can see other players\' cards.' : 'You are dealing without playing. For full privacy, use the <b>Encrypted deal</b> next time.'}</p>`;

        <p>The host's device didn't deal or score this hand the way it promised. That points to a modified game page or a tampered connection. Consider stopping play with this host.</p>`;

        ${f.notes.length ? `<p class="hint">${f.notes.map(U.esc).join(' ')}</p>` : ''}`;
    } else head = '<p>Verification starts with the next hand that you are at the table for.</p>';
    openModal(`<h2>${icon('shield')} Fair play</h2>${head}
      <div class="section-title">What your browser checks</div>
      <ul class="hint" style="padding-left:18px;margin:0;line-height:1.6">
        <li><b>No peeking:</b> you only ever receive your own hole cards. Other players' cards reach you only if they are shown.</li>
        <li><b>No stacked decks:</b> the host commits to the deck before your random seed is added, so it can't choose who gets which card.</li>
        <li><b>No swapped cards:</b> your cards, the board and every shown hand are checked against the committed deck. Leftover cards are checked when the hand ends.</li>
        <li><b>No fiddled pots:</b> every hand is replayed through the rules engine on your device.</li>

  /** Hand review of this player's decisions, from the full record (it has all of their own cards). */
  function reviewMine() {
