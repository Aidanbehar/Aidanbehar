/* =====================================================================
   5. HOST TABLE  (authoritative game controller; runs only in the host's tab)
   Owns seats, stacks, the deck and timers; drives the Engine; builds a
   personalised view for every player so hidden cards never leave the host.
   Transport-agnostic: the networking layer calls handle() and listens to
   onChange / onEvent / onRecord / onDirect.
   ===================================================================== */
const DISCONNECT_GRACE = 30;   // seconds a disconnected player gets on their turn when the timer is off
const HAND_PAUSE_MS = 5200;    // results stay on screen this long before the next deal
const SEED_WAIT_MS = 2500;     // how long the host waits for each round of shuffle randomness
// Blind levels (multiples of the starting blinds) when "blinds go up every N hands" is on.
const LEVEL_FACTORS = [1, 2, 3, 5, 8, 10, 15, 20, 30, 50, 80, 100, 150, 200, 300, 500, 800, 1000];

class HostTable {
  constructor(settings, hostName, hostToken) {
    this.s = { game: 'holdem', limit: 'nl', levelHands: 0, maxRebuys: 0, hostPlays: true, ...settings };
    this.gameKind = this.s.game === 'holdem' ? 'holdem' : 'omaha';
    this.holeCount = this.s.game === 'omaha5' ? 5 : this.s.game === 'omaha4' ? 4 : 2;
    this.variant = Notation.variantCode(this.gameKind, this.s.limit, this.holeCount);
    this.level = 0;
    this.blinds = { sb: this.s.sb, bb: this.s.bb, ante: this.s.ante };
    this.shuffling = null;      // commit-reveal shuffle in progress
    this.fair = null;           // proofs for the current hand
    this.players = new Map();
    this.seats = new Array(this.s.maxSeats).fill(null);
    this.status = 'lobby';
    this.paused = false;
    this.handNo = 0;
    this.hand = null;
    this.handPids = [];
    this.buttonSeat = -1;
    this.finished = [];        // [{hand, pids}]
    this.names = [];           // every name ever dealt in (record [Players])
    this.log = []; this.logCursor = 0; this.logId = 0;
    this.chat = []; this.chatId = 0;
    this.turn = null;          // {deadline, total, idx, handle}
    this.nextTimer = null; this.dealTimer = null;
    this.banned = new Set();
    const d = new Date();
    this.date = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
    this.onChange = () => {}; this.onEvent = () => {}; this.onRecord = () => {}; this.onDirect = () => {}; this.onBroadcast = () => {};
    this.hostPid = this.addPlayer(hostName, hostToken).pid;
    this.players.get(this.hostPid).isHost = true;
    this.players.get(this.hostPid).connected = true;
    if (this.s.hostPlays !== false) this._sit(this.hostPid, 0);
  }

  /* ---------------- players ---------------- */
  /** Names must be unique for the whole game so the record stays unambiguous. */
  uniqueName(name) {
    const base = U.sanitizeName(name) || 'Player';
    const taken = (x) => [...this.players.values()].some((p) => p.name.toLowerCase() === x.toLowerCase())
      || this.names.some((y) => y.toLowerCase() === x.toLowerCase());
    let n = base, k = 2;
    while (taken(n)) n = `${base.slice(0, 15)} ${k++}`;
    return n;
  }
  byToken(token) { return [...this.players.values()].find((p) => p.token === token); }

  /** Join or reconnect. Returns {player, reconnected} or {error}. */
  addPlayer(name, token) {
    if (token && this.banned.has(token)) return { error: 'You were removed from this table by the host.' };
    const existing = token && this.byToken(token);
    if (existing) { existing.lastSeen = Date.now(); return { player: existing, reconnected: true, pid: existing.pid }; }
    if (this.status === 'ended') return { error: 'This game has ended.' };
    if (this.players.size >= 24) return { error: 'This table is full.' };
    const pid = 'p' + U.randHex(4);
    const p = {
      pid, token: token || U.randHex(16), name: this.uniqueName(name), seat: null, stack: this.s.startingStack,
      sittingOut: false, busted: false, connected: true, lastSeen: Date.now(), disconnectedAt: null,
      autoMuck: true, rebuys: 0, bought: this.s.startingStack, isHost: false, leaving: false,
    };
    this.players.set(pid, p);
    return { player: p, reconnected: false, pid };
  }

  setConnected(pid, on) {
    const p = this.players.get(pid);
    if (!p || p.connected === on) return;
    p.connected = on;
    p.disconnectedAt = on ? null : Date.now();
    if (p.seat != null) this.onEvent(on ? 'success' : 'warn', on ? `${p.name} reconnected` : `${p.name} disconnected`, pid);
    // A disconnected player on the clock with no action timer gets a grace timer.
    if (this.hand && this.hand.phase === 'betting' && this.handPids[this.hand.toAct] === pid) this._startTurnTimer(true);
    this.changed();
  }

  /* ---------------- intents ---------------- */
  /** Every client message and every host UI action ends up here. */
  handle(pid, m) {
    const p = this.players.get(pid);
    if (!p || !m || typeof m !== 'object') return;
    const isHost = pid === this.hostPid;
    const err = (text) => this.onDirect(pid, { t: 'error', text });
    p.lastSeen = Date.now();
    switch (m.t) {
      case 'sit': {
        const seat = Number(m.seat);
        if (this.status === 'ended') return err('The game has ended.');
        if (p.seat != null) return err('You already have a seat.');
        if (pid === this.hostPid && this.s.hostPlays === false) return err('You chose to deal without playing at this table.');
        if (!(seat >= 0 && seat < this.seats.length) || this.seats[seat]) return err('That seat is taken.');
        this._sit(pid, seat);
        this.onEvent('info', `${p.name} sat down`, null);
        this._maybeDeal();
        break;
      }
      case 'stand': {
        if (p.seat == null) return;
        if (this._inLiveHand(pid)) return err('You can leave your seat once this hand is over. Sit out to skip future hands.');
        this.seats[p.seat] = null; p.seat = null;
        this._log(`${p.name} stood up`);
        break;
      }
      case 'sitout': p.sittingOut = !!m.on; if (!m.on) this._maybeDeal(); break;
      case 'automuck': p.autoMuck = !!m.on; break;
      case 'action': {
        const h = this.hand;
        if (this.status !== 'playing' || !h) return err('There is no hand in progress.');
        if (this.paused) return err('The game is paused.');
        const idx = this.handPids.indexOf(pid);
        if (h.phase !== 'betting' || idx < 0 || h.toAct !== idx) return err("It's not your turn.");
        try { Engine.applyAction(h, { type: String(m.action), to: m.amount == null ? undefined : Math.round(Number(m.amount)) }); }
        catch (e) { return err(e.message); }
        this._afterAction();
        return;
      }
      case 'show': {
        const h = this.hand, idx = this.handPids.indexOf(pid);
        if (!h || h.phase !== 'done' || idx < 0) return;
        if (Engine.showCards(h, idx)) { this._syncLog(); this._sendRecords(); }
        break;
      }
      case 'rebuy': {
        if (!this.s.rebuys) return err('Rebuys are not allowed at this table.');
        if (this.s.maxRebuys && p.rebuys >= this.s.maxRebuys) return err(`You have used all ${this.s.maxRebuys} rebuy${this.s.maxRebuys > 1 ? 's' : ''}.`);
        if (p.stack > 0) return err('You can rebuy once you are out of chips.');
        if (this._inLiveHand(pid)) return err('Wait for this hand to finish.');
        p.stack = this.s.startingStack; p.rebuys++; p.bought += this.s.startingStack; p.busted = false; p.sittingOut = false;
        this._log(`${p.name} rebuys for ${U.fmt(this.s.startingStack)}`);
        this.onEvent('info', `${p.name} rebought`, null);
        this._maybeDeal();
        break;
      }
      // Shuffle randomness: a commitment first, then the seed itself (see FAIR SHUFFLE PROOFS).
      case 'fairc': case 'fairs': {
        const sh = this.shuffling;
        if (!sh || m.no !== sh.no || !sh.order.includes(pid)) return;
        if (m.t === 'fairc' && sh.stage === 1 && sh.seedC[pid] == null && Fair.isHex(m.c, 64)) sh.seedC[pid] = m.c;
        if (m.t === 'fairs' && sh.stage === 2 && sh.seedC[pid] && sh.seeds[pid] == null && Fair.isHex(m.seed, 64)) sh.seeds[pid] = m.seed;
        if (sh.waiter) sh.waiter();
        return;
      }
      case 'chat': {
        const text = String(m.text || '').replace(/\s+/g, ' ').trim().slice(0, 280);
        if (!text) return;
        this.chat.push({ id: ++this.chatId, from: p.name, text, ts: Date.now() });
        if (this.chat.length > 80) this.chat.shift();
        break;
      }
      // ---- host-only controls ----
      case 'start':
        if (!isHost) return;
        if (this.status !== 'lobby') return;
        if (this._eligible().length < 2) return err('At least two seated players with chips are needed.');
        this.status = 'playing';
        this.onEvent('success', 'The game has started', null);
        this._startHand();
        return;
      case 'pause':
        if (!isHost || this.status !== 'playing') return;
        this._setPaused(!!m.on);
        break;
      case 'kick': {
        if (!isHost) return;
        const q = this.players.get(m.pid);
        if (!q || q.pid === this.hostPid) return;
        this.banned.add(q.token);
        this.onDirect(q.pid, { t: 'kicked' });
        this.onEvent('warn', `${q.name} was removed by the host`, null);
        this._log(`${q.name} was removed from the table`);
        if (this._inLiveHand(q.pid)) {
          q.leaving = true;
          if (this.hand.phase === 'betting' && this.handPids[this.hand.toAct] === q.pid) { Engine.applyAction(this.hand, { type: 'fold' }); this._afterAction(); return; }

      }
      case 'adjust': {
        if (!isHost) return;
        if (this.shuffling || (this.hand && this.hand.phase !== 'done')) return err('Stacks can only be changed between hands.');
        for (const [qid, val] of Object.entries(m.stacks || {})) {
          const q = this.players.get(qid), v = Math.max(0, Math.floor(Number(val)));

          this._log(`Host set ${q.name}'s stack to ${U.fmt(v)} (was ${U.fmt(q.stack)})`);
          q.bought += v - q.stack; q.stack = v;
          if (v > 0) { q.busted = false; if (!this.s.rebuys) q.sittingOut = false; }

        this._maybeDeal();

      case 'end':
        if (!isHost) return;
        this.end('The host ended the game.');
        return;
      default: return;
    }
    this.changed();
  }

  _sit(pid, seat) {
    const p = this.players.get(pid);
    this.seats[seat] = pid; p.seat = seat; p.sittingOut = false;
    if (p.stack <= 0 && !this.s.rebuys) { p.sittingOut = true; p.busted = true; }

  _remove(pid) {

  _eligible() {

  _log(text, kind = '') {
    this.log.push({ id: ++this.logId, text, kind });

  }
  _syncLog() {
    const h = this.hand;
    if (!h) return;
    for (; this.logCursor < h.log.length; this.logCursor++) {
      const e = h.log[this.logCursor];
      this._log(Engine.describeEntry(h, e), e.t === 'win' ? 'win' : '');
    }

  _setPaused(on) {
    if (this.paused === on) return;
    this.paused = on;
    this._log(on ? 'Game paused by the host' : 'Game resumed');
    this.onEvent('info', on ? 'Game paused' : 'Game resumed', null);
    if (on) {
      if (this.turn) { clearTimeout(this.turn.handle); this.turn.frozen = this.turn.deadline ? Math.max(0, this.turn.deadline - Date.now()) : null; }
      clearTimeout(this.nextTimer); this.nextTimer = null;
    } else {
      if (this.turn && this.turn.frozen != null) this._armTurn(this.turn.frozen, this.turn.total);
      if (!this.hand || this.hand.phase === 'done') this._startHand();
      else this._proceed();

  }

  /* ---------------- hand lifecycle ---------------- */
  _maybeDeal() {
    if (this.status === 'playing' && !this.paused && !this.shuffling && (!this.hand || this.hand.phase === 'done') && !this.nextTimer) this._startHand();
  }

  _startHand() {
    clearTimeout(this.nextTimer); this.nextTimer = null;
    if (this.status !== 'playing' || this.paused || this.shuffling) return this.changed();
    // Players who have been gone for two minutes are sat out automatically.
    for (const p of this.players.values()) if (!p.connected && p.disconnectedAt && Date.now() - p.disconnectedAt > 120000 && p.seat != null) p.sittingOut = true;
    const elig = this._eligible();
    if (elig.length < 2) { this.waiting = true; return this.changed(); }
    this.waiting = false;
    let bi;
    if (this.buttonSeat < 0) bi = U.randInt(elig.length);
    else { bi = elig.findIndex((e) => e.seat > this.buttonSeat); if (bi < 0) bi = 0; }
    this.buttonSeat = elig[bi].seat;
    const no = ++this.handNo;
    // Rising blinds.
    const lv = this.s.levelHands ? Math.min(LEVEL_FACTORS.length - 1, Math.floor((no - 1) / this.s.levelHands)) : 0;
    const f = LEVEL_FACTORS[lv];
    this.blinds = { sb: this.s.sb * f, bb: this.s.bb * f, ante: this.s.ante * f };
    if (lv !== this.level) {
      this.level = lv;
      const b = this.blinds;
      this._log(`Blinds go up to ${U.fmt(b.sb)}/${U.fmt(b.bb)}${b.ante ? `, ante ${U.fmt(b.ante)}` : ''}`);
      this.onEvent('info', `Blinds are now ${U.fmt(b.sb)}/${U.fmt(b.bb)}`, null);
    }
    const n = elig.length, order = [];
    for (let k = 1; k <= n; k++) order.push(elig[(bi + k) % n].pid);
    const sh = this.shuffling = {
      no, elig, bi, order, seedC: {}, seeds: {}, stage: 1, blinds: { ...this.blinds },
      names: Object.fromEntries(elig.map((e) => [e.pid, this.players.get(e.pid).name])),
      stacks: Object.fromEntries(elig.map((e) => [e.pid, this.players.get(e.pid).stack])),
    };
    this.changed();
    this._fairShuffle(sh).then(() => {
      if (this.shuffling !== sh) return;
      this.shuffling = null;
      if (this.status !== 'playing') return this.changed();
      this._deal(sh);
    }, (e) => { console.error(e); this.shuffling = null; this.changed(); });
  }

  /** Commit to a secret pre-deck, then mix in every player's committed randomness. */
  async _fairShuffle(sh) {
    const D0 = Cards.shuffle(Cards.newDeck());
    const salts = D0.map(() => U.randHex(16));
    const commits = D0.map((c, i) => Fair.commit(c, salts[i]));
    Object.assign(sh, { D0, salts, commits });
    const contributors = sh.order.filter((pid) => { const p = this.players.get(pid); return p && (pid === this.hostPid || p.connected); });
    this.onBroadcast({ t: 'fair1', no: sh.no, commits });
    if (contributors.includes(this.hostPid)) { sh.hostSeed = U.randHex(32); sh.seedC[this.hostPid] = Fair.sha256(sh.hostSeed); }
    await this._collect(sh, 'seedC', contributors);
    sh.stage = 2;
    const committed = Object.keys(sh.seedC);
    this.onBroadcast({ t: 'fair2', no: sh.no, seedCommits: committed.map((pid) => sh.seedC[pid]) });
    if (sh.hostSeed) sh.seeds[this.hostPid] = sh.hostSeed;
    await this._collect(sh, 'seeds', committed);
    sh.stage = 3;
    const seeds = committed.filter((pid) => sh.seeds[pid] && Fair.sha256(sh.seeds[pid]) === sh.seedC[pid]).map((pid) => sh.seeds[pid]);
    sh.seedList = seeds;
    sh.holeCount = this.holeCount;
    sh.perm = Fair.permutation(Fair.combine(sh.no, commits, seeds), 52);
    sh.deck = sh.perm.map((i) => D0[i]);
    sh.layout = Fair.layout(sh.order.length, this.holeCount);
    this.onBroadcast({ t: 'fair3', no: sh.no, seeds, order: sh.order.map((pid) => sh.names[pid]), holeCount: this.holeCount });
  }

  _collect(sh, key, pids) {
    return new Promise((resolve) => {
      const done = () => pids.every((pid) => sh[key][pid] != null);
      if (done()) return resolve();
      const t = setTimeout(() => { sh.waiter = null; resolve(); }, SEED_WAIT_MS);
      sh.waiter = () => { if (done()) { clearTimeout(t); sh.waiter = null; resolve(); } };
    });
  }

  /** Deal from the jointly-shuffled deck and send each player the proofs for their own cards. */
  _deal(sh) {
    const hc = this.holeCount, L = sh.layout;
    const at = (pos) => ({ pos, card: sh.deck[pos], salt: sh.salts[sh.perm[pos]] });
    const holeOf = {};
    sh.order.forEach((pid, k) => {
      const own = Array.from({ length: hc }, (_, r) => at(L.hole(k, r)));
      holeOf[pid] = own.map((x) => x.card);
      this.onDirect(pid, { t: 'fairown', no: sh.no, cards: own });
    });
    this.fair = sh;
    this.handPids = sh.elig.map((e) => e.pid);
    for (const pid of this.handPids) { const nm = sh.names[pid]; if (!this.names.includes(nm)) this.names.push(nm); }
    this.hand = Engine.createHand({
      no: sh.no, players: sh.elig.map((e) => ({ name: sh.names[e.pid], stack: sh.stacks[e.pid] })),
      button: sh.bi, sb: sh.blinds.sb, bb: sh.blinds.bb, ante: sh.blinds.ante, hole: sh.elig.map((e) => holeOf[e.pid]),
      game: this.gameKind, limit: this.s.limit, holeCount: hc,
    });
    this.logCursor = 0;
    this._log(`Hand #${sh.no}`, 'hand');
    this._syncLog();
    this._proceed();
  }

  /** Public proofs for this hand: board cards, shown hands, and at the end everything nobody needs to keep secret. */
  _fairView() {
    const f = this.fair, h = this.hand;
    if (!f || !h || f.no !== h.no) return null;
    const L = f.layout, seen = new Set(), reveals = [];
    const add = (pos) => { if (!seen.has(pos)) { seen.add(pos); reveals.push({ pos, card: f.deck[pos], salt: f.salts[f.perm[pos]] }); } };
    h.board.forEach((c, i) => add(L.board[i]));
    h.players.forEach((p, i) => {
      if (!p.shown) return;
      const k = f.order.indexOf(this.handPids[i]);
      for (let r = 0; r < f.holeCount; r++) add(L.hole(k, r));
    });
    if (h.phase === 'done') {
      const secret = new Set();
      if (this.s.recordHole !== 'All') {
        h.players.forEach((p, i) => {
          if (p.shown) return;
          const k = f.order.indexOf(this.handPids[i]);
          for (let r = 0; r < f.holeCount; r++) secret.add(L.hole(k, r));
        });
      }
      for (let pos = 0; pos < 52; pos++) if (!secret.has(pos)) add(pos);
    }
    return { no: f.no, reveals, final: h.phase === 'done', seeds: f.seedList.length };
  }

  _afterAction() {
    this._clearTurn();
    this._syncLog();
    this._proceed();
  }

  _proceed() {
    const h = this.hand;
    if (!h) return this.changed();
    for (let guard = 0; guard < 50; guard++) {
      if (h.phase === 'betting') {
        const p = this.players.get(this.handPids[h.toAct]);
        if (!p || p.leaving) { Engine.applyAction(h, { type: 'fold' }); this._syncLog(); continue; }
        if (!this.turn || this.turn.idx !== h.toAct || this.turn.street !== h.street || this.turn.no !== h.no) this._startTurnTimer();
        break;
      }
      if (h.phase === 'deal') {
        if (!this.dealTimer && !this.paused) {
          const runout = h.players.filter((p) => !p.folded && !p.allIn).length <= 1;
          this.dealTimer = setTimeout(() => {
            this.dealTimer = null;
            if (this.hand !== h || h.phase !== 'deal' || this.status !== 'playing') return;
            if (this.paused) return;
            // Burn and turn from the committed positions (see Fair.layout).
            const idx = h.street === 0 ? [0, 1, 2] : [h.street + 2];
            const cards = idx.map((i) => this.fair.deck[this.fair.layout.board[i]]);
            Engine.dealBoard(h, cards);
            this._syncLog();
            this._proceed();
          }, runout ? 1300 : 650);
        }
        break;
      }
      if (h.phase === 'showdown') {
        Engine.settle(h, Engine.planShowdown(h, (i) => { const p = this.players.get(this.handPids[i]); return !p || p.autoMuck !== false; }));
        this._finishHand();
        break;
      }
      if (h.phase === 'settle') { Engine.settle(h); this._finishHand(); break; }
      break;
    }
    this.changed();
  }

  _finishHand() {
    const h = this.hand;
    this._clearTurn();
    this._syncLog();
    h.players.forEach((hp, i) => { const p = this.players.get(this.handPids[i]); if (p) p.stack = hp.stack; });
    this.finished.push({ hand: h, pids: this.handPids.slice() });
    for (const pid of this.handPids) {
      const p = this.players.get(pid);
      if (!p) continue;
      if (p.leaving) { this._remove(pid); continue; }
      if (p.stack === 0) {
        p.busted = true;
        p.sittingOut = true;
        this._log(this.s.rebuys ? `${p.name} is out of chips (rebuy available)` : `${p.name} is out of chips`);
      }
    }
    this._sendRecords();
    clearTimeout(this.nextTimer);
    if (this._eligible().length < 2) this.waiting = true;
    this.nextTimer = setTimeout(() => { this.nextTimer = null; this._startHand(); }, HAND_PAUSE_MS + (h.results.showdown ? 1200 : 0));
  }

  /* ---------------- action clock ---------------- */
  _startTurnTimer(keepIfRunning) {
    const h = this.hand;
    if (!h || h.phase !== 'betting') return;
    const p = this.players.get(this.handPids[h.toAct]);
    if (keepIfRunning && this.turn && this.turn.idx === h.toAct && this.turn.deadline && this.s.timer) return;
    this._clearTurn();
    let secs = this.s.timer || 0;
    if (!secs && p && !p.connected) secs = DISCONNECT_GRACE;
    this.turn = { idx: h.toAct, street: h.street, no: h.no, deadline: null, total: secs * 1000, handle: null };
    if (secs && !this.paused) this._armTurn(secs * 1000, secs * 1000);
    else if (secs && this.paused) this.turn.frozen = secs * 1000;
  }
  _armTurn(ms, total) {
    const t = this.turn;
    t.total = total; t.deadline = Date.now() + ms; t.frozen = null;
    clearTimeout(t.handle);
    t.handle = setTimeout(() => this._timeout(t), ms);
  }
  _timeout(t) {
    const h = this.hand;
    if (this.turn !== t || !h || h.phase !== 'betting' || h.toAct !== t.idx || this.paused) return;
    const L = Engine.legal(h);
    Engine.applyAction(h, { type: L.canCheck ? 'check' : 'fold' });
    this._log(`${h.players[t.idx].name} ran out of time`);
    this._afterAction();
  }
  _clearTurn() { if (this.turn) clearTimeout(this.turn.handle); this.turn = null; }

  end(reason) {
    if (this.status === 'ended') return;
    this.status = 'ended';
    this._clearTurn(); clearTimeout(this.nextTimer); clearTimeout(this.dealTimer);
    this.shuffling = null;
    this._log('The game has ended');
    this._sendRecords();
    this.onEvent('info', reason, null);
    this.changed();
  }

  /* ---------------- records ---------------- */
  recordFor(pid) {
    const tags = Notation.gameTags({
      event: this.s.tableName, date: this.date, sb: this.s.sb, bb: this.s.bb, ante: this.s.ante,
      startingStack: this.s.startingStack, players: this.names, holeCards: this.s.recordHole, variant: this.variant,
    });
    const hands = this.finished.map(({ hand, pids }) => Notation.fromHand(hand, pids.indexOf(pid), this.s.recordHole, { levels: !!this.s.levelHands }));
    return Notation.serialize({ tags, hands });
  }
  _sendRecords() { for (const pid of this.players.keys()) this.onRecord(pid, this.recordFor(pid)); }

  changed() { this.onChange(); }

  /* ---------------- personalised view ---------------- */
  viewFor(pid) {
    const me = this.players.get(pid);
    const h = this.hand;
    const myIdx = h ? this.handPids.indexOf(pid) : -1;
    const done = h && h.phase === 'done';
    const curActs = {};
    if (h) for (const e of h.log) {
      if (e.t === 'act' && e.street === h.street) curActs[e.p] = e;
      if (e.t === 'post' && h.street === 0 && e.kind !== 'a' && !curActs[e.p]) curActs[e.p] = { type: e.kind, amt: e.amt };
    }
    const wins = {};
    if (done) h.log.filter((e) => e.t === 'win').forEach((e) => { wins[e.p] = (wins[e.p] || 0) + e.amt; });
    const winCards = new Set();
    if (done && h.results.showdown) h.results.pots.forEach((pt) => pt.winners.forEach((w) => { const ev = h.results.evals[w]; if (ev) ev.best.forEach((c) => winCards.add(c)); }));

    const seats = this.seats.map((qid, seat) => {
      if (!qid) return null;
      const q = this.players.get(qid);
      if (!q) return null;
      const i = h ? this.handPids.indexOf(qid) : -1;
      const hp = i >= 0 ? h.players[i] : null;
      let cards = null;
      if (hp) {
        if (qid === pid || hp.shown) cards = hp.hole.slice();
        else if (!hp.folded && !hp.mucked) cards = new Array(hp.hole.length).fill(null);
      }
      let handName = null;
      if (hp && cards && cards[0] && (qid === pid || hp.shown) && !(qid === pid && hp.folded && !done)) {
        const e = Eval.forGame(h.game, hp.hole, h.board);
        handName = Eval.describe(e);
      }
      const la = hp && curActs[i];
      return {
        seat, pid: qid, name: q.name, stack: hp ? hp.stack : q.stack, bet: hp ? hp.bet : 0, cards,
        inHand: !!hp, folded: !!hp && hp.folded, allIn: !!hp && hp.allIn && !done, sittingOut: q.sittingOut && !hp,
        busted: q.busted && !hp, disconnected: !q.connected, isHost: q.isHost, isYou: qid === pid,
        button: !!h && hp && i === h.button, sb: !!h && hp && i === h.sbIdx && !done, bb: !!h && hp && i === h.bbIdx && !done,
        toAct: !!h && h.phase === 'betting' && h.toAct === i,
        won: done && wins[i] ? wins[i] : 0, handName, shown: !!hp && hp.shown, mucked: !!hp && hp.mucked,
        lastAction: la ? la.type : null, lastTo: la ? la.to || la.amt : null,
      };
    });
    let pots = [];
    if (h && !done) {
      const ps = Engine.collectedPots(h);
      pots = ps.map((pt, k) => ({ label: ps.length > 1 ? (k === 0 ? 'Main' : `Side ${k}`) : 'Pot', amount: pt.amount }));
    }
    let legal = null;
    if (h && h.phase === 'betting' && myIdx >= 0 && h.toAct === myIdx && !this.paused) legal = Engine.legal(h);
    const t = this.turn;
    const timer = t && h && h.phase === 'betting' && t.idx === h.toAct
      ? { remaining: t.deadline ? Math.max(0, t.deadline - Date.now()) : t.frozen, total: t.total, paused: this.paused } : null;
    const results = done ? {
      showdown: h.results.showdown,
      winCards: [...winCards],
      lines: h.log.filter((e) => e.t === 'win').map((e) => Engine.describeEntry(h, e)),
    } : null;
    return {
      t: 'state',
      table: {
        name: this.s.tableName, sb: this.blinds.sb, bb: this.blinds.bb, ante: this.blinds.ante, baseSb: this.s.sb, baseBb: this.s.bb,
        maxSeats: this.s.maxSeats, timer: this.s.timer, rebuys: this.s.rebuys, maxRebuys: this.s.maxRebuys || 0, recordHole: this.s.recordHole,
        startingStack: this.s.startingStack, variant: this.variant, variantName: VARIANTS[this.variant].name, holeCount: this.holeCount,
        limit: this.s.limit, levelHands: this.s.levelHands || 0, level: this.level + 1, hostPlays: this.s.hostPlays !== false,
        nextLevelIn: this.s.levelHands ? this.s.levelHands - ((Math.max(1, this.handNo) - 1) % this.s.levelHands) : 0,
      },
      shuffling: !!this.shuffling, fair: this._fairView(),
      status: this.status, paused: this.paused, waiting: !!this.waiting, handNo: h ? h.no : 0,
      phase: h ? h.phase : null, street: h ? (done ? (h.results.showdown ? 'Showdown' : STREETS[h.street]) : STREETS[h.street]) : '',
      board: h ? h.board.slice() : [], pots, potTotal: h && !done ? Engine.potTotal(h) : 0,
      seats, legal, timer, results,
      you: me ? {
        pid, name: me.name, seat: me.seat, isHost: pid === this.hostPid, inHand: myIdx >= 0 && !!h && !h.players[myIdx].folded && !done,
        dealt: myIdx >= 0, sittingOut: me.sittingOut, busted: me.busted, stack: me.stack, autoMuck: me.autoMuck,
        canShow: !!done && myIdx >= 0 && !h.players[myIdx].shown, canRebuy: !!this.s.rebuys && me.stack === 0 && !this._inLiveHand(pid) && (!this.s.maxRebuys || me.rebuys < this.s.maxRebuys),
        toCallPreview: h && myIdx >= 0 && h.phase === 'betting' && !h.players[myIdx].folded ? Math.max(0, h.currentBet - h.players[myIdx].bet) : 0,
      } : null,
      hostName: this.players.get(this.hostPid).name,
      players: [...this.players.values()].map((q) => ({
        pid: q.pid, name: q.name, seat: q.seat, stack: q.stack, connected: q.connected, sittingOut: q.sittingOut, busted: q.busted,
        isHost: q.isHost, rebuys: q.rebuys, net: (this._liveStack(q.pid) ?? q.stack) - q.bought,
      })),
      log: this.log.slice(-120), chat: this.chat.slice(-60),
    };
  }
  _liveStack(pid) {
    const h = this.hand, i = this.handPids.indexOf(pid);
    if (!h || i < 0 || h.phase === 'done') return null;
    return h.players[i].stack + h.players[i].committed;
  }
}

/* =====================================================================
   6. NETWORKING  (PeerJS free cloud broker + free public STUN; no TURN)
   Host = authoritative. Clients send intents only and receive their own
   personalised state. "?local" in the URL swaps PeerJS for a
   BroadcastChannel transport so two tabs can play fully offline.
   ===================================================================== */
const Prefs = {
  get(k, d) { try { const v = localStorage.getItem('feltroom.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('feltroom.' + k, JSON.stringify(v)); } catch { /* private mode */ } },
  del(k) { try { localStorage.removeItem('feltroom.' + k); } catch { /* ignore */ } },
};

/** Drop-in stand-in for the parts of the PeerJS API we use, over BroadcastChannel (same browser only). */
class LocalPeer {
  constructor(id) {
    this.id = typeof id === 'string' ? id : 'local-' + U.randHex(4);
    this.h = {}; this.conns = {}; this.disconnected = false; this.destroyed = false;
    this.bc = new BroadcastChannel('feltroom-local');
    this.bc.onmessage = (e) => this._msg(e.data);
    setTimeout(() => this._emit('open', this.id), 40);
    addEventListener('beforeunload', () => this.destroy());
  }
  on(ev, fn) { (this.h[ev] = this.h[ev] || []).push(fn); return this; }
  off() { }
  _emit(ev, ...a) { (this.h[ev] || []).forEach((f) => f(...a)); }
  connect(to) {
    const c = new LocalConn(this, U.randHex(6), to);
    this.conns[c.cid] = c;
    this.bc.postMessage({ k: 'connect', from: this.id, to, cid: c.cid });
    c._timer = setTimeout(() => { if (!c.open) this._emit('error', { type: 'peer-unavailable', message: 'Could not connect to peer ' + to }); }, 2500);
    return c;
  }
  _msg(m) {
    if (this.destroyed || m.to !== this.id) return;
    const c = this.conns[m.cid];
    if (m.k === 'connect') {
      const nc = new LocalConn(this, m.cid, m.from);
      this.conns[m.cid] = nc; nc.open = true;
      this._emit('connection', nc);
      this.bc.postMessage({ k: 'accept', cid: m.cid, to: m.from });
      setTimeout(() => nc._emit('open'), 0);
    } else if (m.k === 'accept' && c) { c.open = true; clearTimeout(c._timer); c._emit('open'); }
    else if (m.k === 'data' && c && c.open) c._emit('data', m.data);
    else if (m.k === 'close' && c && c.open) { c.open = false; c._emit('close'); }
  }
  reconnect() { }
  destroy() { if (this.destroyed) return; Object.values(this.conns).forEach((c) => c.close()); this.destroyed = true; try { this.bc.close(); } catch { /* ignore */ } }
}
class LocalConn {
  constructor(p, cid, remote) { this.p = p; this.cid = cid; this.peer = remote; this.open = false; this.h = {}; }
  on(ev, fn) { (this.h[ev] = this.h[ev] || []).push(fn); return this; }
  _emit(ev, ...a) { (this.h[ev] || []).forEach((f) => f(...a)); }
  send(data) { if (this.open && !this.p.destroyed) this.p.bc.postMessage({ k: 'data', cid: this.cid, to: this.peer, data: JSON.parse(JSON.stringify(data)) }); }
  close() { if (!this.open) return; this.open = false; try { this.p.bc.postMessage({ k: 'close', cid: this.cid, to: this.peer }); } catch { /* ignore */ } this._emit('close'); }
}

const Net = {
  // Free public STUN servers only (no TURN, nothing paid).
  ICE: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }],
  local: /[?&]local\b/.test(location.search),

  async lib() {
    if (Net.local) return LocalPeer;
    for (let i = 0; i < 100 && typeof window.Peer !== 'function'; i++) await new Promise((r) => setTimeout(r, 100));
    if (typeof window.Peer !== 'function') throw { type: 'lib-missing' };
    return window.Peer;
  },

  /** Resolves with an open Peer; rejects with a PeerJS-style {type} error. */
  async createPeer(id) {
    const P = await Net.lib();
    return new Promise((resolve, reject) => {
      let settled = false;
      const opts = { debug: 0, config: { iceServers: Net.ICE } };
      const peer = id ? new P(id, opts) : new P(opts);
      const to = setTimeout(() => { if (!settled) { settled = true; try { peer.destroy(); } catch { /* ignore */ } reject({ type: 'broker-timeout' }); } }, 15000);
      peer.on('open', () => { if (settled) return; settled = true; clearTimeout(to); resolve(peer); });
      peer.on('error', (e) => { if (settled) return; settled = true; clearTimeout(to); try { peer.destroy(); } catch { /* ignore */ } reject(e); });
    });
  },

  newHostId() {
    const a = 'abcdefghjkmnpqrstuvwxyz23456789';
    const part = () => Array.from({ length: 4 }, () => a[U.randInt(a.length)]).join('');
    return `nlhe-${part()}-${part()}`;
  },

  /** Turn raw PeerJS errors into something a human can act on. */
  friendly(e) {
    const t = (e && e.type) || '';
    const map = {
      'peer-unavailable': ['Game not found', 'Nobody is hosting at this link right now. The host may have closed their tab, or the link was copied incompletely.'],
      'unavailable-id': ['Table ID already in use', 'That table ID is taken on the matchmaking broker. Retry to get a fresh one.'],

      'server-error': ['Matchmaking broker is having trouble', 'The free PeerJS broker returned an error. It is usually back within a minute; retry shortly.'],
      'socket-error': ["Can't reach the matchmaking broker", 'The connection to the free PeerJS broker failed. Check your connection or try again shortly.'],
      'socket-closed': ['Lost the matchmaking broker', 'The connection to the PeerJS broker closed unexpectedly. Retry to reconnect.'],
      'broker-timeout': ['The broker is not answering', 'The free PeerJS broker did not respond in time. It may be busy or blocked on this network. Retry, or try another network.'],
      'browser-incompatible': ['Browser not supported', 'This browser does not support WebRTC data channels. Try a current Chrome, Firefox, Safari or Edge.'],
      'webrtc': ['Connection blocked', 'A direct peer-to-peer connection could not be made. Strict firewalls, some school/office networks and some VPNs block it. Try another network, such as a phone hotspot.'],
      'negotiation-failed': ['Connection blocked', 'A direct peer-to-peer connection could not be negotiated. Try another network, such as a phone hotspot.'],
      'connect-timeout': ['Connection blocked', 'The host was found but no direct connection could be opened in time. A firewall or VPN may be blocking peer-to-peer traffic. Try another network.'],
      'lib-missing': ['Could not load PeerJS', 'The free PeerJS library could not be downloaded from the CDN (unpkg / jsDelivr). Check your connection or content blocker and retry.'],

    const [title, message] = map[t] || ['Something went wrong', (e && e.message) || String(e)];
    return { title, message, type: t };

/* ---------- Host side: wires a HostTable to PeerJS connections ---------- */
class HostSession {
  constructor(settings, name) {
    this.role = 'host';
    this.settings = settings;
    this.name = name;
    this.conns = new Map();
    this.record = '';
    this.handlers = { view: () => {}, event: () => {}, error: () => {}, ended: () => {} };
  }
  on(ev, fn) { this.handlers[ev] = fn; return this; }

  async start() {
    let lastErr;
    for (let attempt = 0; attempt < 3; attempt++) {
      try { this.peer = await Net.createPeer(Net.newHostId()); break; }
      catch (e) { lastErr = e; if (e.type !== 'unavailable-id') throw e; }
    }
    if (!this.peer) throw lastErr;
    this.id = this.peer.id;
    const token = Prefs.get('hostToken.' + this.id) || U.randHex(16);
    const t = this.table = new HostTable(this.settings, this.name, token);
    this.pid = t.hostPid;
    t.onChange = () => this._scheduleBroadcast();
    t.onEvent = (kind, text, about) => {
      for (const [pid, c] of this.conns) if (pid !== about) this._send(c, { t: 'event', kind, text });
      if (about !== this.pid) this.handlers.event(kind, text);
    };
    t.onRecord = (pid, text) => {
      if (pid === this.pid) { this.record = text; Prefs.set('record.' + this.id, text); }
      else { const c = this.conns.get(pid); if (c) this._send(c, { t: 'record', text }); }
    };
    t.onDirect = (pid, m) => {
      if (pid === this.pid) { if (m.t === 'error') this.handlers.error(m.text); return; }
      const c = this.conns.get(pid);
      if (!c) return;
      this._send(c, m);
      if (m.t === 'kicked') { this.conns.delete(pid); setTimeout(() => { try { c.close(); } catch { /* ignore */ } }, 400); }
    };
    t.onBroadcast = (m) => { for (const c of this.conns.values()) this._send(c, m); };
    this.peer.on('connection', (c) => this._attach(c));
    this.peer.on('disconnected', () => { setTimeout(() => { try { if (!this.peer.destroyed) this.peer.reconnect(); } catch { /* ignore */ } }, 1500); });
    this.peer.on('error', (e) => { if (e.type !== 'peer-unavailable') this.handlers.error(Net.friendly(e).title); });
    this.beat = setInterval(() => this._heartbeat(), 4000);
    this.unload = () => this.leave(true);
    addEventListener('pagehide', this.unload);
    this._scheduleBroadcast();
    return this;
  }

  get inviteUrl() { return `${location.origin}${location.pathname.replace(/index\.html$/, '')}${Net.local ? '?local' : ''}#join=${this.id}`; }

  _attach(c) {
    c.lastSeen = Date.now();
    c.on('data', (m) => { c.lastSeen = Date.now(); this._data(c, m); });
    c.on('close', () => this._closed(c));
    c.on('error', () => this._closed(c));
  }

  _data(c, m) {
    if (!m || typeof m !== 'object' || Array.isArray(m)) return;
    // Flood protection: a token bucket per connection (bursts of 40, 15 messages/second sustained).
    const now = Date.now(), b = c.bucket || (c.bucket = { n: 40, t: now });
    b.n = Math.min(40, b.n + ((now - b.t) / 1000) * 15); b.t = now;
    if (b.n < 1) return;
    b.n -= 1;
    const t = this.table;
    if (m.t === 'hello') {
      const r = t.addPlayer(String(m.name || ''), typeof m.token === 'string' ? m.token.slice(0, 64) : null);
      if (r.error) { this._send(c, { t: 'reject', text: r.error }); setTimeout(() => { try { c.close(); } catch { /* ignore */ } }, 500); return; }
      const old = this.conns.get(r.pid);
      if (old && old !== c) { old.replaced = true; try { old.close(); } catch { /* ignore */ } }
      c.pid = r.pid;
      this.conns.set(r.pid, c);
      this._send(c, { t: 'welcome', pid: r.pid, token: r.player.token, name: r.player.name, hostId: this.id });
      this._send(c, { t: 'record', text: t.recordFor(r.pid) });
      if (r.reconnected) t.setConnected(r.pid, true);
      else t.onEvent('info', `${r.player.name} joined the table`, r.pid);
      t.changed();
      return;
    }
    if (m.t === 'ping') { this._send(c, { t: 'pong' }); return; }
    if (m.t === 'pong' || !c.pid || c.replaced) return;
    if (['start', 'pause', 'kick', 'adjust', 'end'].includes(m.t)) return; // host-only intents never come from the network
    t.handle(c.pid, m);
  }

  _closed(c) {
    if (c.replaced || !c.pid) return;
    if (this.conns.get(c.pid) === c) { this.conns.delete(c.pid); this.table.setConnected(c.pid, false); }
  }

  _heartbeat() {
    const now = Date.now();
    for (const [pid, c] of this.conns) {
      this._send(c, { t: 'ping' });
      if (now - c.lastSeen > 16000) { this.conns.delete(pid); try { c.close(); } catch { /* ignore */ } this.table.setConnected(pid, false); }
    }
    if (this.table.turn && this.table.turn.deadline) this._scheduleBroadcast(); // keeps countdowns in sync
  }

  _send(c, m) { try { if (c.open) c.send(m); } catch { /* connection already gone */ } }

  _scheduleBroadcast() {
    if (this.bq) return;
    this.bq = true;
    queueMicrotask(() => {
      this.bq = false;
      const t = this.table;
      for (const [pid, c] of this.conns) this._send(c, t.viewFor(pid));
      this.handlers.view(t.viewFor(this.pid));
      if (t.status === 'ended' && !this.endedSent) {
        this.endedSent = true;
        for (const c of this.conns.values()) this._send(c, { t: 'ended', reason: 'The host ended the game.' });
        this.handlers.ended('You ended the game.');
      }
    });
  }

  send(m) { this.table.handle(this.pid, m); }

  /** Host leaves: tell everyone (so they can still copy their records), then shut down. */
  leave(silent) {
    if (this.closed) return;
    this.closed = true;
    removeEventListener('pagehide', this.unload);
    clearInterval(this.beat);
    if (this.table && this.table.status !== 'ended') {
      this.table.status = 'ended';
      this.table._clearTurn(); clearTimeout(this.table.nextTimer); clearTimeout(this.table.dealTimer);
    }
    for (const c of this.conns.values()) this._send(c, { t: 'ended', reason: 'Host left, game ended.' });
    setTimeout(() => { try { this.peer.destroy(); } catch { /* ignore */ } }, silent ? 0 : 300);
  }
}

/* ---------- Client side ---------- */
class ClientSession {
  constructor(hostId, name, opts = {}) {
    this.role = 'client';
    this.fresh = !!opts.fresh;
    this.id = hostId;
    this.name = name;
    this.record = Prefs.get('record.' + hostId, '');
    this.handlers = { view: () => {}, event: () => {}, error: () => {}, ended: () => {}, status: () => {}, fair: () => {} };
    this.ended = false;
    this.fair = new Fair.Checker((f, msg) => this.handlers.fair(f, msg));
  }
  on(ev, fn) { this.handlers[ev] = fn; return this; }
  get inviteUrl() { return `${location.origin}${location.pathname.replace(/index\.html$/, '')}${Net.local ? '?local' : ''}#join=${this.id}`; }

  async connect() {
    if (!this.peer || this.peer.destroyed) this.peer = await Net.createPeer();
    this.peer.on('disconnected', () => { setTimeout(() => { try { if (!this.peer.destroyed) this.peer.reconnect(); } catch { /* ignore */ } }, 1000); });
    await this._open();
    this.dog = setInterval(() => {
      if (this.ended || !this.conn) return;
      if (Date.now() - this.lastMsg > 15000) { try { this.conn.close(); } catch { /* ignore */ } this._lost(); }
      else this.send({ t: 'ping' });
    }, 4000);
    return this;
  }

  _open() {
    return new Promise((resolve, reject) => {
      let done = false;
      const fin = (err) => { if (done) return; done = true; clearTimeout(to); this.peer.off && this.peer.off('error', onErr); err ? reject(err) : resolve(); };
      const onErr = (e) => { if (e && (e.type === 'peer-unavailable' || e.type === 'network' || e.type === 'webrtc' || e.type === 'server-error' || e.type === 'socket-error')) fin(e); };
      this.peer.on('error', onErr);
      const c = this.peer.connect(this.id, { reliable: true, serialization: 'json' });
      const to = setTimeout(() => { try { c.close(); } catch { /* ignore */ } fin({ type: 'connect-timeout' }); }, 15000);
      c.on('open', () => {
        this.lastMsg = Date.now();
        c.send({ t: 'hello', name: this.name, token: this.fresh ? null : Prefs.get('token.' + this.id, null) });
      });
      c.on('data', (m) => {
        this.lastMsg = Date.now();
        if (!m || typeof m !== 'object') return;
        if (m.t === 'welcome') {
          this.conn = c; this.pid = m.pid; this.name = m.name;
          this.fresh = false;
          Prefs.set('token.' + this.id, m.token); Prefs.set('tokenName.' + this.id, m.name);
          try { sessionStorage.setItem('feltroom.active', this.id); } catch { /* ignore */ }
          this.handlers.status('connected');
          fin();
          return;
        }
        if (m.t === 'reject') { this.ended = true; fin({ type: 'rejected', message: m.text }); return; }
        this._msg(m);
      });
      c.on('close', () => { if (this.conn === c) this._lost(); else fin({ type: 'connect-timeout' }); });
      c.on('error', () => { if (this.conn === c) this._lost(); });
    });
  }

  _msg(m) {
    switch (m.t) {
      case 'state':
        this.lastView = m;
        try { this.fair.view(m, this.name); } catch (e) { console.warn(e); }
        // The record for a hand can arrive just before the view that proves its last board card.
        if (this.pendingAudit) { const t = this.pendingAudit; this.pendingAudit = null; this._audit(t); }
        this.handlers.view(m);
        break;
      case 'event': this.handlers.event(m.kind, m.text); break;
      case 'record': this.record = m.text; Prefs.set('record.' + this.id, m.text); this.pendingAudit = m.text; break;
      // Shuffle proofs: answer with our own committed randomness, then verify every card we see.
      case 'fair1': { const r = this.fair.fair1(m); if (r) this.send(r); break; }
      case 'fair2': { const r = this.fair.fair2(m); if (r) this.send(r); break; }
      case 'fair3': this.fair.fair3(m); break;
      case 'fairown': this.fair.own(m, this.name); break;
      case 'error': this.handlers.error(m.text); break;
      case 'ping': this.send({ t: 'pong' }); break;
      case 'kicked': this._end('You were removed from the table by the host.'); break;
      case 'ended': this._end(m.reason || 'Host left, game ended.'); break;
    }
  }

  /** Re-simulate the newest hand of the host's record and check it against what we saw ourselves. */
  _audit(text) {
    try {
      const g = Notation.parse(text);
      const r = g.hands[g.hands.length - 1];
      if (!r || this.audited === r.no) return;
      this.audited = r.no;
      const rp = Replay.game({ tags: g.tags, hands: [r] });
      const issues = rp.issues.slice();
      const f = this.fair.hands[r.no];
      if (f && f.own && r.hole[this.name] && r.hole[this.name].join() !== f.own.join()) issues.push('the record shows different hole cards from the ones you were dealt');
      if (f && f.layout) r.streets.slice(1).flatMap((st) => st.board).forEach((c, i) => {
        if (!f.checked.has(f.layout.board[i] + ':' + c)) issues.push(`board card ${Cards.pretty(c)} in the record was never proven`);
      });
      this.fair.audit(r.no, issues);
    } catch (e) { this.fair.audit(-1, [`the host sent a record that does not parse (${e.message})`]); }
  }

  async _lost() {
    if (this.ended || this.reconnecting) return;
    this.reconnecting = true;
    this.conn = null;
    this.handlers.status('reconnecting');
    for (let i = 0; i < 6 && !this.ended; i++) {
      await new Promise((r) => setTimeout(r, 2500));
      try { await this._open(); this.reconnecting = false; return; } catch (e) { if (e && e.type === 'rejected') break; }
    }
    this.reconnecting = false;
    this._end('Host left, game ended.');
  }

  _end(reason) {
    if (this.ended) return;
    this.ended = true;
    clearInterval(this.dog);
    this.handlers.ended(reason);
    setTimeout(() => { try { this.peer.destroy(); } catch { /* ignore */ } }, 500);
  }

  send(m) { try { if (this.conn && this.conn.open) this.conn.send(m); } catch { /* ignore */ } }
  leave() {
    try { sessionStorage.removeItem('feltroom.active'); } catch { /* ignore */ }
    this.ended = true; clearInterval(this.dog); try { this.conn && this.conn.close(); this.peer.destroy(); } catch { /* ignore */ } }
}

/* ---------- Web Audio sound effects (generated, no files) ---------- */
const Sound = {
  ctx: null,
  get muted() { return Prefs.get('muted', false); },
  toggle() { Prefs.set('muted', !this.muted); if (!this.muted) this.play('chip'); },
  unlock() { this._ctx(); },
  _ctx() {
    if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; this.ctx = new C(); }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return this.ctx;
  },
  _tone(c, { f = 440, f2, type = 'sine', t = 0, dur = 0.15, vol = 0.1 }) {
    const o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + t;
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  },
  _noise(c, { t = 0, dur = 0.06, vol = 0.12, freq = 3000, q = 1, type = 'bandpass' }) {
    const len = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t0 = c.currentTime + t;
    s.buffer = b; f.type = type; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
    s.connect(f).connect(g).connect(c.destination); s.start(t0);
  },
  play(name, delay = 0) {
    if (this.muted) return;
    const c = this._ctx();
    if (!c || c.state !== 'running') return;
    const t = delay;
    switch (name) {
      case 'deal': this._noise(c, { t, dur: 0.07, vol: 0.22, freq: 2600, q: 0.8 }); break;
      case 'chip': this._tone(c, { f: 2300, type: 'triangle', t, dur: 0.05, vol: 0.06 }); this._tone(c, { f: 3100, type: 'triangle', t: t + 0.045, dur: 0.05, vol: 0.05 }); break;
      case 'knock': this._tone(c, { f: 150, f2: 80, t, dur: 0.12, vol: 0.4 }); this._noise(c, { t, dur: 0.04, vol: 0.12, freq: 900, type: 'lowpass' }); break;
      case 'chime': this._tone(c, { f: 660, t, dur: 0.28, vol: 0.09 }); this._tone(c, { f: 990, t: t + 0.14, dur: 0.38, vol: 0.08 }); break;
      case 'win': [523, 659, 784].forEach((f, i) => this._tone(c, { f, type: 'triangle', t: t + i * 0.09, dur: 0.3, vol: 0.07 })); break;
      case 'fold': this._noise(c, { t, dur: 0.09, vol: 0.06, freq: 1200, q: 0.5 }); break;
    }
  },
};

}

const TitleFlash = {
  base: document.title, timer: null,
  start(msg) {
    if (!document.hidden || this.timer) return;
    let k = 0;
    this.timer = setInterval(() => { document.title = k++ % 2 ? this.base : msg; }, 900);
  },
  stop() { clearInterval(this.timer); this.timer = null; document.title = this.base; },
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) TitleFlash.stop(); });

async function copyText(text, label = 'Copied to clipboard') {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch { /* ignore */ }
    ta.remove();
  }
  toast(label, 'success', 2200);
}
function downloadText(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- Modal ---------- */
function openModal(html, { onClose, label = 'Dialog', dismissable = true } = {}) {
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${U.esc(label)}">${html}</div>`;
  document.body.appendChild(back);
  const prevFocus = document.activeElement;
  const close = () => { back.remove(); removeEventListener('keydown', onKey, true); if (prevFocus && prevFocus.focus) prevFocus.focus(); onClose && onClose(); };
  const onKey = (e) => {
    if (e.key === 'Escape' && dismissable) { e.stopPropagation(); close(); }
    if (e.key === 'Tab') { // keep focus inside
      const f = $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', back).filter((x) => !x.disabled);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  };
  addEventListener('keydown', onKey, true);
  if (dismissable) back.addEventListener('mousedown', (e) => { if (e.target === back) close(); });
  back.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) close(); });
  setTimeout(() => { const f = $('[autofocus], .modal-foot .btn.primary, .modal-foot .btn', back); if (f) f.focus(); }, 30);
  return { el: back, close };
}

function helpOverlay(mode) {
  const rows = mode === 'viewer'
    ? [['← / →', 'Step back / forward one action'], ['Shift + ← / →', 'Previous / next street'], ['↑ / ↓', 'Previous / next hand'], ['Space', 'Autoplay on / off'], ['Home / End', 'Start / end of hand'], ['?', 'This help']]
    : [['F', 'Fold'], ['C', 'Check or call'], ['R', 'Raise / bet (focuses the amount)'], ['↑ / →', 'Increase bet by one big blind'], ['↓ / ←', 'Decrease bet by one big blind'], ['Enter', 'Confirm the bet'], ['M', 'Mute / unmute'], ['?', 'This help'], ['Esc', 'Close dialogs']];
  openModal(`<h2>Keyboard shortcuts</h2><div class="kbd-grid">${rows.map(([k, d]) => `<div>${k.split(' / ').map((x) => `<kbd>${x}</kbd>`).join(' / ')}</div><div>${d}</div>`).join('')}</div>
    <p class="hint" style="margin-top:14px">Four-color deck: ♠ black · <span style="color:var(--suit-h)">♥ red</span> · <span style="color:var(--suit-d)">♦ blue</span> · <span style="color:var(--suit-c)">♣ green</span>. Toggle it from the ⋯ menu.</p>
    <div class="modal-foot"><button class="btn primary" data-close>Got it</button></div>`, { label: 'Keyboard shortcuts' });
}

/* ---------- Cards, chips, avatars ---------- */
const SUIT_NAME = { s: 'spades', h: 'hearts', d: 'diamonds', c: 'clubs' };
function cardHtml(c, cls = '', style = '') {
  if (!c) return `<div class="card back ${cls}" style="${style}" role="img" aria-label="Face-down card"></div>`;
  const r = c[0] === 'T' ? '10' : c[0], s = c[1];
  return `<div class="card s-${s} ${cls}" style="${style}" data-card="${c}" role="img" aria-label="${RANK_WORD[Cards.rank(c)]} of ${SUIT_NAME[s]}"><span class="cr">${r}</span><span class="cs">${SUIT_SYM[s]}</span><span class="cb">${SUIT_SYM[s]}</span></div>`;
}
const DENOMS = [5000, 1000, 500, 100, 25, 5, 1];
function chipsHtml(amount, max = 6) {
  const out = [];
  let a = amount;
  for (const d of DENOMS) while (a >= d && out.length < max) { out.push(d); a -= d; }
  return `<div class="chips" aria-hidden="true">${out.map((d) => `<div class="chip d${d}"></div>`).join('')}</div>`;
}
function hueOf(name) { let h = 0; for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return (h * 47) % 360; }
function initials(name) {
  const w = String(name).trim().split(/\s+/);
  return (w.length > 1 ? w[0][0] + w[1][0] : String(name).slice(0, 2)).toUpperCase();
}
function avatarHtml(name, extra = '', style = '') {
  return `<div class="avatar" style="--h:${hueOf(name)};${style}" aria-hidden="true">${U.esc(initials(name))}${extra}</div>`;
}
const ACTION_WORD = { f: 'Fold', x: 'Check', c: 'Call', b: 'Bet', r: 'Raise' };

/* ---------- Table renderer (shared by the live game and the replay viewer) ----------
   view = { maxSeats, mySeat, handKey, seats:[seat|null], board, pots:[{label,amount}], street,
            results:{winCards, lines}|null, timer:{remaining,total,paused}|null, canSit, readOnly, feltText } */
class TableView {
  constructor(stage, opts = {}) {
    this.stage = stage; this.opts = opts;
    this.el = document.createElement('div');
    this.el.className = 'table';
    this.el.innerHTML = '<div class="layer"></div><div class="fx"></div>';
    this.layer = this.el.firstChild; this.fx = this.el.lastChild;
    stage.appendChild(this.el);
    this.view = null;
    this.ro = new ResizeObserver(() => this.layout());
    this.ro.observe(stage);
    this.el.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-seat]');
      if (b && opts.onSit) opts.onSit(Number(b.dataset.seat));
    });
    this.tick = this.tick.bind(this);
  }
  destroy() { this.ro.disconnect(); cancelAnimationFrame(this.raf); }

  layout() {
    const W = this.stage.clientWidth - 12, H = this.stage.clientHeight - 12;
    if (W < 50 || H < 50) return;
    const portrait = W / H < 0.95;
    const cl = (v, a, b) => Math.max(a, Math.min(b, v));
    let s, tw, th;
    if (!portrait) {
      s = 1;
      for (let i = 0; i < 4; i++) { tw = Math.min(W - 170 * s, (H - 200 * s) * 2.05); s = cl(tw / 640, 0.55, 1.2); }
      th = tw / 2.05;
    } else {
      s = 1;
      for (let i = 0; i < 4; i++) { tw = Math.min(W - 130 * s, (H - 230 * s) * 0.64); s = cl(Math.min(W / 430, tw / 330), 0.55, 1); }
      th = tw / 0.64;
    }
    tw = Math.max(tw, 160); th = Math.max(th, 120);
    const key = `${Math.round(tw)}x${Math.round(th)}x${s.toFixed(3)}`;
    if (key === this.lkey) return;
    this.lkey = key; this.portrait = portrait;
    this.el.style.width = tw + 'px'; this.el.style.height = th + 'px';
    this.el.style.setProperty('--s', s.toFixed(3));
    this.w = tw; this.h = th;
    if (this.view) this.render(this.view, { animate: false });
  }

  pos(seat, f = 1, da = 0) {
    const v = this.view, n = v.maxSeats, k = (seat - (v.mySeat || 0) + n) % n;
    const a = Math.PI / 2 + (k * 2 * Math.PI) / n + da;
    return [50 + 50 * f * Math.cos(a), 50 + 50 * f * Math.sin(a)];
  }

  /** Bets sit between a seat and the pot; the local seat's big cards need a little more room. */
  betF(seat) {
    const v = this.view, k = (seat - (v.mySeat || 0) + v.maxSeats) % v.maxSeats;
    if (k === 0) return this.portrait ? 0.5 : 0.4;
    return this.portrait ? 0.56 : 0.6;
  }

  render(view, o = {}) {
    const prev = this.view;
    this.view = view;
    if (!this.w) this.layout();
    const same = prev && prev.handKey === view.handKey;
    const animate = o.animate !== false && !document.hidden;
    const newHand = animate && view.handKey && (!prev || prev.handKey !== view.handKey);
    const winSet = new Set(view.results ? view.results.winCards : []);
    const hl = (c) => (winSet.size && c ? (winSet.has(c) ? 'win' : 'dim') : '');
    const parts = [];
    if (view.feltText) parts.push(`<div class="felt-mark">${U.esc(view.feltText)}</div>`);

    // Center: street, pots, board, result line
    const prevBoard = same && prev ? prev.board.length : 0;
    let board = '';
    for (let i = 0; i < 5; i++) {
      const c = view.board[i];
      if (c) {
        const fresh = animate && i >= prevBoard;
        board += cardHtml(c, `${fresh ? 'flip' : ''} ${hl(c)}`, fresh ? `animation-delay:${(i - prevBoard) * 110}ms` : '');
      } else board += '<div class="slot"></div>';
    }
    const pots = (view.pots || []).filter((p) => p.amount > 0).map((p) =>
      `<div class="pot">${chipsHtml(p.amount, 3)}<span class="pot-label">${U.esc(p.label)}</span><span class="pot-amt">${U.fmt(p.amount)}</span></div>`).join('');
    const resLine = view.results && view.results.lines.length
      ? `<div class="pot" style="padding:4px 12px;max-width:min(90vw,${Math.round(this.w * 0.7)}px);white-space:normal;text-align:center">${U.esc(view.results.lines.join(' · '))}</div>` : '';
    parts.push(`<div class="center"><div class="street-label">${U.esc(view.street || '')}</div><div class="pots">${resLine || pots}</div><div class="board" aria-label="Board">${board}</div></div>`);

    // Seats, bets, markers
    const n = view.maxSeats;
    view.seats.forEach((st, seat) => {
      const [x, y] = this.pos(seat);
      if (!st) {
        if (view.readOnly) return;
        parts.push(view.canSit
          ? `<button class="seat-empty" data-seat="${seat}" style="left:${x}%;top:${y}%" aria-label="Sit in seat ${seat + 1}">Sit</button>`
          : `<div class="seat-empty" style="left:${x}%;top:${y}%;opacity:.45" aria-hidden="true"></div>`);
        return;
      }
      const ps = same && prev.seats[seat];
      const isMe = seat === (view.mySeat || 0) && (st.isYou || view.readOnly);
      const cls = ['seat', isMe ? 'me' : '', st.toAct ? 'active' : '', st.folded ? 'folded' : '', (st.sittingOut || st.busted) ? 'out' : '', st.won ? 'winner' : ''].join(' ');
      let hole = '';
      if (st.cards) {
        const dx = (50 - x) * this.w / 100, dy = (50 - y) * this.h / 100;
        hole = st.cards.map((c, j) => {
          const dealt = newHand && !(prev && prev.seats[seat] && prev.seats[seat].cards && prev.handKey === view.handKey);
          const flipNow = animate && same && ps && ps.cards && !ps.cards[j] && c;
          const k = (seat - (view.mySeat || 0) + n) % n;
          const style = dealt ? `--dx:${dx}px;--dy:${dy}px;animation-delay:${(j * n + k) * 45}ms` : '';
          const c2 = (st.folded && c) ? 'ghost' : hl(st.shown || st.isYou || view.readOnly ? c : null);
          return cardHtml(c, `${dealt ? 'deal' : ''} ${flipNow ? 'flip' : ''} ${c2}`, style);
        }).join('');
      }
      const tags = [];
      if (st.won) tags.push(`<span class="tag win">+${U.fmt(st.won)}</span>`);
      if (st.folded) tags.push(`<span class="tag">${st.mucked ? 'Mucked' : 'Folded'}</span>`);
      if (st.allIn) tags.push('<span class="tag allin">All-in</span>');
      if (st.busted) tags.push('<span class="tag off">Busted</span>');
      else if (st.sittingOut) tags.push('<span class="tag off">Sitting out</span>');
      if (st.disconnected) tags.push('<span class="tag off">Disconnected</span>');
      if (!view.results && !st.folded && !st.won && st.lastAction && ACTION_WORD[st.lastAction] && !st.allIn) tags.push(`<span class="tag last">${ACTION_WORD[st.lastAction]}</span>`);
      let ring = '';
      if (st.toAct && view.timer && view.timer.total) ring = '<svg class="ring" viewBox="0 0 50 50"><circle cx="25" cy="25" r="23" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" data-ring></circle></svg>';
      const label = `${st.name}${st.isYou ? ' (you)' : ''}, ${st.allIn ? 'all-in' : U.fmt(st.stack) + ' chips'}${st.folded ? ', folded' : ''}${st.toAct ? ', to act' : ''}`;
      parts.push(`<div class="${cls}" style="left:${x}%;top:${y}%" role="group" aria-label="${U.esc(label)}">
        <div class="hole${st.cards && st.cards.length > 2 ? ' many' : ''}">${hole}</div>
        <div class="plate">${avatarHtml(st.name, ring)}<div class="p-info"><div class="nm">${U.esc(st.name)}${st.isHost ? ' <span title="Host" aria-label="host">★</span>' : ''}</div><div class="stack">${st.allIn && !st.stack ? 'All-in' : U.fmt(st.stack)}</div></div></div>
        ${st.handName ? `<div class="hand-name">${U.esc(st.handName)}</div>` : ''}
        <div class="tags">${tags.join('')}</div></div>`);
      if (st.bet > 0) {
        const [bx, by] = this.pos(seat, this.betF(seat));
        const pop = animate && same && (!ps || ps.bet < st.bet);
        parts.push(`<div class="bet ${pop ? 'pop' : ''}" style="left:${bx}%;top:${by}%">${chipsHtml(st.bet)}<span class="bet-amt">${U.fmt(st.bet)}</span></div>`);
      }
      if (st.button) { const [mx, my] = this.pos(seat, 0.78, 0.32); parts.push(`<div class="marker dealer" style="left:${mx}%;top:${my}%" title="Dealer button" aria-label="Dealer button">D</div>`); }
      if (st.sb || st.bb) { const [mx, my] = this.pos(seat, 0.78, -0.32); parts.push(`<div class="marker ${st.sb ? 'sb' : 'bb'}" style="left:${mx}%;top:${my}%" title="${st.sb ? 'Small blind' : 'Big blind'}">${st.sb ? 'SB' : 'BB'}</div>`); }
    });
    this.layer.innerHTML = parts.join('');

    // Timer ring
    if (view.timer && view.timer.total) {
      const end = performance.now() + (view.timer.remaining || 0);
      if (!this.timer || Math.abs(this.timer.end - end) > 400 || this.timer.paused !== view.timer.paused) this.timer = { end, total: view.timer.total, paused: view.timer.paused, rem: view.timer.remaining };
      cancelAnimationFrame(this.raf); this.tick();
    } else { this.timer = null; cancelAnimationFrame(this.raf); }

    if (!animate || !prev) return;
    // Sounds + chip motion
    const snd = this.opts.sound !== false;
    if (newHand && snd) { Sound.play('deal'); Sound.play('deal', 0.12); }
    if (same && view.board.length > prev.board.length && snd) Sound.play('deal');
    if (same) {
      view.seats.forEach((st, seat) => {
        const ps = prev.seats[seat];
        if (!st || !ps) return;
        if (snd && st.bet > ps.bet) Sound.play('chip');
        if (snd && st.lastAction === 'x' && ps.lastAction !== 'x') Sound.play('knock');
        if (snd && st.folded && !ps.folded) Sound.play('fold');
      });
      const streetEnded = view.board.length > prev.board.length || (view.results && !prev.results);
      if (streetEnded) {
        const potXY = [50, 41];
        prev.seats.forEach((ps, seat) => { if (ps && ps.bet > 0) this.fly(this.pos(seat, this.betF(seat)), potXY, ps.bet); });
      }
      if (view.results && !prev.results) {
        setTimeout(() => {
          let mine = false;
          view.seats.forEach((st, seat) => {
            if (!st || !st.won) return;
            if (st.isYou) mine = true;
            this.fly([50, 41], this.pos(seat, 0.85), st.won);
            const [x, y] = this.pos(seat);
            const f = document.createElement('div');
            f.className = 'win-amt'; f.style.left = x + '%'; f.style.top = y + '%'; f.textContent = '+' + U.fmt(st.won);
            this.fx.appendChild(f); setTimeout(() => f.remove(), 1700);
          });
          if (snd) Sound.play(mine ? 'win' : 'chip');
        }, 420);
      }
    }
  }

  fly(from, to, amount) {
    if (reducedMotion()) return;
    const el = document.createElement('div');
    el.className = 'fly';
    el.innerHTML = chipsHtml(amount, 4);
    el.style.left = `calc(${from[0]}% - 9px)`; el.style.top = `calc(${from[1]}% - 9px)`;
    this.fx.appendChild(el);
    const dx = ((to[0] - from[0]) * this.w) / 100, dy = ((to[1] - from[1]) * this.h) / 100;
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transform = `translate(${dx}px, ${dy}px)`; el.style.opacity = '0.15'; }));
    setTimeout(() => el.remove(), 480);
  }

  tick() {
    const t = this.timer, c = this.layer.querySelector('[data-ring]');
    if (!t || !c) return;
    const rem = t.paused ? t.rem : Math.max(0, t.end - performance.now());
    const frac = Math.max(0, Math.min(1, rem / t.total));
    c.setAttribute('stroke-dashoffset', String(100 * (1 - frac)));
    c.style.stroke = frac > 0.5 ? 'var(--accent)' : frac > 0.25 ? 'var(--warn)' : 'var(--danger)';
    if (!t.paused && rem > 0) this.raf = requestAnimationFrame(this.tick);
  }
}

/* =====================================================================
   9. SELF TESTS  (pure; rendered by the #/selftest route)
   ===================================================================== */
const SelfTest = (() => {
  const T = [];
  const test = (group, name, fn) => T.push({ group, name, fn });
  const eq = (a, b, msg) => {
    const ja = JSON.stringify(a), jb = JSON.stringify(b);
    if (ja !== jb) throw new Error(`${msg ? msg + ': ' : ''}expected ${jb}, got ${ja}`);
  };
  const ok = (v, msg) => { if (!v) throw new Error(msg || 'assertion failed'); };
  const throws = (fn, re, msg) => {
    try { fn(); } catch (e) { if (re && !re.test(e.message)) throw new Error(`${msg || 'wrong error'}: ${e.message}`); return; }
    throw new Error(msg || 'expected an error');
  };
  const ev = (s) => Eval.evaluate(s.split(' '));
  const cmp = (a, b) => Math.sign(ev(a).score - ev(b).score);
  const desc = (s) => Eval.describe(ev(s));

  /** Plays a whole hand to completion. script: list of actions or a function choosing actions. */
  function play(o) {
    const deck = o.deck ? o.deck.slice() : Cards.shuffle(Cards.newDeck());
    const n = o.stacks.length;
    const hc = o.holeCount || (o.game === 'omaha' ? 4 : 2);
    const hole = o.hole || Array.from({ length: n }, () => Array.from({ length: hc }, () => deck.pop()));
    for (const hc of hole) for (const c of hc || []) { const k = deck.indexOf(c); if (k >= 0) deck.splice(k, 1); }
    const board = o.board ? o.board.slice() : null;
    if (board) for (const c of board) { const k = deck.indexOf(c); if (k >= 0) deck.splice(k, 1); }
    const h = Engine.createHand({
      no: o.no || 1, players: o.stacks.map((s, i) => ({ name: (o.names || 'ABCDEFGHI')[i], stack: s })),
      button: o.button || 0, sb: o.sb || 1, bb: o.bb || 2, ante: o.ante || 0, hole,
      game: o.game, limit: o.limit, holeCount: hc,
    });
    let k = 0;
    for (let guard = 0; guard < 500 && h.phase !== 'done'; guard++) {
      if (h.phase === 'betting') {
        const a = typeof o.actions === 'function' ? o.actions(h, Engine.legal(h)) : o.actions[k++];
        if (!a) return h;
        Engine.applyAction(h, a);
      } else if (h.phase === 'deal') {
        const cs = [];
        for (let i = 0; i < h.pendingDeal; i++) cs.push(board && board.length ? board.shift() : deck.pop());
        Engine.dealBoard(h, cs);
      } else if (h.phase === 'showdown') Engine.settle(h, Engine.planShowdown(h, () => o.autoMuck !== false));
      else if (h.phase === 'settle') Engine.settle(h);
    }
    return h;
  }
  const randomAction = (h, L) => {
    const r = U.randInt(100);
    if (L.canRaise && r < 22) {
      const span = L.maxTo - L.minTo;
      const to = r < 4 ? L.maxTo : L.minTo + (span > 0 ? U.randInt(Math.min(span, 40) + 1) : 0);
      return { type: L.isBet ? 'bet' : 'raise', to };
    }
    if (L.canCheck) return { type: 'check' };
    if (r < 70) return { type: 'call' };
    return { type: 'fold' };
  };
  const wins = (h) => { const o = {}; h.log.filter((e) => e.t === 'win').forEach((e) => { const n = h.players[e.p].name; o[n] = (o[n] || 0) + e.amt; }); return o; };

  /* ---------- Evaluator ---------- */
  test('Evaluator', 'Recognises every category', () => {
    eq(desc('Ah Kh Qh Jh Th 2c 3d'), 'Royal Flush');
    eq(desc('9s 8s 7s 6s 5s Ad Ac'), 'Straight Flush, Nine high');
    eq(desc('Ks Kh Kd Kc 2s 3d 4h'), 'Four of a Kind, Kings');
    eq(desc('Ks Kh Kd 7c 7s 2d 3h'), 'Full House, Kings over Sevens');
    eq(desc('Ah 9h 7h 4h 2h Kc Kd'), 'Flush, Ace high');
    eq(desc('Ts 9h 8d 7c 6s 2d 2h'), 'Straight, Ten high');
    eq(desc('Qs Qh Qd 9c 4s 2d 3h'), 'Three of a Kind, Queens');
    eq(desc('Js Jh 4d 4c As 2d 8h'), 'Two Pair, Jacks and Fours');
    eq(desc('Js Jh 4d 6c As 2d 8h'), 'Pair of Jacks');
    eq(desc('As Qh 4d 6c 9s 2d 8h'), 'High Card, Ace');
    eq(desc('6s 6h 6d 2c 2s'), 'Full House, Sixes over Twos');
  });
  test('Evaluator', 'Wheel straight (A-2-3-4-5) is Five high and loses to 6-high', () => {
    eq(desc('Ah 2c 3d 4s 5h Kd Qc'), 'Straight, Five high');
    eq(cmp('Ah 2c 3d 4s 5h', '2c 3d 4s 5h 6d'), -1);
    eq(cmp('Ah 2c 3d 4s 5h', 'Kh Kc Kd 2s 3s'), 1, 'wheel beats trips');
    eq(desc('Ah 2h 3h 4h 5h 9c 9d'), 'Straight Flush, Five high');
    eq(cmp('Ah Kc Qd Js Th', 'Ah 2c 3d 4s 5h'), 1, 'broadway beats wheel');
    eq(desc('Ah Kc Qd 2s 3h 4c 9d'), 'High Card, Ace', 'no wrap-around straight');
  });
  test('Evaluator', 'Kicker ties and exact ties', () => {
    eq(cmp('Ah Kd 9c 7s 4h 3d 2c', 'Ah Qd 9c 7s 4h 3d 2c'), 1, 'king kicker wins');
    eq(cmp('As Ks Qh Jd 9c 3h 2c', 'Ad Kh Qs Jc 9h 4d 2s'), 0, 'same five cards tie');

  test('Fairness', 'Seed-driven permutation is deterministic and unbiased-looking', () => {
    const p = Fair.permutation('00'.repeat(32));
    eq(p.slice().sort((a, b) => a - b), Array.from({ length: 52 }, (_, i) => i), 'is a permutation');
    eq(Fair.permutation('00'.repeat(32)), p, 'deterministic');
    ok(Fair.permutation('01'.repeat(32)).join() !== p.join(), 'seed changes the order');
    const counts = new Array(52).fill(0);
    for (let k = 0; k < 2000; k++) counts[Fair.permutation(Fair.sha256('s' + k))[0]]++;
    ok(Math.max(...counts) < 80 && Math.min(...counts) > 15, 'first card roughly uniform');
  });
  /** A full simulated deal between an honest (or dishonest) dealer and a checking player. */
  function fairRound(tamper) {
    const deck = Cards.shuffle(Cards.newDeck()), salts = deck.map(() => U.randHex(16));
    const commits = deck.map((c, i) => Fair.commit(c, salts[i]));
    const ck = new Fair.Checker();
    const reply1 = ck.fair1({ no: 7, commits });
    const hostSeed = U.randHex(32);
    const seedCommits = [reply1.c, Fair.sha256(hostSeed)];
    const reply2 = ck.fair2({ no: 7, seedCommits });
    const seeds = tamper === 'dropseed' ? [hostSeed] : [reply2.seed, hostSeed];
    ck.fair3({ no: 7, seeds, order: ['Me', 'Host'], holeCount: 2 });
    const perm = Fair.permutation(Fair.combine(7, commits, seeds));
    const L = Fair.layout(2, 2);
    const at = (pos) => ({ pos, card: deck[perm[pos]], salt: salts[perm[pos]] });
    const mine = [at(L.hole(0, 0)), at(L.hole(0, 1))];
    if (tamper === 'swap') mine[1] = { ...at(L.hole(1, 1)), pos: L.hole(0, 1) };
    ck.own({ no: 7, cards: mine }, 'Me');
    const board = L.board.slice(0, 3).map(at);
    if (tamper === 'board') board[2] = at(L.board[3]);
    ck.view({ fair: { no: 7, reveals: board }, phase: 'betting', board: board.map((r) => r.card).concat(tamper === 'board' ? [] : []), seats: [{ name: 'Me', cards: mine.map((r) => r.card) }, { name: 'Host', cards: [null, null] }] }, 'Me');
    return ck.hands[7];
  }
  test('Fairness', 'An honest deal verifies; tampering is caught', () => {
    const okRound = fairRound();
    eq(okRound.problems, []); eq(okRound.status, 'verified'); eq(okRound.verified, 5);
    ok(fairRound('swap').status === 'failed', 'swapped hole card detected');
    ok(fairRound('board').status === 'failed', 'board card from the wrong position detected');
    ok(fairRound('dropseed').problems.some((p) => /left your shuffle seed out/.test(p)), 'excluded seed detected');
  });

  /* ---------- QR ---------- */
  const QR_KNOWN_HELLO = 1773893352; // module-grid hash verified against an independent encoder (mask 2)
  test('QR', 'Encodes a URL into a valid-size symbol', () => {
    if (typeof QR === 'undefined') return;
    const q = QR.encode('https://example.netlify.app/#join=nlhe-abcd-1234');
    eq(q.size, 17 + 4 * q.version);
    ok(q.version >= 3 && q.version <= 5, 'sensible version');
    // Finder pattern corners are dark.
    ok(q.get(0, 0) && q.get(q.size - 1, 0) && q.get(0, q.size - 1), 'finder corners');
    eq(QR.checksum('HELLO'), QR_KNOWN_HELLO, 'matches reference encoder');
  });

  async function run() {
    const out = [];
    for (const t of T) {
      const t0 = Date.now();
      try { await t.fn(); out.push({ ...t, pass: true, ms: Date.now() - t0 }); }
      catch (e) { out.push({ ...t, pass: false, error: e.message, ms: Date.now() - t0 }); }
    }
    return out;
  }
  return { run, play, randomAction, tests: T };
})();

function JoinScreen(hostId) {
  document.title = TitleFlash.base = "Join a game · Feltroom";

  const token = Prefs.get('token.' + hostId, null), saved = Prefs.get('name', '');
  // A refresh in the same tab reconnects straight away; a new tab offers "Rejoin" (or a fresh seat,
  // so two tabs in one browser can be two different players).
  let sameTab = false;
  try { sameTab = sessionStorage.getItem('feltroom.active') === hostId; } catch { /* ignore */ }
  const rejoinName = token ? Prefs.get('tokenName.' + hostId, saved) : '';
  const form = () => {
    App.root.innerHTML = `<div class="page"><div class="page-inner">

      </form></div></div>`;

    if (rejoinName) $('#j-rejoin').addEventListener('click', () => connect(rejoinName, false));

      Prefs.set('name', name);
      connect(name, !!rejoinName);
    });
  };
  const connect = async (name, fresh) => {
    App.root.innerHTML = `<div class="page"><div class="center-card card-ui" style="margin:auto"><div class="spinner" aria-hidden="true"></div><h2>Connecting to the host…</h2><p class="muted">Finding the game through the free PeerJS broker, then connecting directly.</p></div></div>`;
    const sess = new ClientSession(hostId, name, { fresh });
    try {
      await sess.connect();
      App.session = sess;
      App.screen = GameScreen(sess);
    } catch (e) {
      try { sess.leave(); } catch { /* ignore */ }
      if (e && e.type === 'rejected') Prefs.del('token.' + hostId);
      const fr = Net.friendly(e);
      const rec = Prefs.get('record.' + hostId, '');
      showError(fr, () => connect(name, fresh), '#/');
      if (rec) {
        const b = document.createElement('button');

        b.addEventListener('click', () => copyText(rec, 'Game record copied'));

  };
  if (token && sameTab) connect(rejoinName || saved, false); else form();
  return {};
}

  /* ----- fair play ----- */
  function fairState() {
    if (isHost) return { cls: 'host', label: 'You deal', icon: 'shieldOk' };
    const ck = session.fair, f = ck && ck.latest;
    const failed = ck && Object.values(ck.hands).find((x) => x.status === 'failed');
    if (failed) return { cls: 'bad', label: 'Check failed', icon: 'shieldBad', f: failed };
    if (f && f.status === 'verified') return { cls: 'ok', label: 'Verified', icon: 'shieldOk', f };
    return { cls: '', label: 'Fair play', icon: 'shield', f };
  }
  function renderFairBadge() {
    const st = fairState(), b = $('#g-fair');
