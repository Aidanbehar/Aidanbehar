  /* ----- rematch (online) and play again (bots) ----- */
  const myName = () => (G.view && G.view.you && G.view.you.name) || session.name;
  function canRematch() { return !isWatcher && !session.offline && (!!session.rematch || Rematch.allowedView(G.view)); }
  function rematchLabel() { const r = session.rematch; return r ? `Join ${r.from}'s rematch` : G.rematching ? 'Setting up the rematch…' : 'Rematch'; }
  function rematchBtn() {
    if (session.offline) return `<button class="btn primary" data-do="again">${icon('history')}Play again</button>`;
    return canRematch() ? `<button class="btn primary" data-do="rematch" ${G.rematching ? 'disabled' : ''}>${icon('users')}${U.esc(rematchLabel())}</button>` : '';
  }
  /** The host of a game still being played ends it for everyone by leaving, so ask first. */
  function hostStillPlaying() { const v = G.view; return isHost && v && v.status === 'playing' && !v.waiting; }
  function startRematch() {
    if (session.rematch) return joinRematch();
    if (G.rematching) return;
    if (isHost && session.rematchAsk && Date.now() - session.rematchAsk.at < 20000) return toast('Another player is setting up a rematch. Their invitation is on its way.', 'info');
    if (hostStillPlaying()) return confirmModal('Start a rematch?', 'You are the host, so this game ends for everyone. They all get an invitation to the rematch.', 'Start rematch', openRematch, false);
    openRematch();
  }
  async function openRematch() {
    G.rematching = true; G.barKey = null; if (G.view) renderBar();
    const done = () => { G.rematching = false; G.barKey = null; if (G.view) renderBar(); };
    try {
      const settings = isHost ? { ...session.settings } : await session.askRematch();
      if (!settings) { done(); if (session.rematch) showRematchCard(); else toast('The host did not answer, so the rematch could not be set up.', 'error'); return; }
      toast('Opening the rematch table…', 'info');
      const v = G.view, humans = v ? v.players.filter((p) => !p.isBot).length : 0;
      const sess = new HostSession(settings, myName());
      await sess.start();
      sess.rematchOf = { headsUp: humans === 2 || settings.maxSeats === 2, started: false };
      if (isHost) session.offerRematch(myName(), sess.id, session.pid);
      else session.send({ t: 'rematch-ready', id: sess.id });
      // Give the invitation a moment to go out before this table closes.
      const old = session;
      setTimeout(() => { try { old.leave(); } catch { /* ignore */ } }, 1200);
      App.session = sess;
      if (location.hash.startsWith('#/host')) route(true); else location.hash = '#/host';
      toast(sess.rematchOf.headsUp ? 'Rematch table open. The game deals as soon as your opponent sits down.' : 'Rematch table open. Everyone has been invited; press Start when they are seated.', 'info', 6000);
    } catch (e) { done(); toast(`Could not open the rematch table: ${Net.friendly(e).title}`, 'error'); }
  }
  function joinRematch() {
    const r = session.rematch;
    if (!r) return;
    const go = () => {
      App.autoJoin = { id: r.id, name: myName() };
      App.session = null;
      try { session.leave(); } catch { /* ignore */ }
      location.hash = '#join=' + r.id;
    };
    if (hostStillPlaying()) return confirmModal('Join the rematch?', 'You are the host, so leaving ends this game for everyone still playing.', 'Join rematch', go, false);
    go();
  }
  let rcard = null;
  function hideRematchCard() { if (rcard) { rcard.remove(); rcard = null; } }
  function showRematchCard() {
    const r = session.rematch;
    if (!r || isWatcher) return;
    hideRematchCard();
    rcard = document.createElement('div');
    rcard.className = 'rematch-card'; rcard.setAttribute('role', 'alertdialog'); rcard.setAttribute('aria-label', 'Rematch invitation');
    rcard.innerHTML = `<div class="rc-text"><b>${U.esc(r.from)} wants a rematch</b><span>Same settings, fresh stacks. ${U.esc(r.from)} hosts the new table.</span></div>

  function playAgain() {
    const go = () => {
      const old = session;

  /* ----- action bar ----- */
  const bar = $('#g-bar');

    const q = [['min', 'Min', L.minTo], ['half', '½ Pot', cl(base + pot / 2)], ['3q', '¾ Pot', cl(base + (pot * 3) / 4)], ['pot', 'Pot', cl(base + pot)]];

  function amtNow() { const i = $('#ab-amt'); return i ? Math.round(Number(i.value)) : null; }
  function setAmt(x, from) {
    const L = G.view && G.view.legal;

  }
  function myHandName(v) { const s = v.you && v.you.seat != null ? v.seats[v.you.seat] : null; return s && s.handName; }
  function renderBar() {

  bar.addEventListener('click', (e) => {

  /* ----- chat feed on the table (when the chat tab is not open) ----- */

  /* ----- update from a new state ----- */

    if (prev && (prev.handNo !== v.handNo || prev.street !== v.street)) G.pre = null;

      seats: v.seats, board: v.board, pots: v.pots, street: v.shuffling ? (v.table.sra ? 'Encrypting deck…' : 'Shuffling…') : v.handNo ? v.street : v.status === 'lobby' ? 'Waiting for players' : '',

    if (session.autoSit && v.status === 'lobby' && v.you && v.you.seat == null) {
      session.autoSit = false;
      const free = v.seats.findIndex((x) => !x);
      if (free >= 0) session.send({ t: 'sit', seat: free });
    }
    const rm = session.rematchOf;
    if (isHost && rm && rm.headsUp && !rm.started && v.status === 'lobby' && seated >= 2) {
      rm.started = true;
      setTimeout(() => { if (G.view && G.view.status === 'lobby') session.send({ t: 'start' }); }, 1200);
    }
    // Your turn
    const myTurn = !!v.legal;
    if (myTurn && !(prev && prev.legal)) {
      const L = v.legal;
      if (G.pre) {
        const p = G.pre; G.pre = null;
        const a = p === 'checkfold' ? (L.canCheck ? 'check' : 'fold') : p === 'callany' ? (L.canCheck ? 'check' : 'call') : (L.canCheck ? 'check' : null);
        if (a) { setTimeout(() => act(a), 250); return; }
      }
      Sound.play('chime');
      TitleFlash.stop(); TitleFlash.start('● Your turn · Feltroom'); G.turnFlash = true;
      announce(`Your turn. ${L.canCheck ? 'You can check.' : U.fmt(L.toCall) + ' to call.'}`);
    }
    if (!myTurn && G.turnFlash) { TitleFlash.stop(); G.turnFlash = false; }
    if (v.status === 'ended' && !G.ended) showEnded(isHost ? 'You ended the game.' : 'The host ended the game.');
  }

  // A session can outlive this screen (a rematch closes the old table a moment later), so a closed screen ignores it.
  const live = (fn) => (...a) => { if (!G.dead) fn(...a); };
  session.on('view', live(update));
  session.on('event', live((kind, text) => toast(text, kind)));
  session.on('error', live((text) => { toast(text, 'error'); G.sending = false; G.barKey = null; if (G.view) renderBar(); }));
  session.on('ended', live((reason) => showEnded(reason)));
  session.on('rematch', live(() => showRematchCard()));
  if (session.rematch) setTimeout(showRematchCard, 0);
  session.on('fair', live((f, msg) => {
    if (G.alerted !== f.no) { G.alerted = f.no; toast(`Fair-play check failed on hand #${f.no}: ${msg}`, 'error', 9000); announce('Warning: fair play check failed.'); }
    renderFairBadge();
  }));
  if (session.on && !isHost) session.on('status', live((st) => { G.status = st; if (G.view) update(G.view); }));

  /* ----- keyboard ----- */
  function onKey(e) {
    if ($('.modal-back')) return;
    const t = e.target, tag = t.tagName;
    const typing = (tag === 'INPUT' && !['checkbox', 'range', 'radio'].includes(t.type)) || tag === 'TEXTAREA';
    const L = G.view && G.view.legal;
    if (typing) {
      if (t.id === 'ab-amt') {
        if (e.key === 'Enter') { e.preventDefault(); setAmt(t.value); act('raise'); }
        else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); setAmt((amtNow() || 0) + (e.key === 'ArrowUp' ? 1 : -1) * G.view.table.bb); }
        else if (e.key === 'Escape') t.blur();
      }
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k === '?') { e.preventDefault(); return helpOverlay('game'); }
    if (k === 'm') { Sound.toggle(); soundBtn(); return; }
    if (!L) return;
    if (k === 'f') { e.preventDefault(); act('fold'); }
    else if (k === 'c') { e.preventDefault(); act(L.canCheck ? 'check' : 'call'); }
    else if (k === 'r' && L.canRaise) { e.preventDefault(); const i = $('#ab-amt'); if (i) { i.focus(); i.select(); } }
    else if (L.canRaise && (k === 'ArrowUp' || k === 'ArrowRight' || k === 'ArrowDown' || k === 'ArrowLeft')) {
      e.preventDefault();
      setAmt((amtNow() || 0) + (k === 'ArrowUp' || k === 'ArrowRight' ? 1 : -1) * G.view.table.bb);
    } else if (k === 'Enter' && L.canRaise && t.id === 'ab-range') { e.preventDefault(); act('raise'); }
  }
  addEventListener('keydown', onKey);
  const onResize = () => { if (!mobile() && side.classList.contains('collapsed') && Prefs.get('panelOpen', true) && !G.userClosed) { /* keep user choice */ } };
  addEventListener('resize', onResize);

  if (isHost) session.table.changed();
  else if (session.lastView) update(session.lastView);
  return {
    destroy() { G.dead = true; removeEventListener('keydown', onKey); removeEventListener('resize', onResize); table.destroy(); closeMenu(); hideRematchCard(); TitleFlash.stop(); },
  };
}

/* =====================================================================
   9. LEARN POKER  (#/learn): lessons from the rules to the maths, each
   with worked examples and a short quiz, plus calculators. Hand names,
   pots, raise limits and probabilities in the examples are computed by
   the same engine the game uses, so they can't disagree with the table.
   ===================================================================== */
const Learn = (() => {
  // ---------- small maths helpers (also used by the calculators) ----------
  const C = (n, k) => { if (k < 0 || k > n) return 0; let r = 1; for (let i = 1; i <= k; i++) r = (r * (n - k + i)) / i; return Math.round(r); };
  const pct = (x, d = 1) => `${(x * 100).toFixed(d)}%`;
  const hitTwo = (outs) => 1 - C(47 - outs, 2) / C(47, 2); // flop to river, two cards to come
  const hitOne = (outs, unseen = 46) => outs / unseen;       // one card to come
  const potOdds = (pot, call) => call / (pot + call);         // pot already includes the bet you face
  const ev = (eq, pot, call) => eq * pot - (1 - eq) * call;   // EV of calling: win the pot, or lose the call
  const alpha = (pot, bet) => bet / (pot + bet);              // how often a bluff must work
  const mdf = (pot, bet) => pot / (pot + bet);                // how often you must continue vs a bet
  const fmt = (x) => U.fmt(Math.round(x * 100) / 100);

  /** Monte Carlo equity of two or more Hold'em/Omaha hands, optionally with some board cards. */
  function equity(hands, board = [], game = 'holdem', iters = 20000) {
    const dead = new Set([...hands.flat(), ...board]);
    const deck = Cards.newDeck().filter((c) => !dead.has(c));
    const wins = hands.map(() => 0); let ties = 0;
    const need = 5 - board.length;
    for (let it = 0; it < iters; it++) {
      // partial Fisher–Yates for the cards we need (simulation only: Math.random is fine here)
      for (let i = 0; i < need; i++) { const j = i + Math.floor(Math.random() * (deck.length - i)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
      const b = board.concat(deck.slice(0, need));
      const sc = hands.map((h) => Eval.forGame(game, h, b).score);
      const best = Math.max(...sc), w = sc.filter((s) => s === best).length;
      if (w > 1) ties++;
      sc.forEach((s, i) => { if (s === best) wins[i] += 1 / w; });
    }
    return { eq: wins.map((x) => x / iters), tie: ties / iters, iters };
  }

  // ---------- content helpers ----------
  const cards = (s, size = 34) => `<span class="crow">${s.split(/\s+/).filter(Boolean).map((c) => (c === '?' ? cardHtml(null, '', `--cw:${size}px`) : cardHtml(c, '', `--cw:${size}px`))).join('')}</span>`;
  const hand = (hole, board, game = 'holdem', label = '') => {
    const e = Eval.forGame(game, hole.split(' '), board.split(' '));
    return `<div class="lhand">${label ? `<b>${label}</b>` : ''}${cards(hole)}<span class="muted">+</span>${cards(board, 30)}<span class="lres">= ${U.esc(Eval.describe(e))}</span><span class="lbest">best five: ${cards(e.best.join(' '), 26)}</span></div>`;
  };
  const rule = (h) => `<div class="lrule"><b>Rule</b><div>${h}</div></div>`;
  const formula = (h, note = '') => `<div class="lform"><code>${h}</code>${note ? `<span>${note}</span>` : ''}</div>`;
  const ex = (title, h) => `<div class="lex"><div class="lex-t">${icon('play')} Example: ${title}</div>${h}</div>`;
  const tip = (h) => `<div class="ltip"><b>Tip</b> ${h}</div>`;
  const table = (head, rows) => `<div class="ltable-wrap"><table class="ltable"><thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  // ---------- the course ----------
  const CHAPTERS = [
    { id: 'basics', title: 'The basics', blurb: 'Cards, hands and how a hand of poker is played.' },
    { id: 'rules', title: 'Rules in depth', blurb: 'Raises, all-ins, side pots, showdowns, pot limit and Omaha.' },
    { id: 'math', title: 'Poker maths', blurb: 'Outs, odds, expected value, bet sizes and combinations.' },
    { id: 'strategy', title: 'Putting it together', blurb: 'Position, starting hands and stack sizes.' },
  ];

  const L = [];
  const lesson = (o) => L.push(o);

  /* ===== 1. Basics ===== */
  lesson({
    id: 'deck', ch: 'basics', title: 'The deck and the goal',
    body: () => `
      <p>Poker uses a standard <b>52-card deck</b>: 13 ranks in each of 4 suits. From lowest to highest the ranks are
      2, 3, 4, 5, 6, 7, 8, 9, 10 (written <b>T</b>), Jack, Queen, King, Ace. Suits (♠ spades, ♥ hearts, ♦ diamonds, ♣ clubs) are all equal: no suit beats another.</p>
      ${cards('2c 5d 9h Ts Jc Qd Kh As')}
      ${rule('You win a hand in one of two ways: <b>everyone else folds</b>, or you have the <b>best five-card hand at the showdown</b>.')}
      <p>Card names in this app use a rank and a suit letter: <code>As</code> is the ace of spades, <code>Td</code> the ten of diamonds, <code>7c</code> the seven of clubs.</p>
      ${ex('reading cards', `<p>${cards('Ah Kh')} is "ace-king of hearts", written <code>AhKh</code>, or <b>AKs</b> for short (s = suited). ${cards('Qs Qd')} is a pair of queens, <b>QQ</b>. ${cards('Jc 9d')} is <b>J9o</b> (o = offsuit).</p>`)}
      ${tip('An ace can also play low, but only in the straight A-2-3-4-5 (the "wheel").')}`,
    quiz: [
      { q: 'How many cards are in a poker deck?', opts: ['48', '52', '54'], a: 1, why: '13 ranks × 4 suits = 52. No jokers.' },
      { q: 'Which suit is highest?', opts: ['Spades', 'Hearts', 'None: suits are equal'], a: 2, why: 'In Hold\'em and Omaha suits never break ties. Equal hands split the pot.' },
    ],
  });

  lesson({
    id: 'rankings', ch: 'basics', title: 'Hand rankings',
    body: () => {
      const rows = [
        ['Royal flush', 'As Ks Qs Js Ts', 'A-K-Q-J-T all one suit', 4],
        ['Straight flush', '9h 8h 7h 6h 5h', 'Five in a row, one suit', 36],
        ['Four of a kind', 'Qc Qd Qh Qs 7d', 'Four cards of one rank', 624],
        ['Full house', 'Kc Kd Kh 4s 4d', 'Three of a kind plus a pair', 3744],
        ['Flush', 'Ad Jd 8d 6d 2d', 'Five of one suit', 5108],
        ['Straight', 'Tc 9d 8s 7h 6c', 'Five in a row, mixed suits', 10200],
        ['Three of a kind', '7c 7d 7s Kh 2c', 'Three cards of one rank', 54912],
        ['Two pair', 'Jh Jc 4d 4s As', 'Two different pairs', 123552],
        ['One pair', 'Th Tc Ks 8d 3h', 'Two cards of one rank', 1098240],
        ['High card', 'Ah Qc 9d 6s 3c', 'None of the above', 1302540],
      ];
      const total = C(52, 5);
      return `<p>Every poker hand is exactly <b>five cards</b>. From best to worst:</p>
      ${table(['Hand', 'Example', 'What it is', 'Ways to make it', 'Chance in 5 cards'], rows.map(([n, c, d, k]) => [`<b>${n}</b>`, cards(c, 26), d, U.fmt(k), pct(k / total, 4)]))}
      ${formula(`C(52, 5) = 52! ÷ (5! × 47!) = ${U.fmt(total)}`, 'different five-card hands; each row counts how many of them make that hand')}
      ${ex('why a flush beats a straight', `<p>There are ${U.fmt(10200)} straights but only ${U.fmt(5108)} flushes. Rarer hands rank higher. Counting flushes: ${formula('4 suits × C(13, 5) − 40 straight flushes = 4 × 1,287 − 40 = 5,108')}</p>`)}
      ${ex('the wheel', `<p>${cards('5s 4d 3h 2c Ac')} is a straight, <b>${U.esc(Eval.describe(Eval.evaluate(['5s', '4d', '3h', '2c', 'Ac'])))}</b>: the ace plays low. It is the lowest straight; ${cards('6s 5s 4d 3h 2c', 26)} beats it.</p>`)}
      ${tip('Straights do not "wrap around": Q-K-A-2-3 is not a straight.')}`;
    },
    quiz: [
      { q: 'Which hand is better?', opts: ['Full house', 'Flush'], a: 0, why: 'Full house ranks above a flush (3,744 ways versus 5,108).' },
      { q: 'Is K-A-2-3-4 a straight?', opts: ['Yes', 'No'], a: 1, why: 'Straights don\'t wrap. The ace is high (10-J-Q-K-A) or low (A-2-3-4-5), never in the middle.' },
      { q: 'Which is more common in five cards?', opts: ['Two pair', 'Three of a kind'], a: 0, why: 'Two pair: 123,552 ways. Three of a kind: 54,912. Rarer = stronger, so trips beat two pair.' },
    ],
  });

  lesson({
    id: 'flow', ch: 'basics', title: 'How a hand of Hold\'em is played',
    body: () => `
      <p>Each hand has up to <b>four betting rounds</b>. The <b>button</b> (dealer marker) moves one seat to the left every hand.</p>
      <ol class="lsteps">
        <li><b>Blinds.</b> The two players left of the button post forced bets: the <b>small blind</b> and the <b>big blind</b>. They make sure there's something to win.</li>
        <li><b>Preflop.</b> Everyone gets two face-down <b>hole cards</b>. Betting starts with the player left of the big blind.</li>
        <li><b>Flop.</b> Three shared <b>community cards</b> are dealt face up. Betting starts with the first active player left of the button.</li>
        <li><b>Turn.</b> A fourth community card, then another betting round.</li>
        <li><b>River.</b> The fifth and last community card, then the final betting round.</li>
        <li><b>Showdown.</b> If two or more players are left, hands are shown and the best five-card hand wins the pot.</li>
      </ol>
      ${rule('A betting round ends when every player still in has either put in the same amount or is all-in, and everyone has had a chance to act.')}
      ${ex('a full hand, blinds 1/2', `
        <p>Alice is on the button, Bob is the small blind (posts 1), Cat the big blind (posts 2).</p>
        <p><b>Preflop:</b> Alice ${cards('Ah Qh', 28)} raises to 6. Bob folds. Cat ${cards('9c 9d', 28)} calls 4 more. Pot: 6 + 6 + 1 = <b>13</b>.</p>
        <p><b>Flop</b> ${cards('Qs 7d 2c', 28)}: Cat checks, Alice bets 8, Cat calls. Pot <b>29</b>.</p>
        <p><b>Turn</b> ${cards('4h', 28)}: both check. <b>River</b> ${cards('Kc', 28)}: both check.</p>
        <p><b>Showdown:</b> ${hand('Ah Qh', 'Qs 7d 2c 4h Kc', 'holdem', 'Alice')} ${hand('9c 9d', 'Qs 7d 2c 4h Kc', 'holdem', 'Cat')} Alice wins the 29 chip pot.</p>`)}
      ${tip('Heads-up (two players) is special: the button posts the small blind and acts <b>first</b> before the flop, then <b>last</b> on every later street.')}`,
    quiz: [
      { q: 'How many community cards are dealt on the flop?', opts: ['1', '3', '5'], a: 1, why: 'Flop = 3 cards, turn = 1, river = 1: five in total.' },
      { q: 'Who acts first after the flop (3+ players)?', opts: ['The player left of the big blind', 'The first active player left of the button', 'The button'], a: 1, why: 'Preflop starts left of the big blind; on every later street the first active player left of the button starts.' },
    ],
  });

  lesson({
    id: 'actions', ch: 'basics', title: 'Your options: fold, check, call, bet, raise',
    body: () => `
      ${table(['Action', 'When you can', 'What it means'], [
        ['<b>Fold</b>', 'Any time it\'s your turn', 'Give up the hand and anything you put in the pot.'],
        ['<b>Check</b>', 'Nobody has bet this round (or you already matched)', 'Pass without putting in chips.'],
        ['<b>Bet</b>', 'Nobody has bet this round', 'Put chips in that others must match to stay in.'],
        ['<b>Call</b>', 'Someone has bet', 'Match the current bet.'],
        ['<b>Raise</b>', 'Someone has bet', 'Increase the bet. Others must match the new amount.'],
        ['<b>All-in</b>', 'Any time', 'Put in all your chips. You can only win what you matched from each player (see side pots).'],

      ${rule('<b>Table stakes:</b> you can only bet the chips in front of you when the hand starts. You can never be forced out of a hand for lack of chips; you go all-in instead.')}
      ${ex('one betting round', `<p>Blinds 1/2. The player under the gun <b>calls</b> 2. The next player <b>raises to 8</b>. Everyone else must now put in 8 in total (fold, call 8, or raise again). The first player has 2 in, so a call costs them 6 more.</p>`)}
      ${tip('Keyboard shortcuts at the table: <b>F</b> fold, <b>C</b> check or call, <b>R</b> raise.')}`,
    quiz: [
      { q: 'Someone bet 10 before you. Can you check?', opts: ['Yes', 'No'], a: 1, why: 'Checking is only allowed when there is nothing to call. Facing a bet you fold, call or raise.' },
      { q: 'You have 30 chips and face a bet of 50. What can you do?', opts: ['Only fold', 'Call all-in for 30, or fold', 'Borrow 20 more'], a: 1, why: 'Table stakes: you can call for everything you have. You can then only win 30 from each opponent.' },
    ],
  });

  lesson({
    id: 'best5', ch: 'basics', title: 'Making the best five-card hand',
    body: () => `
      <p>In Hold'em you make the best five-card hand from <b>any combination</b> of your two hole cards and the five community cards: both, one, or none of yours.</p>
      ${rule('Only five cards count. A sixth or seventh card never matters, even if it\'s an ace.')}
      ${ex('using both hole cards', hand('9h 8h', 'Th Jh 2c 7d Qs'))}
      ${ex('using one hole card', hand('Ad 3c', 'Kd 9d 4d 2d Js'))}
      ${ex('playing the board (using none)', `${hand('2c 3d', 'Ts Js Qs Kd Ah')}<p>The board itself is a straight. Anyone still in the hand ties unless they can beat it.</p>`)}
      ${ex('a hidden full house', hand('7s 7c', '7d Kh Kc 2s 9h'))}`,
    quiz: [
      { q: 'Board: Ts Js Qs Kd Ah. You hold 2c 3d, your opponent holds 4h 5h. Who wins?', opts: ['You', 'Your opponent', 'Split pot'], a: 2, why: 'Both play the board straight (A-K-Q-J-T). Neither hand improves it, so the pot is split.' },
      { q: 'Can you use just one of your hole cards?', opts: ['Yes, in Hold\'em', 'No, you must use both'], a: 0, why: 'In Hold\'em any five of the seven cards play. (Omaha is different: there you must use exactly two.)' },
    ],
  });

  lesson({
    id: 'kickers', ch: 'basics', title: 'Kickers, ties and split pots',
    body: () => {
      const b = 'As 9c 7d 4h 2s';
      const a = Eval.forGame('holdem', ['Ah', 'Kd'], b.split(' ')), q = Eval.forGame('holdem', ['Ad', 'Qc'], b.split(' '));
      return `
      <p>When two players have the same kind of hand, compare the cards that make it, highest first. Unused cards in the five are called <b>kickers</b>, and they break ties.</p>
      ${rule('Compare rank by rank down the five cards. If all five match, the hands tie and the pot is <b>split</b> equally. Odd chips go to the first winner left of the button.')}
      ${ex('a kicker decides it', `${hand('Ah Kd', b, 'holdem', 'Alice')}${hand('Ad Qc', b, 'holdem', 'Bob')}
        <p>Both have a pair of aces. Next card: Alice's king beats Bob's queen, so Alice wins (${a.score > q.score ? 'confirmed by the engine' : 'engine disagrees!'}).</p>`)}
      ${ex('kickers that don\'t play', `${hand('Ah 3d', 'Ks Kd Qc Qh Jc', 'holdem', 'Alice')}${hand('Ac 2s', 'Ks Kd Qc Qh Jc', 'holdem', 'Bob')}
        <p>Both make kings and queens with an ace kicker. The 3 and the 2 are the sixth and seventh cards and don't count: <b>split pot</b>.</p>`)}
      ${ex('the board\'s kicker counts too', `${hand('Kh 2c', 'Ks 9d 8c 6h 4s', 'holdem', 'Alice')}${hand('Kd 3c', 'Ks 9d 8c 6h 4s', 'holdem', 'Bob')}<p>Pair of kings with 9-8-6 kickers for both: split. Neither small card makes the best five.</p>`)}
      ${tip('Two pair compares the higher pair first, then the lower pair, then the kicker. A full house compares the three-of-a-kind first.')}`;
    },
    quiz: [
      { q: 'Board A♠ 9♣ 7♦ 4♥ 2♠. A K vs A J. Who wins?', opts: ['A K', 'A J', 'Split'], a: 0, why: 'Both have a pair of aces; the king kicker beats the jack.' },
      { q: 'Board K K Q Q J. Ace-three vs ace-two. Result?', opts: ['Ace-three wins', 'Split pot'], a: 1, why: 'Best five for both: K K Q Q A. The 3 and 2 don\'t play.' },
    ],
  });

  /* ===== 2. Rules in depth ===== */
  lesson({
    id: 'positions', ch: 'rules', title: 'Blinds, button and positions',
    body: () => `
      <p>Seats are named by where they sit relative to the button. Acting <b>later</b> is an advantage: you see what others did first.</p>
      ${table(['Position', 'Where', 'Acts preflop', 'Acts after the flop'], [
        ['SB, small blind', '1 left of button', 'second to last', 'first'],
        ['BB, big blind', '2 left of button', 'last', 'second'],
        ['UTG, "under the gun"', '3 left of button', 'first', 'early'],
        ['MP / HJ, middle / hijack', 'middle seats', 'middle', 'middle'],
        ['CO, cutoff', '1 right of button', 'late', 'second to last'],
        ['BTN, button', 'dealer seat', 'late', '<b>last</b>'],
      ])}
      ${rule('<b>Heads-up</b> (two players): the button posts the <b>small</b> blind and acts first preflop; the other player posts the big blind. After the flop the button acts last.')}
      ${rule('<b>Antes</b> are small forced bets from every player, posted before the blinds. They make the pot bigger before anyone acts.')}
      ${ex('who posts what', '<p>Six players, blinds 2/4, ante 1. Before any cards are dealt the pot already holds 6 × 1 + 2 + 4 = <b>12</b> chips.</p>')}
      ${tip('With "blinds go up" turned on, the blinds and ante multiply by 2×, 3×, 5×, 8×… every few hands. Each hand in the record states its own level.')}`,
    quiz: [
      { q: 'Heads-up, who posts the small blind?', opts: ['The button', 'The other player'], a: 0, why: 'Heads-up the button is the small blind and acts first preflop, last after the flop.' },
      { q: 'Which seat acts last after the flop?', opts: ['Big blind', 'Button', 'Under the gun'], a: 1, why: 'The button acts last on the flop, turn and river: the best seat at the table.' },
    ],
  });

  lesson({
    id: 'minraise', ch: 'rules', title: 'Minimum raises (no limit)',
    body: () => {
      const h = Engine.createHand({ no: 1, players: ['A', 'B', 'C', 'D'].map((name) => ({ name, stack: 500 })), button: 0, sb: 1, bb: 2 });
      const l0 = Engine.legal(h); Engine.applyAction(h, { type: 'raise', to: 6 }); const l1 = Engine.legal(h); Engine.applyAction(h, { type: 'raise', to: 20 }); const l2 = Engine.legal(h);
      return `
      ${rule('A raise must be at least as big as the <b>last bet or raise</b> in the same round. The first bet must be at least one big blind.')}
      ${formula('minimum raise to = current bet + size of the last raise')}
      ${ex('raises getting bigger', `<p>Blinds 1/2 (the big blind counts as the first "bet" of 2).</p>
        <ul class="lsteps"><li>First raiser: min raise to = 2 + 2 = <b>${l0.minTo}</b>. They raise to 6 (a raise of 4).</li>
        <li>Next player: min re-raise to = 6 + 4 = <b>${l1.minTo}</b>. They raise to 20 (a raise of 14).</li>

    body: () => {

        ['Small blind', 'Similar to the cutoff when it\'s folded to you', '25–35%'],
      ])}
      ${rule('Raise rather than limp (just call the big blind) when you enter a pot first. It gives you two ways to win: everyone folds now, or you win at showdown.')}
      ${ex('the same hand, two seats', `<p>${cards('Kh Jc', 26)} is a fold under the gun at a full table (it's often dominated by AK, AJ, KQ) but a standard raise on the button.</p>`)}
      ${tip('These are starting points, not laws. Tighten up against aggressive tables and loosen up when others fold too much.')}`,
    quiz: [
      { q: 'Where should you play the most hands?', opts: ['Under the gun', 'On the button'], a: 1, why: 'The button acts last after the flop: the best seat at the table.' },

  lesson({
    id: 'spr', ch: 'strategy', title: 'Stack-to-pot ratio and effective stacks',
    body: () => `
      ${formula('effective stack = the smaller of your stack and your opponent\'s', 'you can never win or lose more than that from them')}
      ${formula('SPR = effective stack ÷ pot on the flop')}
      ${table(['SPR', 'What it means'], [
        ['Under 3', 'Top pair or better is usually happy to get all-in.'],
        ['3 to 10', 'Top pair is a good hand but often not worth stacking off. Think before going all-in.'],
        ['Over 10', 'Deep: big hands (sets, straights, flushes) and good draws gain value; one pair is often just a bluff-catcher.'],
      ])}
      ${ex('working it out', '<p>You have 400, your opponent 250. Effective stack: 250. The pot on the flop is 60, so SPR = 250 ÷ 60 ≈ 4.2. With top pair, you should be willing to play a big pot but not automatically all of it.</p>')}`,
    quiz: [
      { q: 'You have 1,000, they have 300, pot 100. SPR?', opts: ['3', '10', '13'], a: 0, why: 'Effective stack is 300 (the smaller). 300 ÷ 100 = 3.' },

  lesson({
    id: 'tools', ch: 'strategy', title: 'Tools: calculators',
    body: () => `
      <p>Plug in your own numbers. Everything runs on this device.</p>

        <section class="card-ui ltool"><h4>${icon('calc')} Pot odds and EV</h4>

          <label class="field"><span>Amount to call</span><input class="input num" id="t-call" type="number" min="0" value="50"></label></div>
          <label class="field"><span>Your equity (%)</span><input class="input num" id="t-eq" type="number" min="0" max="100" value="35"></label>
          <div class="lout" id="t-po"></div></section>
        <section class="card-ui ltool"><h4>${icon('calc')} Outs to odds</h4>
          <label class="field"><span>Outs</span><input class="input num" id="t-outs" type="number" min="0" max="30" value="9"></label>
          <div class="lout" id="t-oo"></div></section>
        <section class="card-ui ltool"><h4>${icon('calc')} Bet size</h4>
          <div class="two"><label class="field"><span>Pot</span><input class="input num" id="t-bp" type="number" min="1" value="100"></label>
          <label class="field"><span>Bet</span><input class="input num" id="t-bb" type="number" min="1" value="75"></label></div>
          <div class="lout" id="t-bs"></div></section>
        <section class="card-ui ltool"><h4>${icon('calc')} Equity calculator</h4>
          <div class="two"><label class="field"><span>Hand 1</span><input class="input" id="t-h1" value="Ah Kh" autocomplete="off"></label>
          <label class="field"><span>Hand 2</span><input class="input" id="t-h2" value="Qs Qd" autocomplete="off"></label></div>
          <div class="two"><label class="field"><span>Board (0, 3, 4 or 5 cards)</span><input class="input" id="t-bd" value="" placeholder="e.g. Kd 7h 2c" autocomplete="off"></label>
          <div class="field"><span>Game</span><select class="input" id="t-g"><option value="holdem">Hold'em</option><option value="omaha">Omaha (4 or 5 cards)</option></select></div></div>
          <button class="btn primary" id="t-run" type="button">${icon('play')}Run 20,000 deals</button>
          <div class="lout" id="t-eqo"></div></section>
      </div>`,
    after(root) {
      const n = (id) => Math.max(0, Number($(id, root).value) || 0);
      const upd = () => {
        const pot = n('#t-pot'), call = n('#t-call'), eq = Math.min(100, n('#t-eq')) / 100;
        $('#t-po', root).innerHTML = call > 0 ? `You need <b>${pct(potOdds(pot, call))}</b> equity (odds ${fmt(pot / call)} : 1).<br>EV of calling at ${pct(eq, 0)}: <b>${ev(eq, pot, call) >= 0 ? '+' : ''}${fmt(ev(eq, pot, call))}</b> chips → ${ev(eq, pot, call) >= 0 ? 'call' : 'fold (unless implied odds make up the difference)'}.` : 'Nothing to call: checking is free.';
        const o = Math.min(30, Math.floor(n('#t-outs')));
        $('#t-oo', root).innerHTML = `Next card (flop→turn): <b>${pct(hitOne(o, 47))}</b> · (turn→river): <b>${pct(hitOne(o, 46))}</b><br>By the river from the flop: <b>${pct(hitTwo(o))}</b> (rule of 4 says ${Math.min(100, o * 4)}%)`;
        const bp = n('#t-bp') || 1, bb = n('#t-bb') || 1;
        $('#t-bs', root).innerHTML = `That's ${pct(bb / bp, 0)} of the pot.<br>A pure bluff needs folds <b>${pct(alpha(bp, bb))}</b> of the time.<br>The caller needs <b>${pct(potOdds(bp + bb, bb))}</b> equity and should defend at least <b>${pct(mdf(bp, bb))}</b> of their range.`;
      };
      $$('input', root).forEach((i) => i.addEventListener('input', upd));
      upd();
      const parse = (s) => (String(s).match(/(10|[2-9TJQKA])[shdc♠♥♦♣]/gi) || []).map((x) => Cards.parse(x)).filter(Boolean);
      $('#t-run', root).addEventListener('click', () => {
        const game = $('#t-g', root).value, h1 = parse($('#t-h1', root).value), h2 = parse($('#t-h2', root).value), bd = parse($('#t-bd', root).value);
        const all = [...h1, ...h2, ...bd], out = $('#t-eqo', root);
        const hc = game === 'omaha' ? [4, 5] : [2];
        if (!hc.includes(h1.length) || h1.length !== h2.length) return void (out.innerHTML = `<span class="err-text">Enter ${game === 'omaha' ? '4 or 5' : '2'} cards for each hand, like <code>Ah Kh</code>.</span>`);
        if (![0, 3, 4, 5].includes(bd.length)) return void (out.innerHTML = '<span class="err-text">The board needs 0, 3, 4 or 5 cards.</span>');
        if (new Set(all).size !== all.length) return void (out.innerHTML = '<span class="err-text">The same card appears twice.</span>');
        out.textContent = 'Dealing…';
        setTimeout(() => {
          const r = equity([h1, h2], bd, game, bd.length === 5 ? 1 : 20000);
          out.innerHTML = `${cards(h1.join(' '), 24)} <b>${pct(r.eq[0])}</b> &nbsp; ${cards(h2.join(' '), 24)} <b>${pct(r.eq[1])}</b><br><span class="hint">Ties ${pct(r.tie)} (counted as half a win each) · ${U.fmt(r.iters)} deal${r.iters === 1 ? '' : 's'}</span>`;
        }, 20);
      });
    },
    quiz: [],
  });

  return { CHAPTERS, LESSONS: L, equity, C, hitTwo, hitOne, potOdds, ev, alpha, mdf };
})();

function LearnScreen(id) {
  document.title = TitleFlash.base = 'Learn Poker · Feltroom';
  document.body.classList.add('scroll');
  const prog = () => Prefs.get('learn', { done: [] });
  const isDone = (lid) => prog().done.includes(lid);
  const markDone = (lid) => { const p = prog(); if (!p.done.includes(lid)) { p.done.push(lid); Prefs.set('learn', p); } };
  const L = Learn.LESSONS;
  const idx = L.findIndex((x) => x.id === id);
  const head = (title) => `<div class="page-head"><a class="btn ghost icon-btn" href="${idx >= 0 ? '#/learn' : '#/'}" aria-label="Back">${icon('back')}</a><h2>${title}</h2><span class="grow"></span>${topIconButtons()}</div>`;

  if (idx < 0) {
    const done = prog().done.filter((x) => L.some((l) => l.id === x)).length;
    App.root.innerHTML = `<div class="page"><div class="page-inner">${head(`${icon('book')} Learn Poker`)}
      <p class="muted" style="margin-top:0">From the rules of the game to the maths behind every decision. Each lesson has worked examples and a short quiz. Your progress stays on this device.</p>
      <div class="lprog"><div class="lprog-bar"><span style="width:${(done / L.length) * 100}%"></span></div><span>${done} of ${L.length} lessons done</span></div>
      ${Learn.CHAPTERS.map((ch, ci) => `<section class="lchap"><h3><span class="lnum">${ci + 1}</span>${ch.title}</h3><p class="hint">${ch.blurb}</p>
        <div class="llist">${L.filter((l) => l.ch === ch.id).map((l) => `<a class="litem ${isDone(l.id) ? 'done' : ''}" href="#/learn/${l.id}"><span class="lcheck">${isDone(l.id) ? icon('check') : ''}</span><span>${U.esc(l.title)}</span>${icon('chevron')}</a>`).join('')}</div></section>`).join('')}
    </div></div>`;
    bindThemeToggles(App.root);
    return { destroy() { document.body.classList.remove('scroll'); } };
  }

  const l = L[idx], ch = Learn.CHAPTERS.find((c) => c.id === l.ch);
  const prev = L[idx - 1], next = L[idx + 1];
  App.root.innerHTML = `<div class="page"><div class="page-inner learn">${head(U.esc(l.title))}
    <div class="hint" style="margin:-14px 0 14px">${U.esc(ch.title)} · Lesson ${idx + 1} of ${L.length}</div>
    <article class="lbody">${l.body()}</article>
    ${l.quiz.length ? `<section class="lquiz card-ui"><h3>${icon('check')} Check yourself</h3>${l.quiz.map((q, qi) => `<div class="lq" data-q="${qi}"><p><b>${qi + 1}.</b> ${U.esc(q.q)}</p><div class="lopts">${q.opts.map((o, oi) => `<button class="btn sm" data-o="${oi}">${U.esc(o)}</button>`).join('')}</div><div class="lwhy hidden"></div></div>`).join('')}</section>` : ''}
    <nav class="lnav">${prev ? `<a class="btn" href="#/learn/${prev.id}">${icon('back')}${U.esc(prev.title)}</a>` : '<span></span>'}
      ${next ? `<a class="btn primary" href="#/learn/${next.id}">${U.esc(next.title)} ${icon('chevron')}</a>` : '<a class="btn primary" href="#/learn">All lessons</a>'}</nav>
  </div></div>`;
  bindThemeToggles(App.root);
  if (l.after) l.after(App.root);
  if (!l.quiz.length) markDone(l.id);
  let right = 0;
  $$('.lq', App.root).forEach((el) => {
    const q = l.quiz[+el.dataset.q];
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-o]');
      if (!b || el.dataset.answered) return;
      el.dataset.answered = '1';
      const ok = +b.dataset.o === q.a;
      if (ok) right++;
      $$('[data-o]', el).forEach((x) => { x.disabled = true; if (+x.dataset.o === q.a) x.classList.add('primary'); });
      if (!ok) b.classList.add('danger');
      const w = $('.lwhy', el);
      w.innerHTML = `${ok ? '<b class="ok-text">Correct.</b>' : '<b class="err-text">Not quite.</b>'} ${U.esc(q.why)}`;
      w.classList.remove('hidden');
      if ($$('.lq[data-answered]', App.root).length === l.quiz.length) {
        markDone(l.id);
        toast(right === l.quiz.length ? 'Lesson complete: all correct!' : `Lesson complete: ${right} of ${l.quiz.length} correct.`, right === l.quiz.length ? 'success' : 'info');
      }
    });
  });
  window.scrollTo(0, 0);
  return { destroy() { document.body.classList.remove('scroll'); } };
}

    ta.value = text || '';
    $('#v-load').addEventListener('click', () => tryLoad(ta.value));
    $('#v-sample').addEventListener('click', () => { ta.value = SAMPLE_RECORD; tryLoad(SAMPLE_RECORD); });
    $('#v-file').addEventListener('change', async (e) => { const f = e.target.files[0]; if (f) { ta.value = await f.text(); tryLoad(ta.value); } });
    if (err) showErr(err);
    else setTimeout(() => ta.focus(), 30);
  }

  function showErr(e) {
    const box = $('#v-err');
    if (!box) return;
    box.innerHTML = `<div class="err-box" role="alert">${icon('alert')}<div style="flex:1">${e.line ? `<b>Line ${e.line}</b>: ${U.esc(e.detail)}` : U.esc(e.message)}</div>${e.line ? `<button class="btn sm" id="v-goto">Show line</button>` : ''}</div>`;
    const g = $('#v-goto');
    if (g) g.addEventListener('click', () => {
      const ta = $('#v-text'), lines = ta.value.split('\n');
      let start = 0;
      for (let i = 0; i < e.line - 1 && i < lines.length; i++) start += lines[i].length + 1;
      ta.focus(); ta.setSelectionRange(start, start + (lines[e.line - 1] || '').length);
      ta.scrollTop = Math.max(0, (e.line - 4) * 19.5);
    });
  }

  async function tryLoad(text) {
    // A compact record (starting with ♣) is unpacked to the full text first.
    if (Compact.isCompact(text)) {
      try { text = await Compact.decode(text); }
      catch (e) { if ($('#v-text')) showErr(e); else loadPage(text, e); return; }
    }
    let game;
    try { game = Notation.parse(text); }
    catch (e) { if ($('#v-text')) showErr(e); else loadPage(text, e); return; }
    if (!game.hands.length) { const e = new RecordError(1, 'The record has a header but no hands yet.'); if ($('#v-text')) showErr(e); else loadPage(text, e); return; }
    Prefs.set('viewerLast', text);
    V.text = text; V.game = game;
    V.replay = Replay.game(game);
    V.stats = Replay.stats(V.replay);
    V.order = V.stats.players.map((p) => p.name);
    // Default point of view: the player whose hole cards are known most often (the record's owner).
    const known = Object.create(null);
    game.hands.forEach((h) => Object.entries(h.hole).forEach(([n, c]) => { if (c) known[n] = (known[n] || 0) + 1; }));
    V.persp = Object.keys(known).sort((a, b) => known[b] - known[a])[0] || V.order[0];
    V.hk = Math.max(0, V.replay.hands.findIndex((h) => h.steps.length));
    V.si = 0;
    mainPage();
  }

  const tag = (k) => (V.game.tags.find((t) => t[0] === k) || [])[1];
  const colorOf = (name) => { const i = V.order.indexOf(name); return i >= 0 && i < 8 ? `var(--series-${i + 1})` : 'var(--text-3)'; };

  function mainPage() {

          <button class="btn sm" id="v-new">${icon('plus')}<span class="hide-sm">Load another</span></button>
          <button class="btn sm ghost hide-sm" id="v-copy">${icon('copy')}<span>Copy</span></button>
          ${topIconButtons()}<button class="btn ghost icon-btn hide-sm" id="v-help" aria-label="Keyboard shortcuts">${icon('help')}</button>
        </div></header>
      <div class="viewer-body">
        <nav class="v-hands" id="v-hands" aria-label="Hands"></nav>

            <button class="btn icon-btn" data-nav="prevStreet" title="Previous street (Shift+←)" aria-label="Previous street">${icon('skipBack')}</button>
            <button class="btn icon-btn" data-nav="prev" title="Step back (←)" aria-label="Step back">${icon('back')}</button>
            <button class="btn primary icon-btn" data-nav="play" id="v-play" title="Autoplay (Space)" aria-label="Autoplay">${icon('play')}</button>
            <button class="btn icon-btn" data-nav="next" title="Step forward (→)" aria-label="Step forward">${icon('fwd')}</button>
            <button class="btn icon-btn" data-nav="nextStreet" title="Next street (Shift+→)" aria-label="Next street">${icon('skipFwd')}</button>
            <button class="btn icon-btn" data-nav="nextHand" title="Next hand (↓)" aria-label="Next hand">${icon('last')}</button>
            <span class="sep"></span>
            <select class="input" id="v-speed" style="height:38px;width:auto" aria-label="Autoplay speed">${[[0.5, '0.5×'], [1, '1×'], [2, '2×'], [4, '4×']].map(([s, l]) => `<option value="${s}" ${s === V.speed ? 'selected' : ''}>${l}</option>`).join('')}</select>

  function cur() { return V.replay.hands[V.hk]; }

  function replayView(rh, step) {
    const h = step.hand, done = h.phase === 'done';
    const persp = Math.max(0, h.players.findIndex((p) => p.name === V.persp));
    const curActs = {};
    for (const e of h.log) if (e.t === 'act' && e.street === h.street) curActs[e.p] = e;

    if (done) h.log.filter((e) => e.t === 'win').forEach((e) => { wins[e.p] = (wins[e.p] || 0) + e.amt; });
    const winCards = new Set();
    if (done && h.results.showdown) h.results.pots.forEach((pt) => pt.winners.forEach((w) => { const ev = h.results.evals[w]; if (ev) ev.best.forEach((c) => winCards.add(c)); }));
    const ps = !done ? Engine.collectedPots(h) : [];
    return {
      maxSeats: h.players.length, mySeat: persp, handKey: `r${V.hk}`, readOnly: true, feltText: tag('Event') || '',
      seats: h.players.map((p, i) => ({
        seat: i, name: p.name, stack: p.stack, bet: done ? 0 : p.bet,
        cards: p.hole ? p.hole.slice() : (p.folded || p.mucked ? null : new Array(h.holeCount || 2).fill(null)),
        folded: p.folded || p.mucked, mucked: p.mucked && !p.folded, allIn: p.allIn && !done, button: i === h.button,
        sb: i === h.sbIdx && h.street === 0 && !done, bb: i === h.bbIdx && h.street === 0 && !done,
        toAct: h.phase === 'betting' && h.toAct === i, won: wins[i] || 0, shown: true, isYou: i === persp,
        handName: p.hole && !p.folded && !p.mucked ? Eval.describe(Eval.forGame(h.game, p.hole, h.board)) : null,
        lastAction: curActs[i] ? curActs[i].type : null,
      })),
      board: h.board.slice(), street: done ? (h.results.showdown ? 'Showdown' : STREETS[h.street]) : STREETS[h.street],
      pots: ps.map((pt, k) => ({ label: ps.length > 1 ? (k === 0 ? 'Main' : `Side ${k}`) : 'Pot', amount: pt.amount })),
      results: done ? { winCards: [...winCards], lines: h.log.filter((e) => e.t === 'win').map((e) => Engine.describeEntry(h, e)) } : null,
      timer: null,
    };
  }

  function show(animate) {
    const rh = cur();
    if (!rh) return;
    $$('.v-hand').forEach((b) => b.setAttribute('aria-current', String(Number(b.dataset.hk) === V.hk)));
    const cb = $(`.v-hand[data-hk="${V.hk}"]`);
    if (cb) cb.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    if (!rh.steps.length) {
      $('#v-label').textContent = `Hand #${rh.rec.no} could not be replayed`;
      $('#v-progress').textContent = `Hand ${V.hk + 1}/${V.replay.hands.length}`;
      return;
    }
    V.si = Math.max(0, Math.min(V.si, rh.steps.length - 1));
    const step = rh.steps[V.si];
    V.table.render(replayView(rh, step), { animate });
    $('#v-label').textContent = `Hand #${rh.rec.no} · ${step.label}`;
    $('#v-progress').textContent = `Step ${V.si + 1}/${rh.steps.length} · Hand ${V.hk + 1}/${V.replay.hands.length}`;
    if (V.tab === 'hand' && V.sideHand !== V.hk) renderSide();
  }

  function nav(what) {
    const rh = cur();
    const last = rh.steps.length - 1;
    const lastHand = V.replay.hands.length - 1;
    if (what === 'play') return V.playing ? stop() : play();
    if (what !== 'tick') stop();
    let fwd = true;
    switch (what) {
      case 'tick': case 'next':
        if (V.si < last) V.si++;
        else if (V.hk < lastHand) { V.hk++; V.si = 0; }
        else { stop(); return; }
        break;
      case 'prev':
        fwd = false;
        if (V.si > 0) V.si--;
        else if (V.hk > 0) { V.hk--; V.si = cur().steps.length - 1; }
        break;
      case 'nextStreet': {
        const j = rh.steps.findIndex((s, k) => k > V.si && (s.kind === 'deal' || s.kind === 'showdown' || k === last));
        if (j >= 0) V.si = j; else if (V.hk < lastHand) { V.hk++; V.si = 0; }
        break;
      }
      case 'prevStreet': {
        fwd = false;
        let j = 0;
        rh.steps.forEach((s, k) => { if (k < V.si && s.kind === 'deal') j = k; });
        if (V.si === 0 && V.hk > 0) { V.hk--; V.si = 0; } else V.si = j;
        break;
      }
      case 'nextHand': if (V.hk < lastHand) { V.hk++; V.si = 0; } break;
      case 'prevHand': fwd = false; if (V.hk > 0) { V.hk--; V.si = 0; } else V.si = 0; break;
      case 'start': fwd = false; V.si = 0; break;
      case 'end': V.si = last; break;
    }
    show(fwd);
  }
  function play() {
    V.playing = true;
    const b = $('#v-play'); if (b) { b.innerHTML = icon('pause'); b.setAttribute('aria-label', 'Pause autoplay'); }
    const ms = { 0.5: 2200, 1: 1150, 2: 600, 4: 300 }[V.speed] || 1150;
    V.timer = setInterval(() => nav('tick'), ms);
  }
  function stop() {
    V.playing = false; clearInterval(V.timer);
    const b = $('#v-play'); if (b) { b.innerHTML = icon('play'); b.setAttribute('aria-label', 'Autoplay'); }
  }

  /* ----- side panel: stats / hand text / checks ----- */
  function renderSide() {
    const p = $('#v-panel');
    if (!p) return;
    $$('[data-vtab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.vtab === V.tab)));
    if (V.tab === 'hand') {
      const rh = cur();
      V.sideHand = V.hk;
      p.innerHTML = `<div class="section-title" style="margin-top:4px">Hand #${rh.rec.no} as recorded</div><pre class="hand-text">${U.esc(Notation.serializeHand(rh.rec))}</pre>
        ${rh.issues.length ? `<div class="section-title">Inconsistencies</div><div class="issues">${rh.issues.map((i) => `<div class="issue">${U.esc(i)}</div>`).join('')}</div>` : `<div class="issue ok" style="margin-top:10px">${icon('check')} Re-simulated cleanly.</div>`}`;
    } else if (V.tab === 'issues') {
      const iss = V.replay.issues, notes = V.replay.notes;
      p.innerHTML = `<div class="section-title" style="margin-top:4px">Engine re-simulation</div><div class="issues">
        ${iss.length ? iss.map((i) => `<div class="issue">⚠ ${U.esc(i)}</div>`).join('') : `<div class="issue ok">${icon('check')} All ${V.replay.hands.length} hands re-simulated through the rules engine with no inconsistencies.</div>`}
        ${notes.map((n) => `<div class="issue note">${U.esc(n)}</div>`).join('')}</div>`;
    } else p.innerHTML = statsHtml();
    if (V.tab === 'stats') {
      bindChart();
      const kb = $('#v-keybtn');
      if (kb) kb.addEventListener('click', () => $('#v-key').scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' }));
    }
  }

  function statsHtml() {
    const S = V.stats;
    const KEY = Object.fromEntries(STAT_KEY);
    const pct = (x) => (x == null ? '–' : x + '%');
    const sign = (n) => `<span class="${n > 0 ? 'net-pos' : n < 0 ? 'net-neg' : ''}">${n > 0 ? '+' : ''}${U.fmt(n)}</span>`;
    // Every tile carries its definition as a tooltip; the full key is at the bottom.
    const tile = (label, value, cls = 'tile', sub = '') => `<div class="${cls}" title="${U.esc(label + ': ' + (KEY[label] || ''))}"><${cls === 'tile' ? 'div class="tv"' : 'b'}>${value}</${cls === 'tile' ? 'div' : 'b'}><${cls === 'tile' ? 'div class="tl"' : 'span'}>${label}${sub}</${cls === 'tile' ? 'div' : 'span'}></div>`;
    const mini = (label, value) => tile(label, value, '');
    const ratio = (a, b) => (b ? ` <small class="muted">${a}/${b}</small>` : '');
    const maxCat = Math.max(1, ...S.winningHands.map((w) => w.count));
    return `<div class="row" style="margin-top:4px"><div class="section-title" style="margin:0">Overview</div><span class="grow"></span><button class="btn sm ghost" id="v-keybtn">${icon('help')}Stat key</button></div>
      <div class="tiles" style="margin-top:8px">
        ${tile('Hands', S.totalHands)}
        ${tile('Biggest pot', U.fmt(S.biggestPot), 'tile', S.biggestPotHand ? ' · #' + S.biggestPotHand : '')}
        ${tile('Avg pot', U.fmt(S.avgPot))}
        ${tile('Showdowns', pct(S.showdownPct))}
        ${tile('Split pots', S.splits)}
        <div class="tile" title="Average number of players dealt into each hand"><div class="tv">${S.avgPlayers}</div><div class="tl">Players / hand</div></div>
      </div>
      ${S.botHands ? `<p class="hint">🤖 ${S.botHands} hand${S.botHands > 1 ? 's' : ''} in this record had a bot making decisions (marked in the hand list).</p>` : ''}
      ${S.winningHands.length ? `<div class="section-title" title="${U.esc(KEY['Winning hands'])}">Winning hands at showdown</div>
      <div class="bars">${S.winningHands.slice().reverse().map((w) => `<div class="bar-row"><span>${w.name}</span><div class="bar"><i style="width:${(100 * w.count) / maxCat}%"></i></div><b class="num">${w.count}</b></div>`).join('')}</div>` : ''}
      <div class="section-title">Chip stacks over time</div>
      <div class="chart" id="v-chart">${chartSvg()}<div class="tip hidden" id="v-tip"></div></div>
      <div class="legend">${S.players.map((pl) => `<span><i style="background:${colorOf(pl.name)}"></i>${U.esc(pl.name)}</span>`).join('')}</div>
      <details style="margin-top:8px"><summary class="hint" style="cursor:pointer">Show stacks as a table</summary>${stackTable()}</details>
      <div class="section-title">Players</div>
      <div style="display:flex;flex-direction:column;gap:10px">${S.players.map((pl) => `<div class="pcard">
        <div class="pcard-head">${avatarHtml(pl.name, '', `background:${colorOf(pl.name)}`)}<div style="flex:1;min-width:0"><b>${U.esc(pl.name)}</b><div class="hint">${pl.hands} hands · ${pl.bb100 == null ? '–' : (pl.bb100 > 0 ? '+' : '') + pl.bb100} bb/100${pl.botHands ? ` · 🤖 ${pl.botHands}` : ''}</div></div><div style="font-weight:800;font-size:18px" class="num" title="${U.esc(KEY.Net)}">${sign(pl.net)}</div></div>
        <div class="stat-group">Results</div>
        <div class="mini">
          ${mini('Won', `${pct(pl.winPct)}${ratio(pl.won, pl.hands)}`)}${mini('bb/100', pl.bb100 == null ? '–' : pl.bb100)}
          ${mini('Avg pot won', U.fmt(pl.avgWon))}${mini('Biggest pot', U.fmt(pl.biggest))}
          ${mini('Worst hand', pl.worst ? sign(pl.worst) : '0')}${mini('Best streak', pl.bestStreak)}
          ${mini('All-ins', `${pl.allIn}${pl.allIn ? ` <small class="muted">won ${pl.allInWon}</small>` : ''}`)}${mini('Won w/o SD', pl.wonNoSD)}
        </div>
        <div class="stat-group">Before the flop</div>
        <div class="mini">
          ${mini('VPIP', pct(pl.vpipPct))}${mini('PFR', pct(pl.pfrPct))}${mini('3-Bet', `${pct(pl.threeBetPct)}${ratio(pl.threeBet, pl.threeBetOpp)}`)}${mini('Fold to 3-Bet', `${pct(pl.foldTo3Pct)}${ratio(pl.foldTo3, pl.foldTo3Opp)}`)}
          ${mini('Limp', pct(pl.limpPct))}${mini('Fold preflop', pct(pl.foldPrePct))}
        </div>
        <div class="stat-group">After the flop</div>
        <div class="mini">
          ${mini('AF', pl.af == null ? '–' : pl.af === Infinity ? '∞' : pl.af)}${mini('AFq', pct(pl.afqPct))}
          ${mini('C-Bet', `${pct(pl.cbetPct)}${ratio(pl.cbet, pl.cbetOpp)}`)}${mini('Fold to C-Bet', `${pct(pl.foldToCbetPct)}${ratio(pl.foldToCbet, pl.foldToCbetOpp)}`)}
          ${mini('Check-raise', pl.checkRaise)}${mini('Saw flop', pl.sawFlop)}
        </div>
        <div class="stat-group">Showdown</div>
        <div class="mini">
          ${mini('WTSD', pct(pl.wtsdPct))}${mini('W$SD', pct(pl.wsdPct))}${mini('WWSF', pct(pl.wwsfPct))}
        </div></div>`).join('')}</div>
      <div class="section-title" id="v-key">Stat key</div>
      <dl class="stat-key">${STAT_KEY.map(([k, d]) => `<dt>${U.esc(k)}</dt><dd>${U.esc(d)}</dd>`).join('')}</dl>
      <p class="hint">Percentages with a small fraction (like <span class="num">3/10</span>) show how many times it happened out of the chances the player had. Hover or long-press any stat to see its definition.</p>`;
  }

  function chartData() {
    const S = V.stats, n = V.replay.hands.length;
    const start = Number(tag('StartingStack')) || 0;
    return S.players.map((pl) => {
      const pts = [];
      const firstHand = V.replay.hands.findIndex((rh) => rh.hand && rh.hand.players.some((p) => p.name === pl.name));
      for (let k = 0; k < n; k++) {
        const h = V.replay.hands[k].hand;
        const p = h && h.players.find((q) => q.name === pl.name);
        if (k === firstHand && p) pts.push({ x: k, y: p.startStack });
        pts.push(p && h.phase === 'done' ? { x: k + 1, y: p.stack } : null);
      }
      if (firstHand < 0 && start) pts.unshift({ x: 0, y: start });
      return { name: pl.name, pts };
    });
  }
  const CH = { w: 360, h: 190, l: 40, r: 10, t: 10, b: 22 };
  function chartScales() {
    const data = chartData(), n = V.replay.hands.length;
    let max = 0;
    data.forEach((s) => s.pts.forEach((p) => { if (p && p.y > max) max = p.y; }));
    const mag = Math.pow(10, Math.floor(Math.log10(max || 1)));
    const nice = Math.ceil((max || 1) / mag / 2) * 2 * mag || 1;
    const X = (x) => CH.l + (x / Math.max(1, n)) * (CH.w - CH.l - CH.r);
    const Y = (y) => CH.t + (1 - y / nice) * (CH.h - CH.t - CH.b);
    return { data, n, nice, X, Y };
  }
  function chartSvg() {
    const { data, n, nice, X, Y } = chartScales();
    const grid = [0, 0.25, 0.5, 0.75, 1].map((f) => `<line x1="${CH.l}" x2="${CH.w - CH.r}" y1="${Y(nice * f)}" y2="${Y(nice * f)}"/>`).join('');
    const yl = [0, 0.5, 1].map((f) => `<text x="${CH.l - 6}" y="${Y(nice * f) + 3}" text-anchor="end">${U.fmt(Math.round(nice * f))}</text>`).join('');
    const xt = [0, Math.round(n / 2), n].filter((v, i, a) => a.indexOf(v) === i).map((x) => `<text x="${X(x)}" y="${CH.h - 6}" text-anchor="middle">${x === 0 ? 'Start' : '#' + x}</text>`).join('');
    const paths = data.map((s) => {
      let d = '', pen = false;
      for (const p of s.pts) { if (!p) { pen = false; continue; } d += `${pen ? 'L' : 'M'}${X(p.x).toFixed(1)} ${Y(p.y).toFixed(1)}`; pen = true; }
      return `<path d="${d}" style="stroke:${colorOf(s.name)}"><title>${U.esc(s.name)}</title></path>`;
    }).join('');
    let labels = '';
    if (data.length <= 4) { // direct labels at line ends, nudged apart so they never collide
      const ls = data.map((s) => { const last = [...s.pts].reverse().find(Boolean); return last && { name: s.name, x: X(last.x), y: Y(last.y) - 6 }; }).filter(Boolean).sort((a, b) => a.y - b.y);
      for (let i = 1; i < ls.length; i++) if (ls[i].y - ls[i - 1].y < 11) ls[i].y = ls[i - 1].y + 11;
      labels = ls.map((l) => `<text x="${l.x - 2}" y="${l.y}" text-anchor="end" style="fill:var(--text-2);font-size:10px">${U.esc(l.name)}</text>`).join('');
    }
    return `<svg viewBox="0 0 ${CH.w} ${CH.h}" role="img" aria-label="Line chart of each player's chip stack after every hand" id="v-svg">
      <g class="grid">${grid}</g><g class="axis">${yl}${xt}</g><g class="series">${paths}</g><g>${labels}</g>
      <line id="v-cross" x1="0" x2="0" y1="${CH.t}" y2="${CH.h - CH.b}" stroke="var(--text-3)" stroke-dasharray="3 3" visibility="hidden"/>
      <rect x="${CH.l}" y="0" width="${CH.w - CH.l - CH.r}" height="${CH.h}" fill="transparent" id="v-hit"/></svg>`;
  }
  function bindChart() {
    const svg = $('#v-svg'), hit = $('#v-hit'), tip = $('#v-tip'), cross = $('#v-cross');
    if (!svg) return;
    const { data, n, X } = chartScales();
    const move = (ev) => {
      const r = svg.getBoundingClientRect();
      const px = ((ev.clientX - r.left) / r.width) * CH.w;
      const x = Math.max(0, Math.min(n, Math.round(((px - CH.l) / (CH.w - CH.l - CH.r)) * n)));
      cross.setAttribute('x1', X(x)); cross.setAttribute('x2', X(x)); cross.setAttribute('visibility', 'visible');
      const rows = data.map((s) => ({ name: s.name, p: s.pts.filter(Boolean).filter((p) => p.x === x).pop() })).filter((r2) => r2.p).sort((a, b) => b.p.y - a.p.y);
      tip.innerHTML = `<b>${x === 0 ? 'Start' : 'After hand #' + (V.replay.hands[x - 1] ? V.replay.hands[x - 1].rec.no : x)}</b>${rows.map((r2) => `<div><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${colorOf(r2.name)};margin-right:6px"></i>${U.esc(r2.name)} <b class="num">${U.fmt(r2.p.y)}</b></div>`).join('')}`;
      tip.classList.remove('hidden');
      const left = ((X(x) / CH.w) * r.width);
      tip.style.left = Math.min(r.width - tip.offsetWidth - 4, Math.max(4, left + 12)) + 'px';
      tip.style.top = '10px';
    };
    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerleave', () => { tip.classList.add('hidden'); cross.setAttribute('visibility', 'hidden'); });
  }
  function stackTable() {
    const S = V.stats;
    return `<div style="overflow:auto;max-height:260px;margin-top:6px"><table style="width:100%;font-size:12px;border-collapse:collapse" class="num">
      <thead><tr><th style="text-align:left;padding:4px">Hand</th>${S.players.map((p) => `<th style="text-align:right;padding:4px">${U.esc(p.name)}</th>`).join('')}</tr></thead>
      <tbody>${V.replay.hands.map((rh) => `<tr><td style="padding:4px">#${rh.rec.no}</td>${S.players.map((pl) => { const p = rh.hand && rh.hand.players.find((q) => q.name === pl.name); return `<td style="text-align:right;padding:4px">${p ? U.fmt(p.stack) : '–'}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
  }

  onKey = (e) => {
    if (!V.replay || !$('#v-stage') || $('.modal-back')) return;
    const tg = e.target.tagName;
    if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') return;
    const map = { ArrowRight: e.shiftKey ? 'nextStreet' : 'next', ArrowLeft: e.shiftKey ? 'prevStreet' : 'prev', ArrowDown: 'nextHand', ArrowUp: 'prevHand', PageDown: 'nextHand', PageUp: 'prevHand', Home: 'start', End: 'end', ' ': 'play' };
    if (e.key === '?') { e.preventDefault(); return helpOverlay('viewer'); }
    if (map[e.key]) { e.preventDefault(); nav(map[e.key]); }
  };
  addEventListener('keydown', onKey);

  const pending = Prefs.get('viewerPending', null);
  if (pending) { Prefs.del('viewerPending'); tryLoad(pending); }
  else loadPage(Prefs.get('viewerLast', ''));
  return { destroy() { stop(); removeEventListener('keydown', onKey); if (V.table) V.table.destroy(); } };
}

/* =====================================================================
   9b. SELF-TEST SCREEN  (#/selftest)
   ===================================================================== */
function SelfTestScreen() {
  document.title = TitleFlash.base = 'Self-test · Feltroom';
  App.root.innerHTML = `<div class="page"><div class="page-inner">
    <div class="page-head"><a class="btn ghost icon-btn" href="#/" aria-label="Home">${icon('back')}</a><h2>Self-test</h2><span class="grow"></span><span id="st-sum" class="muted">Running…</span></div>
    <div class="card-ui" id="st-list" style="overflow:hidden"></div></div></div>`;
  document.body.classList.add('scroll');
  SelfTest.run((r, i, n) => { $('#st-sum').textContent = `Running… ${i}/${n}`; }).then((res) => {
    const pass = res.filter((r) => r.pass).length;
    window.__selftest = { pass, total: res.length, results: res };
    $('#st-sum').innerHTML = `<b style="color:${pass === res.length ? 'var(--accent)' : 'var(--danger)'}">${pass}/${res.length} passed</b>`;
    let g = '';
    $('#st-list').innerHTML = res.map((r) => {
      const head = r.group !== g ? `<div class="section-title" style="padding:0 12px">${U.esc((g = r.group))}</div>` : '';
      return `${head}<div class="test-row ${r.pass ? 'pass' : 'fail'}"><span class="res">${r.pass ? 'PASS' : 'FAIL'}</span><div style="flex:1">${U.esc(r.name)} <span class="hint">${r.ms} ms</span>${r.pass ? '' : `<div class="err">${U.esc(r.error)}</div>`}</div></div>`;
    }).join('');
  });
  return {};
}

/* =====================================================================
   10. ROUTER  (hash routes work on any static host without redirects)
   #/  ·  #/host  ·  #/viewer  ·  #/selftest  ·  #join=<hostPeerId>
   ===================================================================== */
let lastHash = location.hash;
function route(force) {
  const h = location.hash;
  const s = App.session;
  // Leaving a live hosted game by navigating away ends it, so confirm first.
  const home = s && s.offline ? (s.cepheus ? '#/cepheus' : '#/bots') : '#/host';
  if (!force && s && s.role === 'host' && !s.closed && lastHash.startsWith(home) && !h.startsWith(home)) {
    if (!confirm(s.offline ? 'Leave this practice game?' : 'Leave the table? As the host, this ends the game for everyone.')) { history.replaceState(null, '', lastHash); return; }
    s.leave(); App.session = null;
  }
  // A client stays connected after its game ends (a rematch invitation can still arrive), so leaving the page closes it.
  if (!force && s && s.role === 'client' && !s.closed && lastHash.startsWith('#join=') && !h.startsWith('#join=')) { s.leave(); App.session = null; }
  if (!force && s && s.role === 'watcher' && !s.ended && lastHash.startsWith('#watch=') && !h.startsWith('#watch=')) { s.leave(); App.session = null; }
  lastHash = h;
  if (App.screen && App.screen.destroy) App.screen.destroy();
  App.screen = null;
  document.body.classList.remove('viewer-mode', 'scroll');
  $$('.modal-back, .menu').forEach((m) => m.remove());
  // First visit: ask whether this is a phone or a computer, then carry on to where the link pointed.
  if (!Device.get() && !h.startsWith('#/selftest')) { App.screen = DeviceScreen(h || '#/'); return; }
  const j = h.match(/^#join=([A-Za-z0-9_-]+)/);
  const w = h.match(/^#watch=([A-Za-z0-9_-]+)/);
  if (j) App.screen = JoinScreen(j[1]);
  else if (w) App.screen = WatchScreen(w[1]);
  else if (h.startsWith('#/host')) App.screen = s && s.role === 'host' && !s.offline && !s.closed ? GameScreen(s) : HostSetupScreen();
  else if (h.startsWith('#/bots')) App.screen = s && s.offline && !s.cepheus && !s.closed ? GameScreen(s) : BotSetupScreen();
  else if (h.startsWith('#/cepheus')) App.screen = s && s.offline && s.cepheus && !s.closed ? GameScreen(s) : CepheusScreen();
  else if (h.startsWith('#/viewer')) App.screen = ViewerScreen();
  else if (h.startsWith('#/selftest')) App.screen = SelfTestScreen();
  else if (h.startsWith('#/rooms')) App.screen = RoomsScreen();
  else if (h.startsWith('#/learn')) App.screen = LearnScreen(decodeURIComponent(h.slice(8).replace(/^\//, '')));
  else App.screen = HomeScreen();
}
addEventListener('hashchange', () => route());
addEventListener('beforeunload', (e) => {
  if (App.session && App.session.role === 'host' && !App.session.closed && App.session.table.status !== 'ended') { e.preventDefault(); e.returnValue = ''; }
});
Theme.apply();
Device.apply();
route(true);
</script>
</body>
</html>
