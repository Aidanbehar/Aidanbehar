name: Build Time Skip mod

on:
  push:
    paths:
      - "timeskip/**"
      - ".github/workflows/timeskip.yml"
  pull_request:
    paths:
      - "timeskip/**"
      - ".github/workflows/timeskip.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: timeskip
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 25 (required by Minecraft 26.3)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload the mod jar
        uses: actions/upload-artifact@v5
        with:
          name: timeskip-mod
          path: |
            timeskip/build/libs/*.jar
            !timeskip/build/libs/*-sources.jar
          if-no-files-found: error
